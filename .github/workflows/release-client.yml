name: Release client SDK

# Publishes the Java client SDK (listing-guard-client, ADR-023) to GitHub Packages (Maven) when a release tag is pushed, with the
# version of the tag (v0.8.0 -> 0.8.0), its sources jar and its Javadoc jar. Only that artifact is deployed; the published POM
# is flattened (no parent). The Docker image has its own workflow (release-image.yml).

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-client-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          # writes a settings.xml with a server "github" whose credentials come from these environment variables
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Read the version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The tag $TAG is not vX.Y.Z" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set the version of every module (in this checkout only)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: >
          ./mvnw -B -ntp org.codehaus.mojo:versions-maven-plugin:2.18.0:set
          -DnewVersion="$VERSION" -DprocessAllModules=true -DgenerateBackupPoms=false

      - name: Test and publish listing-guard-client with sources and Javadoc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: >
          ./mvnw -B -ntp -pl client -Prelease deploy
          -DaltDeploymentRepository="github::https://maven.pkg.github.com/$REPOSITORY"
