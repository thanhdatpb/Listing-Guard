# Profile for the one-shot backtest (ADR-032, docs/backtest.md): no web server, the process ends when the job ends.
spring:
  main:
    web-application-type: none

listing-guard:
  embedding:
    # The backtest never embeds anything; this keeps it from needing an embedding API key (ADR-012).
    provider: hashing
  evaluation:
    backtest-dir: ${BACKTEST_DIR:eval/backtest}
