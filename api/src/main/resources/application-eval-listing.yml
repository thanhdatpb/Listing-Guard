# Profile for the one-shot labelled listing evaluation (ADR-032, eval/README.md): no web server, the process ends when the
# job ends. It reads eval/listing/ and catalogs/demo/ and writes eval/listing/out/; it writes nothing to the database.
spring:
  main:
    web-application-type: none

listing-guard:
  rulesets:
    # The job scores the ruleset versions that have the content rules of ADR-039: the sample set labels what those rules report. The default of
    # application.yml stays on the older versions, which give the findings of the other rules unchanged, and CI scores the same two files
    # (ListingEvalGateTest reads this list).
    locations:
      - classpath:rulesets/etsy-2026-12b.yaml
      - classpath:rulesets/amazon-2026-12d.yaml
  embedding:
    # The evaluation never embeds anything; this keeps it from needing an embedding API key (ADR-012).
    provider: hashing
  evaluation:
    listing-dir: ${EVAL_LISTING_DIR:eval/listing}
    demo-catalog-dir: ${EVAL_DEMO_CATALOG_DIR:catalogs/demo}
