listing-guard:
  security:
    # Clients and API keys live in the database and are managed with the admin job (ADR-007). The application
    # starts without any key (it logs a warning and answers 401 until one exists).
    # Development only, needs the `dev` profile: a key registered at start-up as client `dev`, 32+ characters.
    dev-api-key: ${LISTING_GUARD_DEV_API_KEY:}
    # Revoking a key or deactivating a client takes up to this long to take effect (0s turns the cache off).
    auth-cache-ttl: 30s
    # api_key.last_used_at is written at most once per key in this time.
    last-used-interval: 1m
  api:
    max-body-bytes: 262144
    # Development only: serves Swagger UI and opens it and /v3/api-docs without an API key.
    swagger-ui-enabled: ${LISTING_GUARD_SWAGGER_UI:false}
  rate-limit:
    enabled: true
    requests-per-minute: 60
    burst: 20
  marketplaces:
    # On the roadmap, not supported yet: a check request for one of these gets 422, not the 400 for unknown codes.
    # None today: Amazon is supported.
    planned: []
  rulesets:
    locations:
      - classpath:rulesets/etsy-2026-11.yaml
      - classpath:rulesets/amazon-2026-11.yaml
  policies:
    dir: ${POLICIES_DIR:policies}
    chunking:
      max-chars: 1500
      min-chars: 200
    search-endpoint:
      enabled: false
  embedding:
    # none (default: no model and no key; rule checks work, policy retrieval is off), api (Google Gemini, ADR-012),
    # ollama (local server) or hashing (tests and the admin job).
    provider: none
    api:
      base-url: https://generativelanguage.googleapis.com/v1beta
      model: gemini-embedding-2
      # must equal the vector(768) column of policy_chunk
      dimensions: 768
      # the key is a secret: it comes from the environment only and is never printed
      key: ${LISTING_GUARD_EMBEDDING_API_KEY:}
      batch-size: 16
      timeout: 30s
      retry-backoff: 1s
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      model: nomic-embed-text
      dimensions: 768
      timeout: 60s

spring:
  application:
    name: listing-guard-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/listingguard}
    username: ${DB_USER:listingguard}
    password: ${DB_PASSWORD:listingguard}
    hikari:
      # fail fast when the database is down (a health check or request waits at most this long for a connection)
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    # Swagger UI is for development only; it follows listing-guard.api.swagger-ui-enabled (off by default)
    enabled: ${listing-guard.api.swagger-ui-enabled:false}

logging:
  pattern:
    level: "%5p [%X{requestId:-}] [%X{client:-}/%X{keyId:-}]"
