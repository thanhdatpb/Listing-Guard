listing-guard:
  security:
    # Clients and API keys live in the database and are managed with the admin job (ADR-007). The application
    # starts without any key (it logs a warning and answers 401 until one exists).
    # Development only, needs the `dev` profile: a key registered at start-up as client `dev`, 32+ characters.
    dev-api-key: ${LISTING_GUARD_DEV_API_KEY:}
    # Revoking a key or deactivating a client takes up to this long to take effect (0s turns the cache off).
    auth-cache-ttl: 30s
    # api_key.last_used_at is written at most once per key in this time.
    last-used-interval: 1m
  api:
    max-body-bytes: 262144
    # Development only: serves Swagger UI and opens it and /v3/api-docs without an API key.
    swagger-ui-enabled: ${LISTING_GUARD_SWAGGER_UI:false}
    deprecation:
      # Operations this deployment announces as deprecated (ADR-022). Every response of one carries Deprecation (RFC 9745), and
      # Sunset (RFC 8594) and Link rel="deprecation" when set. None by default. The start-up fails on an entry that names no
      # /api/v1 operation, a Sunset less than 180 days after the Deprecation date, or a link that is not https. Example:
      #   - method: GET
      #     path: /api/v1/checks/{id}              # exactly as docs/api/openapi.json writes it
      #     deprecated-at: 2027-01-01               # a date (midnight UTC) or an ISO-8601 instant
      #     sunset-at: 2027-07-01T00:00:00Z         # optional
      #     link: https://github.com/thanhdatpb/Listing-Guard/blob/main/docs/integration-guide.md#compatibility-and-versions
      endpoints: []
  console:
    enabled: ${LISTING_GUARD_CONSOLE_ENABLED:false}
    base-url: ${LISTING_GUARD_CONSOLE_BASE_URL:}
    auth-mode: ${LISTING_GUARD_CONSOLE_AUTH_MODE:MAGIC_LINK}
    cookie-secure: ${LISTING_GUARD_CONSOLE_COOKIE_SECURE:true}
    mail-from: ${LISTING_GUARD_CONSOLE_MAIL_FROM:}
    email-limit: 5
    ip-limit: 30
    rate-window: 15m
    # The most active API keys one console account may hold (the "API keys" page). Keys made by the admin job count too.
    max-active-keys: ${LISTING_GUARD_CONSOLE_MAX_ACTIVE_KEYS:5}
    access-team-domain: ${LISTING_GUARD_CONSOLE_ACCESS_TEAM_DOMAIN:}
    access-aud: ${LISTING_GUARD_CONSOLE_ACCESS_AUD:}
    access-certs-url: ${LISTING_GUARD_CONSOLE_ACCESS_CERTS_URL:}
    access-cert-cache-ttl: ${LISTING_GUARD_CONSOLE_ACCESS_CERT_CACHE_TTL:1h}
    access-allowed-domains: ${LISTING_GUARD_CONSOLE_ACCESS_ALLOWED_DOMAINS:}
    access-allowed-emails: ${LISTING_GUARD_CONSOLE_ACCESS_ALLOWED_EMAILS:}
    access-auto-create: ${LISTING_GUARD_CONSOLE_ACCESS_AUTO_CREATE:false}
    access-default-client-name: ${LISTING_GUARD_CONSOLE_ACCESS_DEFAULT_CLIENT_NAME:}
  rate-limit:
    enabled: true
    requests-per-minute: 60
    burst: 20
  marketplaces:
    # On the roadmap, not supported yet: a check request for one of these gets 422, not the 400 for unknown codes.
    # None today: Amazon is supported.
    planned: []
  fixes:
    # Verified fix suggestions and listing-rules readiness (ADR-014); opt in because runDetailed reruns rules per fix.
    enabled: ${LISTING_GUARD_FIXES_ENABLED:false}
  rulesets:
    locations:
      - classpath:rulesets/etsy-2026-12.yaml
      - classpath:rulesets/amazon-2026-12c.yaml
  trademark:
    # The trademark ruleset (ADR-009), registered for each marketplace below as pack `trademark-risk` (ADR-010).
    ruleset: classpath:rulesets/trademark-risk-2026-11b.yaml
    marketplaces:
      - ETSY
      - AMAZON
    # The catalog version served for trademark checks, exactly as the trademark-import job printed it. Empty (the
    # default) turns trademark checks off; the application and /checks need nothing else. There is no "latest": a newer
    # import changes nothing until this value changes. It must have been imported with the active ruleset, or trademark
    # checks are refused.
    catalog-version: ${LISTING_GUARD_TRADEMARK_CATALOG_VERSION:}
    activation:
      # true serves the catalog version of the latest row of the activation log (ADR-009, PR A2d) instead of catalog-version
      # above, which must then be empty: the uspto-sync job activates a version after an import that succeeded, and the admin
      # job's `catalog activate` and `catalog rollback` change it by hand. Off by default: catalog-version decides, as before.
      # A DEMO catalog is never served this way.
      follow: ${LISTING_GUARD_TRADEMARK_ACTIVATION_FOLLOW:false}
      # How often the API reads the log again; a new activation is served at the latest after this, without a restart.
      refresh-interval: 1m
    # manifest.yaml and raw/ for the import job
    catalogs-dir: ${CATALOGS_DIR:catalogs}
    uspto:
      # The uspto-convert job (ADR-009, PR A2b) reads only version 2.0 of the Trademark Applications Daily DTD and
      # stops on another version-no. true reads it anyway; the output is then unchecked against that version.
      allow-other-version: false
      # USPTO status code to catalog status. A published version is immutable: a change is a new file.
      status-map: classpath:uspto/uspto-status-map-2026-11.yaml
      # What the job keeps (ADR-009, PR A2c): the Nice classes, the status codes that are live, text-only marks, and how a
      # date is read from a file name. Every value in the shipped file is unverified. A published version is immutable: copy
      # it to a new file with a new version and name it here (classpath: or file:).
      filters: classpath:uspto/uspto-convert-filters-2026-11.yaml
      # true stops the job at the first problem (a file it cannot read, a record without a serial number or a transaction
      # date) instead of leaving the file out and reporting INCOMPLETE. `--strict` on the job does the same.
      strict: false
      # The most distinct serial numbers the job holds in memory (about 17 to 34 bytes each) to decide the latest record of
      # each. More stops the job with a message; raise it together with the heap.
      max-distinct-serials: 12000000
      # The uspto-sync job (ADR-009, PR A2d); every setting and its default is in UsptoSyncProperties. It needs
      # sync.catalog.license (USPTO_SYNC_LICENSE in compose) before it runs.
      sync:
        download:
          # Off by default: the job then reads folders of catalogs/raw (--input-dir) and the files it stored. Every ODP
          # endpoint is unverified (ADR-009, "Verification steps when the key exists").
          enabled: false
          # The USPTO Open Data Portal key, only from this environment variable; sent only to the API host, never logged.
          api-key: ${LISTING_GUARD_USPTO_ODP_API_KEY:}
    # The TSDR status check (ADR-009, "TSDR status check"): the tsdr-status job and the optional status next to a finding;
    # every setting and its default is in TsdrProperties. Nothing here changes the ruleset, the matcher, a hash or a fingerprint.
    tsdr:
      download:
        # Off by default: the job then only reads TSDR files you saved yourself (--input-dir), or lists marks (--dry-run).
        # The key header and the status field names are unverified (ADR-009).
        enabled: ${LISTING_GUARD_TSDR_DOWNLOAD_ENABLED:false}
        # The TSDR key, only from this environment variable; sent only to the TSDR host, never logged.
        api-key: ${LISTING_GUARD_TSDR_API_KEY:}
      finding-status:
        # true adds the last TSDR status and its check date to each trademark finding (an optional member, read when the answer
        # is built and never stored). Off: the answer is unchanged.
        enabled: ${LISTING_GUARD_TRADEMARK_TSDR_FINDING_STATUS_ENABLED:false}
    retention:
      # How long a trademark result, its input hash and its evidence are kept (ADR-009). An operational proposal, not a
      # legal guarantee. GET and the cache lookup treat a row past this as absent whether or not the cleanup has run.
      period: 30d
      # The scheduled cleanup of expired results runs in every API instance; an advisory lock lets one delete at a time.
      cleanup-enabled: true
      cleanup-interval: 1h
      cleanup-initial-delay: 1m
      cleanup-batch-size: 500
  variation:
    # The variation ruleset (ADR-015), registered for each marketplace below as pack `variation-checks` (ADR-010).
    ruleset: classpath:rulesets/variation-checks-2026-11.yaml
    marketplaces:
      - ETSY
      - AMAZON
    retention:
      # How long a variation result, its input hash and its evidence are kept (ADR-015), as for trademark results: an
      # operational proposal, not a guarantee. GET and the cache lookup treat a row past this as absent whether or not the
      # cleanup has run.
      period: 30d
      # The scheduled cleanup runs in every API instance and shares the retention advisory lock with the trademark cleanup,
      # so one batch of either runs at a time; a skipped run is tried again at the next interval.
      cleanup-enabled: true
      cleanup-interval: 1h
      cleanup-initial-delay: 2m
      cleanup-batch-size: 500
  personalization:
    # The personalization ruleset (ADR-016), registered for each marketplace below as pack `personalization-screening`
    # (ADR-010). The trademark part of a screening uses the catalog named by listing-guard.trademark.catalog-version, and
    # runs without one (the screening is then INCOMPLETE, never charged).
    ruleset: classpath:rulesets/personalization-screening-2026-11.yaml
    marketplaces:
      - ETSY
      - AMAZON
    retention:
      # How long a screening result, its input hash and its evidence are kept (ADR-016). The text the buyer typed is never
      # stored. An operational proposal, not a guarantee. GET and the cache lookup treat a row past this as absent whether or
      # not the cleanup has run.
      period: 30d
      # The scheduled cleanup runs in every API instance and shares the retention advisory lock with the trademark and
      # variation cleanups, so one batch of any of them runs at a time; a skipped run is tried again at the next interval.
      cleanup-enabled: true
      cleanup-interval: 1h
      cleanup-initial-delay: 3m
      cleanup-batch-size: 500
  image:
    # The image checks (ADR-008): POST /api/v1/image-checks. OFF by default. The bounded decode service and the private upload
    # staging of ADR-008 "Image input security" are not built yet, so do not turn this on for a caller you do not trust.
    enabled: ${LISTING_GUARD_IMAGE_ENABLED:false}
    # The ruleset of each marketplace, registered as pack `image-compliance` (ADR-010). The shipped rulesets keep every marketplace
    # threshold null until the maintainer has reviewed the official pages, so a check against them is always INCOMPLETE.
    rulesets:
      ETSY: classpath:rulesets/etsy-image-2026-11.yaml
      AMAZON: classpath:rulesets/amazon-image-2026-11.yaml
    # Operational limits of this deployment, not marketplace rules (those are in the rulesets).
    default-profile: default
    max-images: 20
    max-file-size: 10MB
    max-request-size: 60MB
    retention:
      # How long an image check, its hashes and its evidence are kept (ADR-008). The images themselves are never stored. An
      # operational proposal, not a guarantee. GET and the cache lookup treat a row past this as absent whether or not the cleanup
      # has run.
      period: 30d
      # The scheduled cleanup runs in every API instance and shares the retention advisory lock with the trademark, variation and
      # personalization cleanups, so one batch of any of them runs at a time; a skipped run is tried again at the next interval.
      cleanup-enabled: true
      cleanup-interval: 1h
      cleanup-initial-delay: 4m
      cleanup-batch-size: 500
  batch:
    # The batch-check job (docs/batch-check.md): mappings, inputs and reports; the reports go to <dir>/out by default.
    dir: ${BATCH_DIR:batch}
  reports:
    # The listing health report (ADR-018): GET /api/v1/reports/summary, the health-report job and the console page.
    # The longest period a report may cover, in days counting both ends.
    max-days: 92
    # How many rules, and how many trademark marks, a ranked list holds (1 to 50).
    top-rules: 10
    top-marks: 10
    # The period of the job and the console page when none is named: this many complete UTC days before today.
    default-days: 7
  health-report:
    # The health-report job (docs/deployment.md): it writes <dir>/out/<UTC timestamp>/report.html and report.json.
    dir: ${HEALTH_REPORT_DIR:health-report}
  policies:
    dir: ${POLICIES_DIR:policies}
    chunking:
      max-chars: 1500
      min-chars: 200
    search-endpoint:
      enabled: false
  embedding:
    # none (default: no model and no key; rule checks work, policy retrieval is off), api (Google Gemini, ADR-012),
    # ollama (local server) or hashing (tests and the admin job).
    provider: none
    api:
      base-url: https://generativelanguage.googleapis.com/v1beta
      model: gemini-embedding-2
      # must equal the vector(768) column of policy_chunk
      dimensions: 768
      # the key is a secret: it comes from the environment only and is never printed
      key: ${LISTING_GUARD_EMBEDDING_API_KEY:}
      batch-size: 16
      timeout: 30s
      retry-backoff: 1s
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      model: nomic-embed-text
      dimensions: 768
      timeout: 60s

spring:
  application:
    name: listing-guard-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/listingguard}
    username: ${DB_USER:listingguard}
    password: ${DB_PASSWORD:listingguard}
    hikari:
      # fail fast when the database is down (a health check or request waits at most this long for a connection)
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    postgresql:
      # The default transactional advisory lock keeps a transaction open on Flyway's own connection, and
      # CREATE/DROP INDEX CONCURRENTLY (V9, V11, V13) waits for every open transaction: the migration would hang.
      transactional-lock: false
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # The upload limits of the image checks (ADR-008), taken from listing-guard.image so that there is one place to change them.
      # They hold for every multipart request, and the API has no other multipart endpoint.
      max-file-size: ${listing-guard.image.max-file-size:10MB}
      max-request-size: ${listing-guard.image.max-request-size:60MB}
  http:
    converters:
      # ADR-020: Spring Boot 4 serializes request and response bodies with Jackson 3 (tools.jackson) when it is on the classpath,
      # and it is (Spring Boot's own starter and Flyway bring it). The controllers and the problem responses use Jackson 2
      # (com.fasterxml.jackson), so this keeps the web layer on the Jackson 2 ObjectMapper of spring-boot-jackson2. It is a
      # deprecated value of a Boot property (see the 'spring.http.converters.preferred-json-mapper' metadata) and goes away with the
      # move to Jackson 3.
      preferred-json-mapper: jackson2

server:
  tomcat:
    accesslog:
      # Use the path-only token, never the request line (`%r` includes query parameters such as magic-link tokens).
      pattern: '%h %l %u %t "%m %U %H" %s %b'
  servlet:
    session:
      timeout: 8h
      cookie:
        name: LISTINGGUARDSESSION
        http-only: true
        secure: ${listing-guard.console.cookie-secure:true}
        same-site: lax

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    # Swagger UI is for development only; it follows listing-guard.api.swagger-ui-enabled (off by default)
    enabled: ${listing-guard.api.swagger-ui-enabled:false}

logging:
  pattern:
    level: "%5p [%X{requestId:-}] [%X{client:-}/%X{keyId:-}]"
