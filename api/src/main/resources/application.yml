listing-guard:
  rulesets:
    locations:
      - classpath:rulesets/etsy-2026-11.yaml
  policies:
    dir: ${POLICIES_DIR:policies}
    chunking:
      max-chars: 1500
      min-chars: 200
    search-endpoint:
      enabled: false
  embedding:
    provider: ollama
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      model: nomic-embed-text
      dimensions: 768
      timeout: 60s

spring:
  application:
    name: listing-guard-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/listingguard}
    username: ${DB_USER:listingguard}
    password: ${DB_PASSWORD:listingguard}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
