listing-guard:
  marketplaces:
    # On the roadmap, not supported yet: a check request for one of these gets 422, not the 400 for unknown codes.
    planned:
      - AMAZON
  rulesets:
    locations:
      - classpath:rulesets/etsy-2026-11.yaml
  policies:
    dir: ${POLICIES_DIR:policies}
    chunking:
      max-chars: 1500
      min-chars: 200
    search-endpoint:
      enabled: false
  embedding:
    provider: ollama
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      model: nomic-embed-text
      dimensions: 768
      timeout: 60s

spring:
  application:
    name: listing-guard-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/listingguard}
    username: ${DB_USER:listingguard}
    password: ${DB_PASSWORD:listingguard}
    hikari:
      # fail fast when the database is down (a health check or request waits at most this long for a connection)
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    # Swagger UI is for development only; see the integration guide
    enabled: false
