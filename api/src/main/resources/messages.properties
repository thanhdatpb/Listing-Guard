# The texts of the console, English (ADR-028). This is the base bundle: a key that messages_vi.properties does not have shows
# this text. Every key is in both files (a test holds it).
#
# Rules for writing a message:
#  - A message holds no markup. A value (an e-mail address, a number, a rule id) is an argument, {0}, {1}; a template prints the
#    whole message with th:text.
#  - A message that has arguments goes through java.text.MessageFormat, so an apostrophe in it is written twice ('').
#    A message without arguments is printed as written, so there an apostrophe is written once.
#  - A key that starts with "js." is a pattern for JavaScript with {0}, {1}...: it is written into a data-i18n-* attribute and
#    never gets arguments, so it follows the second rule.
#  - Rule ids, fields, evidence, versions, the codes of the enumerations (ERROR, HIGH, COMPLETE...) and the text of a finding
#    (message, suggestion, fix) are not here: they come from the API as they are.

