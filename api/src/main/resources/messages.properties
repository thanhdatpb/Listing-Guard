nav.reaudit=Re-audit
reaudit.title=Periodic re-audit - Listing Guard
reaudit.heading=Periodic re-audit
reaudit.intro=Upload the file of the listings you have on sale (the marketplace export, or your Sheet saved as CSV). New marks reach the USPTO register every day, so a listing that was safe last month can hit one today. The page checks every row, tells new risks from known ones, shows what changed since the last run and lists what to fix. It checks and suggests only: nothing is published or changed on a marketplace.
