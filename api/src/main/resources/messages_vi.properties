# Chữ của console, tiếng Việt (ADR-028). Mọi khóa của messages.properties đều có ở đây và ngược lại (có test kiểm tra).
# Cách viết xem đầu messages.properties: thông điệp có tham số {0} đi qua MessageFormat nên dấu nháy đơn phải viết đôi ('');
# thông điệp không có tham số được in nguyên văn. Khóa bắt đầu bằng "js." là mẫu cho JavaScript, không bao giờ có tham số.
# Mã quy tắc, tên trường, bằng chứng, phiên bản, mã của các enum (ERROR, HIGH, COMPLETE...) và chữ của một phát hiện (message,
# suggestion, fix) không nằm ở đây: chúng đến từ API đúng như vậy.

