# What each rule checks, in one sentence, English (ADR-028). The key is rule.<rule id>. rules_vi.properties has the Vietnamese
# sentence; a rule id with no Vietnamese sentence shows this one.
#
# A sentence says what the rule looks at. It is not a verdict on a listing, it names no number (the finding carries the real
# one, and a number written here would drift from the ruleset) and it claims nothing about a marketplace's policy that the
# ruleset's own notes do not. A rule id that two packs use (required_fields, title_length, title_repeated_words) has one
# sentence that holds for both. A rule that is switched off in the shipped rulesets (banned_words, bullet_length) has none.
# No arguments are ever given to these messages, so an apostrophe is written once.

# ---- listing rules, Etsy and Amazon ----
rule.required_fields=Checks that the fields the ruleset requires for this marketplace are filled in.
rule.title_length=Checks that the title is not longer than the title limit in the ruleset.
rule.title_repeated_words=Reports a word that appears in the title more often than the ruleset allows. Short linking words such as articles and prepositions are not counted.
rule.title_characters=Checks that the title uses only characters the marketplace accepts in a title.
rule.title_repeated_special_chars=Checks that some special characters are not used more than once in the title.
rule.title_word_count=Reports a title with more words than the ruleset suggests keeping.
rule.title_promotional_terms=Reports promotional wording in the title, such as sale or price terms, which the marketplace guidance advises against.
rule.tag_count=Checks that the listing does not have more tags than the limit in the ruleset.
rule.tag_length=Checks that no tag is longer than the tag length limit in the ruleset.
rule.tag_characters=Checks that tags use only characters the marketplace accepts in a tag.
rule.duplicate_tags=Reports two tags that are the same when upper and lower case are ignored.
rule.price_quantity_positive=Checks that the price and the quantity are greater than zero.
rule.personalization_question_count=Checks how many personalization questions the listing has, and how many of them ask the buyer to upload a file.
rule.personalization_question_text=Checks that the text of each personalization question is neither empty nor too long.
rule.personalization_dropdown_options=Checks the options of a dropdown question: how many there are, how long each label is, and that no label is repeated.
rule.personalization_upload_files=Checks how many files an upload question lets the buyer send.
rule.personalization_instructions_length=Checks that the personalization instructions are not longer than the limit in the ruleset.
rule.personalization_free_text_sensitive=Reminds you that a question where the buyer can type anything may bring in a brand or team name. It is a hint, not a verdict.
rule.title_forbidden_chars=Reports characters that are not allowed in an Amazon title unless they are part of the brand name.
rule.bullet_count=Checks that the listing does not have more bullet points than the limit in the ruleset.
rule.item_highlights_length=Checks that the item highlights are not longer than the limit in the ruleset.
rule.description_length=Checks that the description is not longer than the length set in the ruleset.
rule.search_terms_length=Checks that the search terms are not longer than the limit in the ruleset, counted in bytes and not in characters.
rule.prohibited_content=Looks in the title, description, bullet points and item highlights for the patterns of content that the ruleset marks as not allowed.
rule.customization_text_input_count=Checks how many text inputs the custom product has in all its print surfaces together.
rule.customization_dropdown_options=Checks how many dropdown options a print surface has, and whether a label is repeated inside one dropdown.
rule.customization_image_input_count=Checks how many image uploads a print surface lets the buyer make.
rule.customization_text_input_max_chars=Checks that every text input says the most characters a buyer may type into it.
rule.customization_free_text_sensitive=Reminds you that a text input where the buyer can type anything may bring in a brand or team name. It is a hint, not a verdict.
rule.category_not_covered=Tells you that the ruleset has no settings of its own for this product type, so the default settings were used.

# ---- variation checks ----
rule.parent_child_structure=Checks that the parent and its children fit together: the parent has a SKU and a variation theme, each child points to the parent SKU, and each child fills in the attributes of the theme.
rule.variation_theme_allowed=Checks that the variation theme is one the ruleset knows for the product type.
rule.apparel_size_attributes=Checks that each child of a clothing product has the size attributes the ruleset expects, with values it knows, and a size range that runs from small to large.
rule.duplicate_combination=Reports two children that have the same combination of attribute values.
rule.duplicate_sku=Reports a SKU used by more than one child, or a child that uses the SKU of its parent.
rule.children_differ_outside_theme=A guess from the titles: reports children that differ in more than size and color, which can mean they are different products under one parent.
rule.etsy_variation_limits=Checks the variations of an Etsy listing against the ruleset: how many types of variation it has, and whether a property that cannot be a variation is used.

# ---- personalization screening: the text a buyer typed ----
rule.unsupported_characters=Reports characters in the buyer text that the print profile cannot print.
rule.too_long=Reports buyer text that is longer than the print profile allows.
rule.whitespace_issue=Reports spaces at the start or the end of the buyer text, or several spaces in a row, which can shift the print.

# ---- trademark ----
rule.catalog_exact=A word in the text is the same as a mark in the reference catalog.
rule.catalog_phrase=A phrase in the text is the same as a mark in the reference catalog.
rule.catalog_fuzzy=A phrase in the text is close to, but not the same as, a mark in the reference catalog, for example a misspelling.
rule.geo_sport_combination=A place name next to a sport word can suggest a sports team.
rule.color_name_contains_mark=A mark was found inside a color description. The color wording explains the match; it does not lower the risk.
rule.pure_color_description=A phrase made only of color and pattern words, with no trademark reference found in it. It is for information and never raises the risk.
