# Mỗi quy tắc kiểm tra điều gì, một câu, tiếng Việt (ADR-028). Khóa là rule.<mã quy tắc>. Mã nào chưa có câu tiếng Việt sẽ hiện câu
# tiếng Anh ở rules.properties.
#
# Câu chỉ nói quy tắc nhìn vào đâu. Đó không phải kết luận về một listing, không nêu con số nào (con số thật nằm trong phát hiện, và
# một con số viết ở đây sẽ lệch với bộ quy tắc) và không khẳng định điều gì về chính sách của sàn ngoài những gì ghi chú của bộ quy
# tắc đã nói. Một mã dùng chung cho hai pack (required_fields, title_length, title_repeated_words) chỉ có một câu đúng cho cả hai.
# Các thông điệp này không bao giờ có tham số, nên dấu nháy đơn viết một lần.

# ---- quy tắc listing, Etsy và Amazon ----
rule.required_fields=Kiểm tra các trường mà bộ quy tắc yêu cầu cho sàn này đã được điền đủ chưa.
rule.title_length=Kiểm tra tiêu đề không dài quá giới hạn tiêu đề trong bộ quy tắc.
rule.title_repeated_words=Báo khi một từ xuất hiện trong tiêu đề nhiều lần hơn bộ quy tắc cho phép. Các từ nối ngắn như mạo từ và giới từ không được đếm.
rule.title_characters=Kiểm tra tiêu đề chỉ dùng những ký tự mà sàn chấp nhận trong tiêu đề.
rule.title_repeated_special_chars=Kiểm tra một số ký tự đặc biệt không bị dùng quá một lần trong tiêu đề.
rule.title_word_count=Báo khi tiêu đề có nhiều từ hơn mức bộ quy tắc khuyên nên giữ.
rule.title_promotional_terms=Báo khi tiêu đề có từ ngữ khuyến mãi, như từ về giảm giá hay giá bán, điều mà hướng dẫn của sàn khuyên không nên làm.
rule.tag_count=Kiểm tra listing không có nhiều tag hơn giới hạn trong bộ quy tắc.
rule.tag_length=Kiểm tra không có tag nào dài hơn giới hạn độ dài tag trong bộ quy tắc.
rule.tag_characters=Kiểm tra tag chỉ dùng những ký tự mà sàn chấp nhận trong một tag.
rule.duplicate_tags=Báo khi hai tag giống nhau nếu bỏ qua khác biệt chữ hoa chữ thường.
rule.price_quantity_positive=Kiểm tra giá và số lượng đều lớn hơn không.
rule.personalization_question_count=Kiểm tra listing có bao nhiêu câu hỏi cá nhân hóa, và bao nhiêu câu trong đó yêu cầu người mua tải tệp lên.
rule.personalization_question_text=Kiểm tra chữ của mỗi câu hỏi cá nhân hóa không rỗng và không quá dài.
rule.personalization_dropdown_options=Kiểm tra các lựa chọn của câu hỏi dạng danh sách thả xuống: có bao nhiêu lựa chọn, mỗi nhãn dài bao nhiêu, và không có nhãn nào bị lặp.
rule.personalization_upload_files=Kiểm tra một câu hỏi tải tệp cho người mua gửi tối đa bao nhiêu tệp.
rule.personalization_instructions_length=Kiểm tra phần hướng dẫn cá nhân hóa không dài quá giới hạn trong bộ quy tắc.
rule.personalization_free_text_sensitive=Nhắc rằng ở câu hỏi mà người mua gõ gì cũng được, họ có thể đưa vào tên thương hiệu hoặc tên đội. Đây là lời nhắc, không phải kết luận.
rule.title_forbidden_chars=Báo các ký tự không được dùng trong tiêu đề Amazon, trừ khi chúng nằm trong tên thương hiệu.
rule.bullet_count=Kiểm tra listing không có nhiều gạch đầu dòng hơn giới hạn trong bộ quy tắc.
rule.item_highlights_length=Kiểm tra phần điểm nổi bật của sản phẩm không dài quá giới hạn trong bộ quy tắc.
rule.description_length=Kiểm tra phần mô tả không dài quá độ dài đặt trong bộ quy tắc.
rule.search_terms_length=Kiểm tra từ khóa tìm kiếm không dài quá giới hạn trong bộ quy tắc; độ dài tính bằng byte chứ không tính bằng ký tự.
rule.prohibited_content=Tìm trong tiêu đề, mô tả, gạch đầu dòng và điểm nổi bật những mẫu nội dung mà bộ quy tắc đánh dấu là không được phép.
rule.customization_text_input_count=Kiểm tra sản phẩm tùy chỉnh có tổng cộng bao nhiêu ô nhập chữ trên tất cả các mặt in.
rule.customization_dropdown_options=Kiểm tra một mặt in có bao nhiêu lựa chọn trong danh sách thả xuống, và có nhãn nào bị lặp trong cùng một danh sách không.
rule.customization_image_input_count=Kiểm tra một mặt in cho người mua tải lên bao nhiêu ảnh.
rule.customization_text_input_max_chars=Kiểm tra mỗi ô nhập chữ có nêu số ký tự tối đa người mua được gõ vào.
rule.customization_free_text_sensitive=Nhắc rằng ở ô nhập chữ mà người mua gõ gì cũng được, họ có thể đưa vào tên thương hiệu hoặc tên đội. Đây là lời nhắc, không phải kết luận.
rule.category_not_covered=Cho biết bộ quy tắc chưa có thiết lập riêng cho loại sản phẩm này, nên đã dùng thiết lập mặc định.

# ---- kiểm tra biến thể ----
rule.parent_child_structure=Kiểm tra parent và các child khớp với nhau: parent có SKU và variation theme, mỗi child trỏ về SKU của parent, và mỗi child điền đủ các thuộc tính của theme.
rule.variation_theme_allowed=Kiểm tra variation theme có nằm trong những theme mà bộ quy tắc biết cho loại sản phẩm này không.
rule.apparel_size_attributes=Kiểm tra mỗi child của sản phẩm quần áo có các thuộc tính size mà bộ quy tắc mong đợi, với giá trị mà nó biết, và khoảng size chạy từ nhỏ đến lớn.
rule.duplicate_combination=Báo khi hai child có cùng một tổ hợp giá trị thuộc tính.
rule.duplicate_sku=Báo khi một SKU được nhiều child dùng, hoặc một child dùng SKU của parent.
rule.children_differ_outside_theme=Phỏng đoán từ tiêu đề: báo các child khác nhau nhiều hơn size và màu, điều có thể có nghĩa là chúng là các sản phẩm khác nhau nằm chung một parent.
rule.etsy_variation_limits=Kiểm tra các biến thể của một listing Etsy theo bộ quy tắc: có bao nhiêu loại biến thể, và có dùng thuộc tính không được làm biến thể hay không.

# ---- sàng lọc cá nhân hóa: chữ do người mua gõ ----
rule.unsupported_characters=Báo các ký tự trong chữ của người mua mà hồ sơ in không in được.
rule.too_long=Báo khi chữ của người mua dài hơn hồ sơ in cho phép.
rule.whitespace_issue=Báo khoảng trắng ở đầu hoặc cuối chữ của người mua, hoặc nhiều khoảng trắng liên tiếp, có thể làm chữ in bị lệch.

# ---- nhãn hiệu ----
rule.catalog_exact=Một từ trong văn bản trùng với một nhãn hiệu trong danh mục tham chiếu.
rule.catalog_phrase=Một cụm trong văn bản trùng với một nhãn hiệu trong danh mục tham chiếu.
rule.catalog_fuzzy=Một cụm trong văn bản gần giống, nhưng không trùng, với một nhãn hiệu trong danh mục tham chiếu, ví dụ do viết sai chính tả.
rule.geo_sport_combination=Một địa danh đứng cạnh một từ thể thao có thể gợi đến một đội thể thao.
rule.color_name_contains_mark=Tìm thấy một nhãn hiệu bên trong cụm mô tả màu. Cách gọi màu giải thích việc khớp này; nó không làm giảm mức rủi ro.
rule.pure_color_description=Một cụm chỉ gồm từ chỉ màu và hoa văn, không thấy tham chiếu nhãn hiệu nào trong đó. Chỉ để tham khảo và không bao giờ làm tăng mức rủi ro.
