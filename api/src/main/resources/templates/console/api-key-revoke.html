<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{revoke.title}"></title>
    <link rel="stylesheet" th:href="@{/console/editor.css}">
    <link rel="stylesheet" th:href="@{/console/console.css}">
</head>
<body>
<div th:replace="~{console/layout :: demoBanner}"></div>
<header th:replace="~{console/layout :: nav('keys')}"></header>
<main class="page">
    <h1 th:text="#{revoke.heading}"></h1>
    <dl class="facts">
        <dt th:text="#{keys.col.keyid}"></dt>
        <dd><code th:text="${key.keyId}"></code></dd>
        <dt th:text="#{keys.col.label}"></dt>
        <dd><span th:if="${key.label != null}" th:text="${key.label}"></span><span class="muted" th:if="${key.label == null}" th:text="#{keys.nolabel}"></span></dd>
        <dt th:text="#{keys.col.created}"></dt>
        <dd th:text="${key.created}"></dd>
        <dt th:text="#{keys.col.lastused}"></dt>
        <dd><span th:if="${key.lastUsed != null}" th:text="${key.lastUsed}"></span><span class="muted" th:if="${key.lastUsed == null}" th:text="#{keys.never}"></span></dd>
    </dl>
    <p class="warning-text" th:text="#{revoke.warning}"></p>
    <form method="post" th:action="@{/console/api-keys/{id}/revoke(id=${key.keyId})}">
        <div class="confirm-actions">
            <button type="submit" class="danger" th:text="#{revoke.submit}"></button>
            <a th:href="@{/console/api-keys}" th:text="#{revoke.cancel}"></a>
        </div>
    </form>
</main>
</body>
</html>
