<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{keys.title}"></title>
    <link rel="stylesheet" th:href="@{/console/editor.css}">
    <link rel="stylesheet" th:href="@{/console/console.css}">
    <script th:src="@{/console/keys.js}" defer></script>
</head>
<body>
<div th:replace="~{console/layout :: demoBanner}"></div>
<header th:replace="~{console/layout :: nav('keys')}"></header>
<main class="page">
    <h1 th:text="#{keys.heading}"></h1>
    <p class="muted">
        <span th:text="#{common.signedin(${email})}"></span>
        <span th:text="#{keys.intro.before}"></span> <code>X-API-Key</code> <span th:text="#{keys.intro.after}"></span>
    </p>

    <div class="notice applied" id="notice" role="status" th:if="${notice != null}"><p th:text="${notice}"></p></div>
    <div class="notice refused" id="error" role="alert" th:if="${error != null}"><p th:text="${error}"></p></div>

    <section class="secret-box" id="new-key" th:if="${issued != null}" aria-labelledby="new-key-heading">
        <h2 id="new-key-heading" th:text="#{keys.new.heading}"></h2>
        <p class="warning-text" th:text="#{keys.new.warning}"></p>
        <div class="secret-row">
            <label for="new-secret" class="visually-hidden" th:text="#{keys.new.label}"></label>
            <input type="text" id="new-secret" readonly autocomplete="off" spellcheck="false" th:value="${issued.secret}">
            <button type="button" id="copy-secret" data-copy-from="new-secret" hidden th:text="#{keys.copy}"
                    th:attr="data-i18n-select=#{js.keys.select},data-i18n-copied=#{js.keys.copied},data-i18n-failed=#{js.keys.failed}"></button>
        </div>
        <p class="copy-status" id="copy-status" role="status" aria-live="polite"></p>
        <p class="muted small"><span th:text="#{keys.new.keyid}"></span> <code th:text="${issued.keyId}"></code><span th:text="#{keys.new.keyid.after}"></span></p>
    </section>

    <h2 id="keys-heading">
        <span th:text="#{keys.active.heading}"></span>
        <span class="muted" id="key-count" th:text="#{keys.count(${#strings.toString(activeCount)}, ${#strings.toString(maxActiveKeys)})}"></span>
    </h2>
    <p id="no-keys" th:if="${keys.isEmpty()}" th:text="#{keys.none}"></p>
    <table class="keys" id="keys-table" th:unless="${keys.isEmpty()}" aria-labelledby="keys-heading">
        <thead>
        <tr>
            <th scope="col" th:text="#{keys.col.keyid}"></th>
            <th scope="col" th:text="#{keys.col.label}"></th>
            <th scope="col" th:text="#{keys.col.created}"></th>
            <th scope="col" th:text="#{keys.col.lastused}"></th>
            <th scope="col"><span class="visually-hidden" th:text="#{keys.col.action}"></span></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="key : ${keys}">
            <td><code th:text="${key.keyId}"></code></td>
            <td class="label"><span th:if="${key.label != null}" th:text="${key.label}"></span><span class="muted" th:if="${key.label == null}" th:text="#{keys.nolabel}"></span></td>
            <td><time th:text="${key.created}"></time></td>
            <td><time th:if="${key.lastUsed != null}" th:text="${key.lastUsed}"></time><span class="muted" th:if="${key.lastUsed == null}" th:text="#{keys.never}"></span></td>
            <td><a class="button danger" th:href="@{/console/api-keys/{id}/revoke(id=${key.keyId})}" th:aria-label="#{keys.revoke.aria(${key.keyId})}" th:text="#{keys.revoke}"></a></td>
        </tr>
        </tbody>
    </table>

    <h2 th:text="#{keys.create.heading}"></h2>
    <p id="limit-message" th:unless="${canCreate}" th:text="#{keys.limit.message(${#strings.toString(maxActiveKeys)})}"></p>
    <form id="create-form" method="post" th:action="@{/console/api-keys}" th:if="${canCreate}">
        <div class="field">
            <label for="label"><span th:text="#{keys.label.label}"></span> <span class="muted" th:text="#{keys.label.optional(${#strings.toString(maxLabelLength)})}"></span></label>
            <input type="text" id="label" name="label" autocomplete="off" th:attr="maxlength=${maxLabelLength}" th:value="${label}">
            <p class="hint" th:text="#{keys.label.hint}"></p>
        </div>
        <button type="submit" class="primary" th:text="#{keys.create.submit}"></button>
    </form>
</main>
</body>
</html>
