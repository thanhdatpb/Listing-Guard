<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Parts of the bulk check page (ADR-029, ADR-041). This file is never served on its own; bulk.html includes the fragments below.
     Every value is printed with th:text, so a listing's text is never markup. The detail of a row has two columns: the listing as it was
     checked with its readiness and the trademark result (and the disclaimer) on the left, a card for each finding on the right. A
     suggested fix is shown and never applied. No text is written here (ADR-028): every sentence is a message. -->

<!-- The top of the input card: the two ways to enter the table (links, the current one marked) and the marketplace the table is for. -->
<div class="lg-bulk__top" th:fragment="top(selectId)">
    <nav class="lg-seg" th:aria-label="#{bulk.tabs.aria}">
        <a class="lg-seg__item" th:href="@{/console/bulk(tab='paste',marketplace=${marketplace.code})}" id="tab-paste" th:text="#{bulk.tab.paste}"
           th:aria-current="${tab.key == 'paste'} ? 'page'"></a>
        <a class="lg-seg__item" th:href="@{/console/bulk(tab='file',marketplace=${marketplace.code})}" id="tab-file" th:text="#{bulk.tab.file}"
           th:aria-current="${tab.key == 'file'} ? 'page'"></a>
    </nav>
    <div class="lg-bulk__market">
        <label class="lg-small lg-text-muted" th:for="${selectId}" th:text="#{bulk.marketplace}"></label>
        <select class="lg-select" th:id="${selectId}" name="marketplace">
            <option th:each="m : ${marketplaces}" th:value="${m.code}" th:text="${m.label}" th:selected="${m == marketplace}"></option>
        </select>
    </div>
</div>

<div class="lg-detail" th:fragment="rowDetail(row)">
    <p class="lg-text-muted" th:if="${row.detail.problem != null}" th:text="#{bulk.detail.unreadable(${row.detail.problem})}"></p>
    <div class="lg-split" th:if="${row.detail.problem == null}">
        <div class="lg-card lg-detail__listing">
            <div class="lg-card__head">
                <h3 class="lg-card__title" th:text="#{listing.card.heading}"></h3>
            </div>
            <th:block th:if="${row.detail.listing != null}">
                <div th:replace="~{console/findings :: listing(${row.detail.listing})}"></div>
            </th:block>
            <!-- readiness: the score of the listing rules, or why there is none; the maximum is the readiness setting -->
            <section class="lg-meter">
                <th:block th:if="${row.detail.rules.ran}">
                    <div th:replace="~{console/findings :: meter(${row.detail.rules.score}, '&mdash;', ${readinessMax}, ${row.detail.rules.readinessLabel}, #{bulk.detail.readiness.note}, null)}"></div>
                </th:block>
                <th:block th:unless="${row.detail.rules.ran}">
                    <div th:replace="~{console/findings :: meter(null, '&mdash;', ${readinessMax}, #{bulk.detail.notchecked(${row.detail.rules.note})}, #{bulk.detail.readiness.note}, null)}"></div>
                </th:block>
            </section>
            <!-- the trademark result of the row, next to its findings; the disclaimer is one line on the page with a link to the
                 explanation (ADR-053), not a paragraph in every row -->
            <section class="lg-detail__trademark">
                <div class="lg-meter__head">
                    <h4 class="lg-meter__label" th:text="#{bulk.detail.trademark}"></h4>
                    <span class="lg-pill" th:classappend="${row.detail.trademark.level == 'HIGH' or row.detail.trademark.level == 'MEDIUM'} ? 'lg-pill--trademark'"
                          th:text="${row.detail.trademark.level != null} ? ${row.detail.trademark.level} : '&mdash;'"></span>
                </div>
                <p class="lg-meter__note" th:if="${row.detail.trademark.kind.name() == 'RESULT' and row.detail.trademark.items.isEmpty()}"
                   th:text="#{bulk.detail.trademark.none}"></p>
                <p class="lg-meter__note" th:if="${row.detail.trademark.kind.name() == 'RESULT' and !row.detail.trademark.items.isEmpty()}"
                   th:text="#{bulk.detail.trademark.some(${'' + row.detail.trademark.items.size()})}"></p>
                <p class="lg-meter__note" th:if="${row.detail.trademark.kind.name() == 'INCOMPLETE'}" th:text="#{bulk.detail.trademark.incomplete}"></p>
                <p class="lg-meter__note" th:if="${row.detail.trademark.kind.name() == 'NOT_RUN'}"
                   th:text="#{bulk.detail.notchecked(${row.detail.trademark.note})}"></p>
            </section>
        </div>

        <div class="lg-stack">
            <th:block th:if="${row.detail.rules.ran}">
                <h4 class="lg-group__title" th:text="#{bulk.detail.rules(${'' + row.detail.rules.items.size()})}"></h4>
                <p class="lg-text-muted lg-small" th:if="${row.detail.rules.items.isEmpty()}" th:text="#{bulk.detail.rules.none}"></p>
                <th:block th:if="${!row.detail.rules.items.isEmpty()}" th:with="cards=${@findingCards.bulk(row.detail.rules.items, 'rules', result.marketplace)}">
                    <div th:replace="~{console/findings :: cards(${cards})}"></div>
                </th:block>
            </th:block>

            <th:block th:if="${!row.detail.trademark.items.isEmpty()}" th:with="cards=${@findingCards.bulkTrademark(row.detail.trademark.items, result.marketplace)}">
                <h4 class="lg-group__title" th:text="#{bulk.detail.trademark.findings(${'' + row.detail.trademark.items.size()})}"></h4>
                <div th:replace="~{console/findings :: trademarkHighlights(${cards})}"></div>
            </th:block>

            <th:block th:if="${row.detail.variation.kind.name() != 'NONE'}">
                <h4 class="lg-group__title" th:text="#{bulk.detail.variation}"></h4>
                <p class="lg-text-muted lg-small" th:if="${row.detail.variation.kind.name() == 'NOT_RUN'}"
                   th:text="#{bulk.detail.notchecked(${row.detail.variation.note})}"></p>
                <p class="lg-text-muted lg-small" th:if="${row.detail.variation.kind.name() == 'INCOMPLETE'}"
                   th:text="#{bulk.detail.variation.incomplete}"></p>
                <p class="lg-text-muted lg-small" th:if="${row.detail.variation.kind.name() == 'RESULT' and row.detail.variation.items.isEmpty()}"
                   th:text="#{bulk.detail.variation.none}"></p>
                <th:block th:if="${!row.detail.variation.items.isEmpty()}" th:with="cards=${@findingCards.bulk(row.detail.variation.items, 'variation', result.marketplace)}">
                    <div th:replace="~{console/findings :: cards(${cards})}"></div>
                </th:block>
            </th:block>

            <!-- ADR-037: only while the feature is on, and only for a row with an ERROR or a trademark finding (the row then carries its listing) -->
            <th:block th:if="${rewriteAvailable and row.rewriteListing != null}">
                <th:block th:replace="~{console/rewrite :: bulkButton(${result.marketplace}, ${row})}"></th:block>
            </th:block>
            <p class="lg-small lg-text-muted" th:text="#{finding.legal}"></p>
        </div>
    </div>
</div>
</body>
</html>
