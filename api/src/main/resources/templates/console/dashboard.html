<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{dashboard.title}"></title>
    <link rel="stylesheet" th:href="@{/console/editor.css}">
    <link rel="stylesheet" th:href="@{/console/console.css}">
</head>
<body>
<div th:replace="~{console/layout :: demoBanner}"></div>
<header th:replace="~{console/layout :: nav('dashboard')}"></header>
<main class="page">
    <h1 th:text="#{dashboard.heading}"></h1>
    <p th:text="#{common.signedin(${email})}"></p>
    <p><a th:href="@{/console/check}" th:text="#{nav.check}"></a></p>
    <p><a th:href="@{/console/api-keys}" th:text="#{nav.keys}"></a></p>
    <h2 th:text="#{dashboard.plan.heading}"></h2>
    <p th:text="#{dashboard.plan(${usage.plan})}"></p>
    <p th:text="#{dashboard.usage(${#strings.toString(usage.used)})}"></p>
    <p th:if="${usage.enforced and usage.monthlyQuota != null}"
       th:text="#{dashboard.quota(${#strings.toString(usage.monthlyQuota)}, ${#strings.toString(usage.remaining)})}"></p>
    <p th:if="${usage.enforced and usage.monthlyQuota == null}" th:text="#{dashboard.quota.unlimited}"></p>
    <p th:unless="${usage.enforced}" th:text="#{dashboard.notenforced}"></p>
    <p><span th:text="#{dashboard.reset}"></span> <time th:text="${usage.resetAt}"></time></p>
</main>
</body>
</html>
