<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{edit.title}"></title>
    <th:block th:replace="~{console/layout :: head}"></th:block>
    <th:block th:replace="~{console/layout :: htmx}"></th:block>
    <script th:src="@{/console/edit-mode.js}" defer></script>
</head>
<body>
<!-- Edit mode (ADR-033, ADR-041): the listing before and after a change side by side, then what the change did to the findings: new ones,
     changed or resolved ones, and the ones that remain, each as the same finding card the check pages use. Listing text is never saved. -->
<div th:replace="~{console/layout :: demoBanner}"></div>
<header th:replace="~{console/layout :: nav('edit')}"></header>
<main class="lg-page" id="edit-mode">
    <span id="main" tabindex="-1"></span>
    <div class="lg-page__head">
        <div>
            <h1 th:text="#{edit.heading}"></h1>
            <p class="lg-page__sub" th:text="#{edit.intro}"></p>
        </div>
    </div>
    <p class="lg-text-muted lg-small" th:text="#{edit.history.note}"></p>
    <form id="edit-form" class="lg-card lg-section" method="post"
          th:attr="data-i18n-request-error=#{js.edit.request.error}" th:action="@{/console/check/edit}">
        <div class="lg-field lg-field--narrow">
            <label class="lg-field__label" for="marketplace" th:text="#{edit.marketplace}"></label>
            <select class="lg-select" id="marketplace" name="marketplace">
                <option value="ETSY" th:selected="${marketplace == 'ETSY'}" th:text="#{edit.marketplace.etsy}"></option>
                <option value="AMAZON" th:selected="${marketplace == 'AMAZON'}" th:text="#{edit.marketplace.amazon}"></option>
            </select>
        </div>
        <div class="lg-split lg-split--even">
            <div class="lg-field">
                <label class="lg-field__label" for="before" th:text="#{edit.before}"></label>
                <textarea class="lg-textarea lg-textarea--mono" id="before" name="before" rows="18" required th:text="${before}"></textarea>
            </div>
            <div class="lg-field">
                <label class="lg-field__label" for="after" th:text="#{edit.after}"></label>
                <textarea class="lg-textarea lg-textarea--mono" id="after" name="after" rows="18" required th:text="${after}"></textarea>
            </div>
        </div>
        <div class="lg-actions">
            <button type="submit" class="lg-btn lg-btn--primary" th:text="#{edit.compare}"></button>
        </div>
    </form>

    <p id="edit-working" class="lg-working" role="status" hidden th:text="#{console.working}"></p>
    <p id="edit-unchecked" data-state="UNCHECKED" role="status" class="lg-small lg-text-muted" th:hidden="${result != null}" th:text="#{edit.unchecked}"></p>
    <p id="edit-request-error" role="alert" class="lg-field__error"></p>
    <div id="edit-output">
    <div class="lg-banner lg-banner--error lg-section" role="alert" th:if="${error == 'edit.error.required'}"><p th:text="#{edit.error.required}"></p></div>
    <div class="lg-banner lg-banner--error lg-section" role="alert" th:if="${error == 'edit.error.object'}"><p th:text="#{edit.error.object}"></p></div>
    <div class="lg-banner lg-banner--error lg-section" role="alert" th:if="${error == 'edit.error.invalid'}"><p th:text="#{edit.error.invalid}"></p></div>

    <section class="lg-stack" id="edit-result" th:if="${result != null}" aria-live="polite" aria-labelledby="edit-changed-heading">
        <ul class="lg-card">
            <li><strong th:text="#{editor.pack.rules}"></strong>
                <th:block th:switch="${comparison.listingRules().name()}">
                    <span th:case="'COMPLETE'" th:text="#{edit.pack.complete}"></span>
                    <span th:case="'INCOMPLETE'" th:text="#{edit.pack.incomplete}"></span>
                    <span th:case="'QUOTA'" th:text="#{edit.pack.quota}"></span>
                    <span th:case="'UNAVAILABLE'" th:text="#{edit.pack.unavailable}"></span>
                </th:block>
            </li>
            <li><strong th:text="#{editor.trademark.heading}"></strong>
                <th:block th:switch="${comparison.trademarkRisk().name()}">
                    <span th:case="'COMPLETE'" th:text="#{edit.pack.complete}"></span>
                    <span th:case="'INCOMPLETE'" th:text="#{edit.pack.incomplete}"></span>
                    <span th:case="'QUOTA'" th:text="#{edit.pack.quota}"></span>
                    <span th:case="'UNAVAILABLE'" th:text="#{edit.pack.unavailable}"></span>
                </th:block>
            </li>
        </ul>
        <div class="lg-card">
            <h2 id="edit-changed-heading" class="lg-card__title" th:text="#{edit.changed.fields}"></h2>
            <ul class="lg-listing__chips">
                <li class="lg-chip lg-chip--neutral" th:each="field : ${result.changedFields()}"><code class="lg-code" th:text="${field}"></code></li>
            </ul>
        </div>

        <section class="lg-group" id="edit-new" aria-labelledby="edit-new-heading">
            <h2 id="edit-new-heading" class="lg-group__title">
                <span class="lg-mark" aria-hidden="true"></span>
                <span th:text="#{edit.group.new}"></span>
                <span class="lg-pill" th:text="${result.newFindings().size()}"></span>
            </h2>
            <div class="lg-findings">
                <th:block th:each="item : ${result.newFindings()}" th:with="card=${@findingCards.compared(item, marketplace)}">
                    <article th:replace="~{console/findings :: card(${card})}"></article>
                    <th:block th:if="${policyAiEnabled and item.pack() == 'listing-rules' and item.after() != null and card.field != null
                                  and card.field.matches('title|description|category|who_made|when_made|tags.*|materials.*')}">
                        <div th:replace="~{console/policy-explanation :: explanation(${card.field})}"></div>
                    </th:block>
                    <button th:if="${item.pack() == 'listing-rules' and item.after() != null and card.fix != null}"
                            type="button" class="lg-btn" data-draft-fix hidden
                            th:attr="data-field=${card.field},data-value=${card.value},data-action=${card.fix.action},data-proposed=${card.fix.proposedValue}"
                            th:text="#{edit.draft.apply}"></button>
                </th:block>
            </div>
        </section>

        <section class="lg-group" id="edit-modified" aria-labelledby="edit-modified-heading">
            <h2 id="edit-modified-heading" class="lg-group__title">
                <span th:text="#{edit.group.modified}"></span>
                <span class="lg-pill" th:text="${result.modifiedFindings().size()}"></span>
            </h2>
            <div class="lg-findings">
                <th:block th:each="item : ${result.modifiedFindings()}" th:with="card=${@findingCards.compared(item, marketplace)}">
                    <article th:replace="~{console/findings :: card(${card})}"></article>
                    <th:block th:if="${policyAiEnabled and item.pack() == 'listing-rules' and item.after() != null and card.field != null
                                  and card.field.matches('title|description|category|who_made|when_made|tags.*|materials.*')}">
                        <div th:replace="~{console/policy-explanation :: explanation(${card.field})}"></div>
                    </th:block>
                    <button th:if="${item.pack() == 'listing-rules' and item.after() != null and card.fix != null}"
                            type="button" class="lg-btn" data-draft-fix hidden
                            th:attr="data-field=${card.field},data-value=${card.value},data-action=${card.fix.action},data-proposed=${card.fix.proposedValue}"
                            th:text="#{edit.draft.apply}"></button>
                </th:block>
            </div>
        </section>

        <section class="lg-group" id="edit-remaining" aria-labelledby="edit-remaining-heading">
            <h2 id="edit-remaining-heading" class="lg-group__title">
                <span th:text="#{edit.group.remaining}"></span>
                <span class="lg-pill" th:text="${result.remainingFindings().size()}"></span>
            </h2>
            <div class="lg-findings">
                <th:block th:each="item : ${result.remainingFindings()}" th:with="card=${@findingCards.compared(item, marketplace)}">
                    <article th:replace="~{console/findings :: card(${card})}"></article>
                    <th:block th:if="${policyAiEnabled and item.pack() == 'listing-rules' and item.after() != null and card.field != null
                                  and card.field.matches('title|description|category|who_made|when_made|tags.*|materials.*')}">
                        <div th:replace="~{console/policy-explanation :: explanation(${card.field})}"></div>
                    </th:block>
                    <button th:if="${item.pack() == 'listing-rules' and item.after() != null and card.fix != null}"
                            type="button" class="lg-btn" data-draft-fix hidden
                            th:attr="data-field=${card.field},data-value=${card.value},data-action=${card.fix.action},data-proposed=${card.fix.proposedValue}"
                            th:text="#{edit.draft.apply}"></button>
                </th:block>
            </div>
        </section>
        <p class="lg-small lg-text-muted" th:text="#{finding.legal}"></p>
    </section>
    </div>
</main>
</body>
</html>
