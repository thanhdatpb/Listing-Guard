<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Parts of the editor page. This file is never served on its own; editor.html includes the fragments below.
     The markup of "evidence" stays on one line on purpose: a line break between the parts would show as a space. -->
<span class="ev" th:fragment="evidence(e)"><span th:if="${e.cutBefore}">&hellip;</span><span th:text="${e.before}"></span><mark th:text="${e.match}"></mark><span th:text="${e.after}"></span><span th:if="${e.cutAfter}">&hellip;</span></span>
</body>
</html>
