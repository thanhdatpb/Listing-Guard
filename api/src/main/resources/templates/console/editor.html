<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{editor.title}"></title>
    <th:block th:replace="~{console/layout :: head}"></th:block>
    <link rel="stylesheet" th:href="@{/console/editor.css}">
    <script th:src="@{/console/editor.js}" defer></script>
    <th:block th:replace="~{console/layout :: htmx}"></th:block>
    <th:block th:if="${rewriteAvailable}"><th:block th:replace="~{console/rewrite :: assets}"></th:block></th:block>
</head>
<body>
<!-- The Check listing page (ADR-014 part B3, ADR-041): the form on the left; on the right the listing as it was checked with the words the
     findings point at marked, the readiness and the trademark risk side by side with the disclaimer, then one card for each finding. -->
<div th:replace="~{console/layout :: demoBanner}"></div>
<header th:replace="~{console/layout :: nav('check')}"></header>
<main class="lg-page" id="editor">
    <span id="main" tabindex="-1"></span>
    <div class="lg-page__head">
        <div>
            <h1 id="editor-heading" th:text="#{editor.heading}"></h1>
            <p class="lg-page__sub" th:text="#{editor.intro}"></p>
        </div>
        <div class="lg-actions">
            <a class="lg-btn" th:href="@{/console/pod-readiness}" th:text="#{pod.title}"></a>
            <a class="lg-btn" th:href="@{/console/check/edit}" th:text="#{edit.mode.button}"></a>
        </div>
    </div>

    <div class="lg-split lg-split--even">
    <section class="lg-card editor" aria-labelledby="editor-heading">
        <h2 class="lg-section-title" th:text="#{editor.step.marketplace}"></h2>
        <nav class="lg-seg" th:aria-label="#{editor.marketplace.aria}">
            <a class="lg-seg__item" th:each="m : ${marketplaces}" th:href="@{/console/check(marketplace=${m.code})}" th:text="${m.label}"
               th:aria-current="${m == marketplace} ? 'page'"></a>
        </nav>
        <p class="lg-field__hint lg-editor__note" th:text="#{editor.marketplace.note}"></p>

        <!-- The sentences of the live counters (editor.js) are written here: the script holds no text (ADR-028). They are patterns
             with {0}, {1}; the script fills in the numbers. -->
        <form id="editor-form" method="post" th:action="@{/console/check}" th:object="${form}" novalidate
              th:attr="data-i18n-chars=#{js.counter.chars},data-i18n-chars-nolimit=#{js.counter.chars.nolimit},data-i18n-bytes=#{js.counter.bytes},data-i18n-bytes-nolimit=#{js.counter.bytes.nolimit},data-i18n-entries=#{js.counter.entries},data-i18n-entries-nolimit=#{js.counter.entries.nolimit},data-i18n-longest=#{js.counter.longest},data-i18n-over=#{js.counter.over}">
            <input type="hidden" th:field="*{marketplace}">
            <section id="editor-errors" tabindex="-1" data-status="ERROR" class="lg-banner lg-banner--error" role="alert" th:if="${!fieldErrors.isEmpty()}">
                <p th:text="#{editor.validation.summary}"></p>
                <ul>
                    <li th:each="error : ${fieldErrors}">
                        <a th:href="'#' + ${error.key}" th:text="${error.value}"></a>
                    </li>
                </ul>
            </section>
            <div class="lg-field" th:if="${marketplace.amazon}">
                <label class="lg-field__label" for="productType" th:text="#{editor.producttype.label}"></label>
                <input type="text" class="lg-input" th:field="*{productType}" autocomplete="off" aria-describedby="productType-hint">
                <p class="lg-field__hint" id="productType-hint" th:text="#{editor.producttype.hint}"></p>
            </div>

            <div class="lg-field" th:if="${marketplace.etsy}">
                <label class="lg-field__label" for="category" th:text="#{editor.category.label}"></label>
                <input type="text" class="lg-input" th:field="*{category}" autocomplete="off">
            </div>

            <h2 class="lg-section-title" th:text="#{editor.step.fields}"></h2>
            <p class="lg-field__hint" th:text="${marketplace.etsy} ? #{editor.step.fields.etsy} : #{editor.step.fields.amazon}"></p>


            <div class="lg-field">
                <label class="lg-field__label" for="title" th:text="#{editor.title.label}"></label>
                <input type="text" class="lg-input" th:field="*{title}" autocomplete="off" th:aria-describedby="${limits.titleMax != null} ? 'title-counter'">
                <p class="lg-field__hint counter" id="title-counter" data-counter-for="title" data-mode="chars"
                   th:if="${limits.titleMax != null}" th:attr="data-limit=${limits.titleMax}"
                   th:text="#{editor.counter.limit.chars(${#strings.toString(limits.titleMax)})}"></p>
            </div>

            <div class="lg-field" th:if="${marketplace.amazon}">
                <label class="lg-field__label" for="bulletPoints"><span th:text="#{editor.bullets.label}"></span> <span class="lg-text-muted" th:text="#{editor.oneperline}"></span></label>
                <textarea class="lg-textarea" th:field="*{bulletPoints}" th:aria-describedby="${limits.bulletCountMax != null or limits.bulletLengthMax != null} ? 'bulletPoints-counter'" rows="6"></textarea>
                <p class="lg-field__hint counter" id="bulletPoints-counter" data-counter-for="bulletPoints" data-mode="list"
                   th:if="${limits.bulletCountMax != null or limits.bulletLengthMax != null}"
                   th:attr="data-limit-count=${limits.bulletCountMax},data-limit-each=${limits.bulletLengthMax}"
                   th:text="(${limits.bulletCountMax != null} ? #{editor.bullets.counter.count(${#strings.toString(limits.bulletCountMax)})} : #{editor.bullets.counter.plain}) + (${limits.bulletLengthMax != null} ? #{editor.counter.each(${#strings.toString(limits.bulletLengthMax)})} : '')"></p>
            </div>

            <div class="lg-field">
                <label class="lg-field__label" for="description" th:text="#{editor.description.label}"></label>
                <textarea class="lg-textarea" th:field="*{description}" rows="8"></textarea>
            </div>

            <div class="lg-field" th:if="${marketplace.etsy}">
                <label class="lg-field__label" for="whoMade" th:text="#{editor.whomade.label}"></label>
                <input type="text" class="lg-input" th:field="*{whoMade}" autocomplete="off" aria-describedby="whoMade-hint">
                <p class="lg-field__hint" id="whoMade-hint">
                    <span th:text="#{editor.whomade.hint.before}"></span> <code>i_did</code><span th:text="#{editor.codes.hint.after}"></span>
                </p>
            </div>

            <div class="lg-field" th:if="${marketplace.etsy}">
                <label class="lg-field__label" for="whenMade" th:text="#{editor.whenmade.label}"></label>
                <input type="text" class="lg-input" th:field="*{whenMade}" autocomplete="off" aria-describedby="whenMade-hint">
                <p class="lg-field__hint" id="whenMade-hint">
                    <span th:text="#{editor.whenmade.hint.before}"></span> <code>made_to_order</code><span th:text="#{editor.codes.hint.after}"></span>
                </p>
            </div>
            <div class="lg-field">
                <label class="lg-field__label" for="price" th:text="#{editor.price.label}"></label>
                <input type="text" class="lg-input" th:field="*{price}" inputmode="decimal" autocomplete="off"
                       th:aria-describedby="${fieldErrors.containsKey('price')} ? 'price-hint price-error' : 'price-hint'"
                       th:aria-invalid="${fieldErrors.containsKey('price')}">
                <p class="lg-field__hint" id="price-hint" th:text="#{editor.price.hint}"></p>
                <p class="lg-field__error" id="price-error" th:if="${fieldErrors.containsKey('price')}" th:text="${fieldErrors['price']}"></p>
            </div>

            <div class="lg-field">
                <label class="lg-field__label" for="quantity" th:text="#{editor.quantity.label}"></label>
                <input type="text" class="lg-input" th:field="*{quantity}" inputmode="numeric" autocomplete="off"
                       th:aria-describedby="${fieldErrors.containsKey('quantity')} ? 'quantity-hint quantity-error' : 'quantity-hint'"
                       th:aria-invalid="${fieldErrors.containsKey('quantity')}">
                <p class="lg-field__hint" id="quantity-hint" th:text="#{editor.quantity.hint}"></p>
                <p class="lg-field__error" id="quantity-error" th:if="${fieldErrors.containsKey('quantity')}" th:text="${fieldErrors['quantity']}"></p>
            </div>

            <details id="other-fields" class="lg-disclosure lg-editor__other" th:open="${otherOpen}">
                <summary th:text="#{editor.other.summary}"></summary>
                <p class="lg-field__hint" th:text="#{editor.other.intro}"></p>

                <div class="lg-field" th:if="${marketplace.etsy}">
                    <label class="lg-field__label" for="tags"><span th:text="#{editor.tags.label}"></span> <span class="lg-text-muted" th:text="#{editor.oneperline}"></span></label>
                    <textarea class="lg-textarea" th:field="*{tags}" th:aria-describedby="${limits.tagCountMax != null or limits.tagLengthMax != null} ? 'tags-counter'" rows="6"></textarea>
                    <p class="lg-field__hint counter" id="tags-counter" data-counter-for="tags" data-mode="list"
                       th:if="${limits.tagCountMax != null or limits.tagLengthMax != null}"
                       th:attr="data-limit-count=${limits.tagCountMax},data-limit-each=${limits.tagLengthMax}"
                       th:text="(${limits.tagCountMax != null} ? #{editor.tags.counter.count(${#strings.toString(limits.tagCountMax)})} : #{editor.tags.counter.plain}) + (${limits.tagLengthMax != null} ? #{editor.counter.each(${#strings.toString(limits.tagLengthMax)})} : '')"></p>
                </div>

                <div class="lg-field" th:if="${marketplace.amazon}">
                    <label class="lg-field__label" for="brand" th:text="#{editor.brand.label}"></label>
                    <input type="text" class="lg-input" th:field="*{brand}" autocomplete="off">
                </div>

                <div class="lg-field" th:if="${marketplace.amazon}">
                    <label class="lg-field__label" for="searchTerms" th:text="#{editor.searchterms.label}"></label>
                    <textarea class="lg-textarea" th:field="*{searchTerms}" th:aria-describedby="${limits.searchTermsMaxBytes != null} ? 'searchTerms-counter'" rows="2"></textarea>
                    <p class="lg-field__hint counter" id="searchTerms-counter" data-counter-for="searchTerms" data-mode="bytes"
                       th:if="${limits.searchTermsMaxBytes != null}" th:attr="data-limit=${limits.searchTermsMaxBytes}"
                       th:text="#{editor.counter.limit.bytes(${#strings.toString(limits.searchTermsMaxBytes)})}"></p>
                </div>

            </details>

            <h2 class="lg-section-title" th:text="#{editor.step.check}"></h2>
            <ul class="lg-editor__packs" id="check-packs">
                <li><strong th:text="#{editor.pack.rules}"></strong>
                    <span th:text="#{editor.pack.rules.sources}"></span>
                    <span id="listing-pack-availability" th:if="${!listingPackIncluded}" th:text="#{editor.pack.plan}"></span>
                </li>
                <li><strong th:text="#{editor.trademark.heading}"></strong>
                    <span th:text="#{editor.pack.trademark.sources}"></span>
                    <span id="trademark-pack-availability" th:if="${!cost.trademarkIncluded or !trademarkAvailable}"
                          th:text="${!cost.trademarkIncluded} ? #{editor.pack.plan} : #{editor.pack.catalog}"></span>
                </li>
            </ul>
            <div class="lg-actions lg-editor__actions">
                <button type="submit" class="lg-btn lg-btn--primary" id="check-button" th:text="#{editor.check}"></button>
                <p class="lg-field__hint lg-editor__cost" id="cost">
                    <th:block th:if="${cost.enforced}">
                        <strong th:text="${cost.units == 1} ? #{editor.cost.headline.one(${#strings.toString(cost.units)})} : #{editor.cost.headline.other(${#strings.toString(cost.units)})}"></strong>
                        <span th:text="${cost.trademarkIncluded} ? #{editor.cost.breakdown.both} : #{editor.cost.breakdown.rules}"></span>
                        <span th:text="#{editor.cost.free}"></span>
                        <span th:if="${cost.monthlyQuota != null}"
                              th:text="#{editor.cost.remaining(${#strings.toString(cost.remaining)}, ${#strings.toString(cost.monthlyQuota)}, ${cost.resetDate})}"></span>
                        <span th:if="${cost.monthlyQuota == null}" th:text="#{editor.cost.unlimited}"></span>
                    </th:block>
                    <th:block th:unless="${cost.enforced}">
                        <span th:text="#{editor.cost.notenforced}"></span>
                    </th:block>
                </p>
            </div>
        </form>
    </section>

    <aside class="lg-stack lg-editor__results" id="results" aria-live="polite" th:aria-label="#{editor.results.aria}">
        <div class="lg-banner" id="notice" th:if="${notice != null}" th:classappend="${noticeApplied} ? 'lg-banner--success' : 'lg-banner--error'"
             th:attr="role=${noticeApplied} ? 'status' : 'alert'">
            <p th:text="${notice}"></p>
        </div>
        <th:block th:if="${result != null}">
            <p id="guided-check-status" class="lg-pill"
               th:attr="data-status=${result.status()}"
               th:classappend="${result.status().name() == 'ERROR'} ? 'lg-pill--error' : (${result.status().name() == 'PASSED'} ? 'lg-pill--clean' : 'lg-pill--warn')"
               th:text="#{${result.status().messageKey()}}"></p>
            <!-- The listing as it was checked, then its readiness: one card, because the score is about this text. -->
            <div class="lg-card" id="listing-card">
                <div class="lg-card__head">
                    <h2 class="lg-card__title" th:text="#{listing.card.heading}"></h2>
                    <span class="lg-counts">
                        <span class="lg-pill lg-pill--error" th:if="${result.count('error') > 0}" th:text="#{editor.summary.error(${#strings.toString(result.count('error'))})}"></span>
                        <span class="lg-pill lg-pill--warn" th:if="${result.count('warning') > 0}" th:text="#{editor.summary.warning(${#strings.toString(result.count('warning'))})}"></span>
                        <span class="lg-pill lg-pill--trademark" th:if="${result.trademarkCount() > 0}" th:text="#{editor.summary.trademark(${#strings.toString(result.trademarkCount())})}"></span>
                    </span>
                </div>
                <div th:replace="~{console/findings :: listing(${listingView})}"></div>
                <section class="lg-meter" id="readiness-panel" th:classappend="'lg-meter--' + ${result.readiness.kind.css()}" aria-labelledby="readiness-heading">
                    <div th:replace="~{console/findings :: meter(${result.readiness.score}, ${result.readiness.big}, ${readinessMax}, ${result.readiness.headline}, ${result.readiness.detail}, 'readiness-heading')}"></div>
                </section>
            </div>

            <section class="lg-card" id="trademark-panel" th:classappend="'lg-trademark--' + ${result.trademark.kind.css()}" aria-labelledby="trademark-heading">
                <div class="lg-card__head">
                    <h2 id="trademark-heading" class="lg-card__title" th:text="#{editor.trademark.heading}"></h2>
                    <span class="lg-pill" th:classappend="${result.trademark.riskLevel == 'HIGH' or result.trademark.riskLevel == 'MEDIUM'} ? 'lg-pill--trademark'"
                          th:text="${result.trademark.big}"></span>
                </div>
                <p class="lg-panel__headline"><strong th:text="${result.trademark.headline}"></strong></p>
                <p class="lg-text-muted lg-small" th:text="${result.trademark.detail}"></p>
                <p class="lg-small lg-panel__hint" th:if="${result.trademark.hint != null}" th:text="${result.trademark.hint}"></p>
                <p class="lg-small lg-panel__demo" id="trademark-demo-note" th:if="${demoCatalog}"><span th:replace="~{console/layout :: demoText}"></span></p>
                <!-- The wording of the ruleset is always printed as it is (it is the legal text). A statement of the page's own language
                     goes above it when that language has one that differs (ADR-028). -->
                <th:block th:with="note=${@consoleMessages.disclaimerNote(result.trademark.disclaimer)}">
                    <p class="lg-text-muted lg-small lg-panel__disclaimer" id="trademark-disclaimer-note" th:if="${note != null}" th:text="${note}"></p>
                    <p class="lg-text-muted lg-small lg-panel__disclaimer" id="trademark-disclaimer">
                        <span th:if="${note != null}" th:text="#{editor.disclaimer.original}"></span>
                        <span th:text="${result.trademark.disclaimer}"></span>
                    </p>
                </th:block>
            </section>

            <section class="lg-stack" id="rule-findings" th:if="${result.rulesRan}" aria-labelledby="findings-heading">
                <h2 id="findings-heading" class="lg-section-title" th:text="#{editor.findings.heading}"></h2>
                <p class="lg-text-muted" th:if="${result.ruleGroups.isEmpty()}" th:text="#{editor.findings.none}"></p>
                <div class="lg-group" th:each="group : ${@findingCards.editorRules(result, marketplace.code)}">
                    <h3 class="lg-group__title"><span th:text="${group.label}"></span> <span class="lg-pill" th:text="${group.cards.size()}"></span></h3>
                    <div th:replace="~{console/findings :: cards(${group.cards})}"></div>
                </div>
            </section>

            <section class="lg-stack" id="trademark-findings" th:if="${!result.trademark.groups.isEmpty()}"
                     aria-labelledby="trademark-findings-heading">
                <h2 id="trademark-findings-heading" class="lg-section-title" th:text="#{editor.trademark.findings.heading}"></h2>
                <div class="lg-group" th:each="group : ${@findingCards.editorTrademark(result)}">
                    <h3 class="lg-group__title"><span th:text="${group.label}"></span> <span class="lg-pill" th:text="${group.cards.size()}"></span></h3>
                    <div th:replace="~{console/findings :: cards(${group.cards})}"></div>
                </div>
            </section>
            <th:block th:if="${rewriteAvailable and result.needsRewrite()}">
                <th:block th:replace="~{console/rewrite :: editorButton(${form}, ${result.rewriteAnchor()})}"></th:block>
            </th:block>
            <p class="lg-small lg-text-muted" id="legal-note" th:text="#{finding.legal}"></p>
        </th:block>

        <section class="lg-card preview" id="preview" aria-labelledby="preview-heading">
            <h2 id="preview-heading" class="lg-card__title"><span th:text="#{editor.preview.heading}"></span> <span class="badge" th:text="#{editor.preview.badge}"></span></h2>
            <p class="lg-text-muted lg-small" th:text="#{editor.preview.intro}"></p>
            <div class="sim-grid">
                <div>
                    <h3 class="lg-section-title lg-section-title--small" th:text="#{editor.preview.search}"></h3>
                    <figure class="sim-card" th:classappend="${marketplace.amazon} ? 'row' : 'tile'">
                        <div class="sim-photo" aria-hidden="true"></div>
                        <figcaption>
                            <p class="sim-title" th:classappend="${!preview.hasTitle()} ? 'placeholder'"
                               th:text="${preview.hasTitle()} ? ${preview.title()} : #{editor.preview.placeholder}"></p>
                            <p class="sim-brand" th:if="${marketplace.amazon and !preview.brand().isEmpty()}"
                               th:text="${preview.brand()}"></p>
                            <p class="sim-price" th:text="${preview.price().isEmpty()} ? #{editor.preview.noprice} : ${preview.price()}"></p>
                        </figcaption>
                    </figure>
                    <p class="lg-small lg-text-muted" th:text="#{editor.preview.cutnote}"></p>
                </div>
                <div>
                    <h3 class="lg-section-title lg-section-title--small" th:text="#{editor.preview.page}"></h3>
                    <div class="sim-page">
                        <article>
                            <h4 class="sim-page-title" th:classappend="${!preview.hasTitle()} ? 'placeholder'"><span th:if="${!preview.hasTitle()}" th:text="#{editor.preview.placeholder}"></span><span th:text="${preview.titleWithin()}"></span><mark class="beyond" th:if="${preview.overTheLimit()}" th:text="${preview.titleBeyond()}"></mark></h4>
                            <p class="sim-brand" th:if="${marketplace.amazon and !preview.brand().isEmpty()}"
                               th:text="#{editor.preview.brand(${preview.brand()})}"></p>
                            <p class="sim-price" th:text="${preview.price().isEmpty()} ? #{editor.preview.noprice} : ${preview.price()}"></p>
                            <ul class="sim-bullets" th:if="${marketplace.amazon and !preview.bullets().isEmpty()}">
                                <li th:each="bullet : ${preview.bullets()}" th:text="${bullet}"></li>
                            </ul>
                            <div class="sim-description" th:if="${!preview.description().isEmpty()}"
                                 th:text="${preview.description()}"></div>
                        </article>
                    </div>
                    <p class="lg-small lg-text-muted" th:if="${preview.overTheLimit()}"
                       th:text="#{editor.preview.beyond(${#strings.toString(limits.titleMax)})}"></p>
                </div>
            </div>
        </section>
    </aside>
    </div>
</main>
</body>
</html>
