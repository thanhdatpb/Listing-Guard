<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- The feedback widget of a stored finding (ADR-034). This file is never served on its own: a page that shows stored findings calls
     ConsoleFeedbackSupport.populate and includes widget(target) next to each finding; POST /console/feedback answers the same
     fragment. It is a plain POST form with its CSRF token, so it works without a script; with htmx (hx-post) a press swaps only the
     widget and the page is not reloaded. The page shows the reader's own verdict and note only. No text is written here (ADR-028).

     Model: feedbackEnabled (the reader has an account), feedbackVerdicts (their verdicts by target key), feedbackNoteMax, and on an
     answer of POST /console/feedback also feedbackSavedKey, feedbackError and feedbackDraft. -->
<form class="lg-feedback" th:fragment="widget(target)" th:if="${feedbackEnabled == true and target != null}"
      th:with="key=${target.key()}, mine=${feedbackVerdicts == null ? null : feedbackVerdicts.get(key)},
               current=${mine == null ? '' : mine.verdict().name()},
               saved=${feedbackSavedKey != null and feedbackSavedKey == key},
               failed=${feedbackError != null and feedbackErrorKey == key},
               draft=${failed ? feedbackDraft : (mine == null ? null : mine.note())},
               action=${phraseFeedback == true} ? @{/console/phrase-screening/{id}/feedback(id=${target.checkId()})} : @{/console/feedback}"
      method="post" th:action="${action}" th:id="'fb-' + ${key}"
      th:attr="hx-post=${action},hx-swap='outerHTML'">
    <input type="hidden" name="pack" th:value="${target.pack()}">
    <input type="hidden" name="checkId" th:value="${target.checkId()}">
    <input type="hidden" name="position" th:value="${target.position()}">
    <div class="lg-feedback__row">
        <span class="lg-feedback__label" th:id="'fbl-' + ${key}" th:text="#{feedback.legend}"></span>
        <span class="lg-feedback__buttons" role="group" th:attr="aria-labelledby='fbl-' + ${key}">
            <button type="submit" name="verdict" value="CORRECT" class="lg-btn lg-btn--small" th:aria-pressed="${current == 'CORRECT'}"
                    th:text="#{feedback.verdict.correct}"></button>
            <button type="submit" name="verdict" value="FALSE_POSITIVE" class="lg-btn lg-btn--small" th:aria-pressed="${current == 'FALSE_POSITIVE'}"
                    th:text="#{feedback.verdict.false-positive}"></button>
            <button th:unless="${phraseFeedback == true}" type="submit" name="verdict" value="NOT_USEFUL" class="lg-btn lg-btn--small" th:aria-pressed="${current == 'NOT_USEFUL'}"
                    th:text="#{feedback.verdict.not-useful}"></button>
        </span>
    </div>
    <details th:unless="${phraseFeedback == true}" class="lg-feedback__note lg-disclosure" th:open="${draft != null}">
        <summary th:text="#{feedback.note.summary}"></summary>
        <label class="lg-field__label" th:for="'fbn-' + ${key}" th:text="#{feedback.note.label}"></label>
        <textarea class="lg-textarea" name="note" rows="2" th:id="'fbn-' + ${key}" th:attr="maxlength=${feedbackNoteMax}" th:text="${draft}"></textarea>
        <p class="lg-field__hint" th:text="#{feedback.note.hint(${#strings.toString(feedbackNoteMax)})}"></p>
    </details>
    <p class="lg-feedback__status" role="status" aria-live="polite">
        <span class="lg-feedback__saved" th:if="${saved and !failed and current != ''}"
              th:text="#{feedback.saved(${#messages.msg('feedback.verdict.' + mine.verdict().css())})}"></span>
        <span class="lg-feedback__error" th:if="${failed}" th:text="${feedbackError}"></span>
    </p>
</form>
</body>
</html>
