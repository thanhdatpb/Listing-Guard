<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Parts every console page shares. This file is never served on its own; the pages include the fragments below.
     "head" links the brand tokens and app.css (ADR-040): both are public files under /brand/, so the sign-in pages use
     them too, before anyone is signed in. "nav" is the sidebar of a signed-in page, "logo" the lockup in its light or dark file.
     No text is written in a template (ADR-028): every sentence is a key of messages.properties and messages_vi.properties. -->

<!-- What every console page puts in its head after the title: icons, the colors of the browser bar, the design tokens and app.css. The
     address of each file carries the hash of the build (BrandAssets), so a long cache never serves an old file. The two theme colors
     are the page ground (--surface-0) of each scheme; BrandTokensInSyncTest holds them equal to tokens.css. -->
<th:block th:fragment="head">
    <link rel="icon" th:href="@{/brand/favicon.ico(v=${assetVersion})}" sizes="48x48">
    <link rel="icon" type="image/svg+xml" th:href="@{/brand/logo/symbol.svg(v=${assetVersion})}" sizes="any">
    <link rel="apple-touch-icon" th:href="@{/brand/icons/icon-180.png(v=${assetVersion})}">
    <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
    <script th:src="@{/brand/theme.js(v=${assetVersion})}"></script>
    <script defer th:src="@{/brand/console-interactions.js(v=${assetVersion})}"></script>
    <link rel="stylesheet" th:href="@{/brand/tokens.css(v=${assetVersion})}">
    <link rel="stylesheet" th:href="@{/brand/app.css(v=${assetVersion})}">
</th:block>

<!-- The lockup (symbol and wordmark): the cobalt file, or the reverse file when the system is dark. cssClass sizes it. -->
<span th:fragment="logo(cssClass)" class="lg-lockup">
    <picture>
        <source media="(prefers-color-scheme: dark)" th:srcset="@{/brand/logo/lockup-horizontal-reverse.svg(v=${assetVersion})}">
        <img th:src="@{/brand/logo/lockup-horizontal.svg(v=${assetVersion})}" th:alt="#{brand.name}" th:class="${cssClass}">
    </picture>
    <img class="lg-lockup__light" th:classappend="${cssClass}" th:src="@{/brand/logo/lockup-horizontal.svg(v=${assetVersion})}" th:alt="#{brand.name}">
    <img class="lg-lockup__dark" th:classappend="${cssClass}" th:src="@{/brand/logo/lockup-horizontal-reverse.svg(v=${assetVersion})}" th:alt="#{brand.name}">
</span>

<!-- The notice of a demonstration catalog, one text for the banner and for the trademark panel of the editor. -->
<span th:fragment="demoText" th:text="#{demo.banner}"></span>

<!-- Shown on every console page while the configured trademark catalog version starts with "demo-" (ConsoleModelAdvice). -->
<div th:fragment="demoBanner" th:if="${demoCatalog == true or demoWorkspace == true}" id="demo-banner" role="note" class="lg-banner lg-banner--warning lg-banner--sticky">
    <th:block th:if="${demoWorkspace}"><svg class="lg-icon" width="16" height="16" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h5"/></svg> <span th:text="#{demo.workspace.banner}"></span></th:block><th:block th:unless="${demoWorkspace}"><span th:replace="~{console/layout :: demoText}"></span></th:block>
</div>

<!-- The links that change the language of the page (ConsoleLanguageAdvice): each language is named in itself, on purpose. -->
<!-- Not a nav element: a fragment selector "nav" would match it, and nav(active) below must find the bar. -->
<div class="lang" role="group" th:fragment="languageSwitch" th:aria-label="#{lang.aria}">
    <th:block th:each="option, it : ${languageOptions}">
        <a th:href="${option.href}" th:text="${option.name}" th:lang="${option.code}" th:hreflang="${option.code}"
           th:aria-current="${option.current} ? 'true'"></a><span th:unless="${it.last}"> | </span>
    </th:block>
</div>

<!-- htmx (ADR-034), for the pages that show the feedback widget: the WebJar file served by ConsoleVendorResources, no CDN. The
     configuration lets a 4xx answer of the widget (a note too long, a finding not found) replace the widget, so the reason shows. -->
<th:block th:fragment="htmx">
    <meta name="htmx-config"
          content='{"includeIndicatorStyles":false,"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"[4]..","swap":true,"error":false},{"code":"...","swap":false,"error":true}]}'>
    <script th:src="@{/console/vendor/htmx.min.js}" defer></script>
</th:block>

<!-- The sidebar of a signed-in page (a bar on top below 860px, see app.css): the skip link, the lockup, the two groups of pages, then
     the account, the language and sign out. "active" is dashboard, check, bulk, history, reaudit, watchlist, stats, report or keys.
     The icons are one set of strokes, drawn once in the sprite below and used with <use>; they are decorative, the words are the links.
     The label comes first in the markup and the icon first on screen (CSS order), so the text sits directly inside the link. -->
<header class="app-side" th:fragment="nav(active)">
    <a class="app-skip" href="#main" th:text="#{nav.skip}"></a>
    <svg class="lg-sr-only" aria-hidden="true" focusable="false">
        <symbol id="lg-i-home" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></symbol>
        <symbol id="lg-i-check" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/></symbol>
        <symbol id="lg-i-bulk" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h5"/></symbol>
        <symbol id="lg-i-history" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></symbol>
        <symbol id="lg-i-reaudit" viewBox="0 0 24 24"><path d="M20 12a8 8 0 0 1-14 5"/><path d="M4 12a8 8 0 0 1 14-5"/><path d="M18 3v4h-4M6 21v-4h4"/></symbol>
        <symbol id="lg-i-watchlist" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
        <symbol id="lg-i-stats" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
        <symbol id="lg-i-report" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></symbol>
        <symbol id="lg-i-keys" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3"/></symbol>
        <symbol id="lg-i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
        <symbol id="lg-i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></symbol>
        <symbol id="lg-i-download" viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5"/><path d="M4 20h16"/></symbol>
        <symbol id="lg-i-edit" viewBox="0 0 24 24"><path d="M5 19l4-.9 10-10-3.1-3.1-10 10L5 19Zm9-12l3 3M4 21h16"/></symbol>
        <symbol id="lg-i-phrase" viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4V5Zm4 4h8m-8 3h5"/></symbol>
        <symbol id="lg-i-experiments" viewBox="0 0 24 24"><path d="M9 3h6m-5 0v7l-5 8a2 2 0 002 3h10a2 2 0 002-3l-5-8V3M8 15h8"/></symbol>
        <symbol id="lg-i-review" viewBox="0 0 24 24"><path d="M5 5h14v14H5V5Zm3 6 3 3 5-5"/></symbol>
        <symbol id="lg-i-impact" viewBox="0 0 24 24"><path d="M4 7h16M4 12h10M4 17h16m-3-8 3 3-3 3"/></symbol>
        <symbol id="lg-i-pod" viewBox="0 0 24 24"><path d="M12 3l8 4v10l-8 4-8-4V7l8-4Zm0 8v10M4 7l8 4 8-4"/></symbol><th:block th:if="${workspaceEnabled == true}">
        <symbol id="lg-i-workspace" viewBox="0 0 24 24"><path d="M4 7l8-4 8 4-8 4z"/><path d="M4 12l8 4 8-4M4 17l8 4 8-4"/></symbol>
        <symbol id="lg-i-accounts" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></symbol>
        <symbol id="lg-i-upload" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 20h16"/></symbol>
        <symbol id="lg-i-s-draft" viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/></symbol>
        <symbol id="lg-i-s-ready_to_export" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M8 12l3 3 5-6"/></symbol>
        <symbol id="lg-i-s-exported" viewBox="0 0 24 24"><path d="M5 12v7h14v-7"/><path d="M12 16V4M8 8l4-4 4 4"/></symbol>
        <symbol id="lg-i-s-live" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></symbol>
        <symbol id="lg-i-warn" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v1"/></symbol>
        <symbol id="lg-i-guess" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17v.5"/></symbol>
        <symbol id="lg-i-unchecked" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" stroke-dasharray="3 3"/></symbol>
        <symbol id="lg-i-ok" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol>
        </th:block>
    </svg>
    <a class="app-side__brand" th:href="@{/console}">
        <picture th:replace="~{console/layout :: logo('app-side__logo')}"></picture>
    </a>
    <div class="app-theme" th:replace="~{console/layout :: themeSwitch}"></div>
    <p id="console-working" hidden th:text="#{console.working}"></p>
    <p id="console-request-error" hidden th:text="#{console.request.error}"></p>
    <input type="checkbox" id="app-menu" class="app-side__toggle">
    <label class="app-side__menu" for="app-menu">
        <svg class="lg-icon" width="22" height="22" aria-hidden="true" focusable="false"><use href="#lg-i-menu"/></svg>
        <span class="lg-sr-only" th:text="#{nav.menu}"></span>
    </label>
    <div class="app-side__panel">
        <nav class="app-nav" th:aria-label="#{nav.aria}">
            <a class="app-nav__link" th:href="@{/console}" th:aria-current="${active == 'dashboard'} ? 'page'"><th:block th:text="#{nav.dashboard}"></th:block><svg class="lg-icon app-nav__icon" aria-hidden="true" focusable="false"><use href="#lg-i-home"/></svg></a>
            <p class="app-nav__label" th:text="#{nav.group.work}"></p>
            <a class="app-nav__link" th:href="@{/console/check}" th:aria-current="${active == 'check'} ? 'page'"><th:block th:text="#{nav.check}"></th:block><svg class="lg-icon app-nav__icon" aria-hidden="true" focusable="false"><use href="#lg-i-check"/></svg></a>
            <a class="app-nav__link" th:href="@{/console/bulk}" th:aria-current="${active == 'bulk'} ? 'page'"><th:block th:text="#{nav.bulk}"></th:block><svg class="lg-icon app-nav__icon" aria-hidden="true" focusable="false"><use href="#lg-i-bulk"/></svg></a>
            <a th:if="${phraseScreeningEnabled == true}" class="app-nav__link" th:href="@{/console/phrase-screening}"
               th:aria-current="${active == 'phrases'} ? 'page'"><th:block th:text="#{phrase.heading}"></th:block><svg class="lg-icon app-nav__icon" aria-hidden="true" focusable="false"><use href="#lg-i-phrase"/></svg></a>
            <a class="app-nav__link" th:href="@{/console/check/edit}" th:aria-current="${active == 'edit'} ? 'page'"><th:block th:text="#{edit.heading}"></th:block><svg class="lg-icon app-nav__icon" aria-hidden="true" focusable="false"><use href="#lg-i-edit"/></svg></a><th:block th:if="${workspaceEnabled == true}">
                <p class="app-nav__label" th:text="#{nav.group.workspace}"></p>
                <a class="app-nav__link" th:href="@{/console/workspace}" th:aria-current="${active == 'workspace'} ? 'page'"><th:block th:text="#{workspace.nav.listings}"></th:block><svg class="lg-icon app-nav__icon" aria-hidden="true" focusable="false"><use href="#lg-i-workspace"/></svg></a>
                <a class="app-nav__link" th:href="@{/console/workspace/accounts}" th:aria-current="${active == 'workspace-accounts'} ? 'page'"><th:block th:text="#{workspace.nav.accounts}"></th:block><svg class="lg-icon app-nav__icon" aria-hidden="true" focusable="false"><use href="#lg-i-accounts"/></svg></a>
                <a class="app-nav__link" th:href="@{/console/workspace/import}" th:aria-current="${active == 'workspace-import'} ? 'page'"><th:block th:text="#{workspace.nav.import}"></th:block><svg class="lg-icon app-nav__icon" aria-hidden="true" focusable="false"><use href="#lg-i-upload"/></svg></a>
            </th:block>
            <p class="app-nav__label" th:text="#{nav.group.monitor}"></p>
            <a class="app-nav__link" th:href="@{/console/history}" th:aria-current="${active == 'history'} ? 'page'"><th:block th:text="#{nav.history}"></th:block><svg class="lg-icon app-nav__icon" aria-hidden="true" focusable="false"><use href="#lg-i-history"/></svg></a>
            <a class="app-nav__link" th:href="@{/console/reaudit}" th:aria-current="${active == 'reaudit'} ? 'page'"><th:block th:text="#{nav.reaudit}"></th:block><svg class="lg-icon app-nav__icon" aria-hidden="true" focusable="false"><use href="#lg-i-reaudit"/></svg></a>
            <th:block th:if="${consoleNavigation == null or consoleNavigation.manage}">
                <p class="app-nav__label" th:text="#{nav.group.manage}"></p>
                <a class="app-nav__link" th:href="@{/console/watchlist}" th:aria-current="${active == 'watchlist'} ? 'page'"><th:block th:text="#{nav.watchlist}"></th:block><svg class="lg-icon app-nav__icon" aria-hidden="true" focusable="false"><use href="#lg-i-watchlist"/></svg></a>
                <a class="app-nav__link" th:href="@{/console/stats}" th:aria-current="${active == 'stats'} ? 'page'"><th:block th:text="#{nav.stats}"></th:block><svg class="lg-icon app-nav__icon" aria-hidden="true" focusable="false"><use href="#lg-i-stats"/></svg></a>
                <a th:if="${consoleNavigation != null and consoleNavigation.readiness}" class="app-nav__link" th:href="@{/console/readiness}" th:aria-current="${active == 'readiness'} ? 'page'"><th:block th:text="#{nav.readiness}"></th:block><svg class="lg-icon app-nav__icon" aria-hidden="true" focusable="false"><use href="#lg-i-check"/></svg></a>
                <a class="app-nav__link" th:href="@{/console/api-keys}" th:aria-current="${active == 'keys'} ? 'page'"><th:block th:text="#{nav.keys}"></th:block><svg class="lg-icon app-nav__icon" aria-hidden="true" focusable="false"><use href="#lg-i-keys"/></svg></a>
                <a th:if="${consoleNavigation != null and consoleNavigation.pilot}" class="app-nav__link" th:href="@{/console/stats/pilot}"
                   th:aria-current="${active == 'pilot-report'} ? 'page'"><th:block th:text="#{pilot.report}"></th:block><svg class="lg-icon app-nav__icon" aria-hidden="true" focusable="false"><use href="#lg-i-report"/></svg></a>
                <a th:unless="${consoleNavigation != null and consoleNavigation.pilot}" class="app-nav__link" th:href="@{/console/report}" th:aria-current="${active == 'report'} ? 'page'"><th:block th:text="#{nav.report}"></th:block><svg class="lg-icon app-nav__icon" aria-hidden="true" focusable="false"><use href="#lg-i-report"/></svg></a>
            </th:block>
            <th:block th:if="${consoleNavigation != null and (consoleNavigation.pod or consoleNavigation.policyChanges or consoleNavigation.review)}">
                <p class="app-nav__label app-nav__label--icon"><svg class="lg-icon app-nav__icon" aria-hidden="true" focusable="false"><use href="#lg-i-experiments"/></svg><span th:text="#{nav.group.experimental}"></span></p>
                <a class="app-nav__link" th:if="${consoleNavigation.review}" th:href="@{/console/review-queue}" th:aria-current="${active == 'review'} ? 'page'"><th:block th:text="#{review.heading}"></th:block><svg class="lg-icon app-nav__icon" aria-hidden="true" focusable="false"><use href="#lg-i-review"/></svg></a>
                <a class="app-nav__link" th:if="${consoleNavigation.policyChanges}" th:href="@{/console/policy-changes}" th:aria-current="${active == 'impact'} ? 'page'"><th:block th:text="#{impact.heading}"></th:block><svg class="lg-icon app-nav__icon" aria-hidden="true" focusable="false"><use href="#lg-i-impact"/></svg></a>
                <a class="app-nav__link" th:if="${consoleNavigation.pod}" th:href="@{/console/pod-readiness}" th:aria-current="${active == 'pod'} ? 'page'"><th:block th:text="#{pod.title}"></th:block><svg class="lg-icon app-nav__icon" aria-hidden="true" focusable="false"><use href="#lg-i-pod"/></svg></a>
            </th:block>
        </nav>
        <div class="app-side__foot">
            <div class="app-account" th:if="${consoleAccount != null}">
                <span class="app-account__avatar" aria-hidden="true" th:text="${consoleAccount.initial}"></span>
                <span class="app-account__who">
                    <span class="app-account__client" th:if="${!#strings.isEmpty(consoleAccount.client)}" th:text="${consoleAccount.client}"></span>
                    <span th:classappend="${#strings.isEmpty(consoleAccount.client)} ? 'app-account__client'" th:text="${consoleAccount.email}" th:title="${consoleAccount.email}"></span>
                </span>
            </div>
            <div class="app-side__actions">
                <div th:replace="~{console/layout :: languageSwitch}"></div>
                <form method="post" th:action="@{/logout}">
                    <button type="submit" class="lg-btn lg-btn--link" th:text="#{nav.signout}"></button>
                </form>
            </div>
        </div>
    </div>
</header>
<div th:fragment="themeSwitch" class="app-theme" data-console-theme-controls hidden>
    <label class="lg-sr-only" for="console-theme" th:text="#{theme.label}"></label>
    <select class="lg-select" id="console-theme" data-console-theme-switch>
        <option value="system" th:text="#{theme.system}"></option>
        <option value="light" th:text="#{theme.light}"></option>
        <option value="dark" th:text="#{theme.dark}"></option>
    </select>
</div>
</body>
</html>
