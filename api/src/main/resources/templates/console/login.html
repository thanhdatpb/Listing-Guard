<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{login.title}"></title>
    <th:block th:replace="~{console/layout :: head}"></th:block>
</head>
<body>
<div th:replace="~{console/layout :: demoBanner}"></div>
<!-- The sign-in card (ADR-040, docs/design/screens/0-login): the lockup, the title, one main action, a note. The form, its route, its CSRF
     field and the three modes (e-mail link, Cloudflare Access, both) are the ones this page always had. -->
<main class="lg-auth">
    <div class="lg-card lg-card--raised lg-auth__card">
        <picture th:replace="~{console/layout :: logo('lg-auth__logo')}"></picture>
        <h1 class="lg-auth__title" th:text="#{login.heading}"></h1>
        <p class="lg-auth__lead" th:if="${accessLogin}" th:text="#{login.access.intro}"></p>
        <p class="lg-auth__lead" th:unless="${accessLogin}" th:text="#{login.intro}"></p>
        <p class="lg-auth__message" th:if="${message}" th:text="${message}" role="status"></p>
        <p class="lg-auth__error" th:if="${error}" th:text="${error}" role="alert"></p>
        <p th:if="${accessAvailable}"><a class="lg-btn lg-btn--primary lg-btn--block" href="/console/" th:text="#{login.access.continue}"></a></p>
        <form th:unless="${accessLogin}" method="post" th:action="@{/login}" th:object="${emailForm}">
            <div class="lg-field">
                <label class="lg-field__label" for="email" th:text="#{login.email.label}"></label>
                <input class="lg-input" id="email" type="email" th:field="*{email}" autocomplete="email" maxlength="254" required>
            </div>
            <button type="submit" class="lg-btn lg-btn--primary lg-btn--block" th:text="#{login.submit}"></button>
        </form>
        <div class="lg-auth__foot">
            <div th:replace="~{console/layout :: themeSwitch}"></div>
            <div th:replace="~{console/layout :: languageSwitch}"></div>
        </div>
    </div>
</main>
</body>
</html>
