<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in - Listing Guard</title>
</head>
<body>
<main>
    <h1>Sign in to Listing Guard</h1>
    <p>Enter your email and we will send you a sign-in link.</p>
    <p th:if="${message}" th:text="${message}" role="status"></p>
    <p th:if="${error}" th:text="${error}" role="alert"></p>
    <form method="post" th:action="@{/login}" th:object="${emailForm}">
        <label for="email">Email address</label>
        <input id="email" type="email" th:field="*{email}" autocomplete="email" maxlength="254" required>
        <button type="submit">Send sign-in link</button>
    </form>
</main>
</body>
</html>
