<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{login.title}"></title>
</head>
<body>
<div th:replace="~{console/layout :: demoBanner}"></div>
<main>
    <div th:replace="~{console/layout :: languageSwitch}"></div>
    <h1 th:text="#{login.heading}"></h1>
    <p th:text="#{login.intro}"></p>
    <p th:if="${message}" th:text="${message}" role="status"></p>
    <p th:if="${error}" th:text="${error}" role="alert"></p>
    <form method="post" th:action="@{/login}" th:object="${emailForm}">
        <label for="email" th:text="#{login.email.label}"></label>
        <input id="email" type="email" th:field="*{email}" autocomplete="email" maxlength="254" required>
        <button type="submit" th:text="#{login.submit}"></button>
    </form>
</main>
</body>
</html>
