<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{work.home}"></title>
    <th:block th:replace="~{console/layout :: head}"></th:block>
    <link rel="stylesheet" th:href="@{/console/role-home.css(v=${assetVersion})}">
</head>
<body>
<div th:replace="~{console/layout :: demoBanner}"></div>
<header th:replace="~{console/layout :: nav('dashboard')}"></header>
<main class="lg-page lg-role-home" id="main">
    <h1 th:text="#{work.home}"></h1>
    <div class="lg-actions lg-section" id="work-actions">
        <a class="lg-btn lg-btn--primary" id="pilot-start" th:href="@{/console/bulk}">
            <svg class="lg-icon" width="20" height="20" aria-hidden="true"><use href="#lg-i-bulk"/></svg><span th:text="#{nav.bulk}"></span>
        </a>
        <a class="lg-btn" id="home-phrase-screening" th:if="${phraseScreeningEnabled == true}" th:href="@{/console/phrase-screening}">
            <svg class="lg-icon" width="20" height="20" aria-hidden="true"><use href="#lg-i-check"/></svg><span th:text="#{phrase.heading}"></span>
        </a>
        <a class="lg-btn" th:href="@{/console/check/edit}">
            <svg class="lg-icon" width="20" height="20" aria-hidden="true"><use href="#lg-i-report"/></svg><span th:text="#{work.edit}"></span>
        </a>
    </div>
    <details th:replace="~{console/role-home-fragments :: pilotCapabilities}"></details><th:block th:if="${auditHome != null}"><th:block th:replace="~{console/workspace-fragments :: homeCard}"></th:block></th:block>
    <section class="lg-card lg-section" id="work-fix">
        <h2 th:text="#{work.fix}"></h2>
        <p th:if="${work.needsFix.isEmpty()}" th:text="#{work.fix.empty}"></p>
        <ul class="lg-feed" th:unless="${work.needsFix.isEmpty()}">
            <li class="lg-feed__item" th:each="item : ${work.needsFix}">
                <a th:href="@{/console/history/{pack}/{id}(pack=${item.pack},id=${item.checkId})}"
                   th:text="${item.sku != null} ? ${item.sku} : ${item.marketplace}"></a>
                <span class="lg-small"><span aria-hidden="true" class="lg-manager-marker"></span>
                    <span th:text="#{work.errors(${item.blocked})}"></span>
                    <span th:text="${item.scope == 'CONTENT'} ? #{bulk.scope.content} : #{bulk.scope.full}"></span></span>
            </li>
        </ul>
    </section>
    <section class="lg-card lg-section" id="work-recent">
        <h2 th:text="#{work.recent}"></h2>
        <p th:if="${work.recent.isEmpty()}" th:text="#{work.recent.empty}"></p>
        <ul class="lg-feed" th:unless="${work.recent.isEmpty()}">
            <li class="lg-feed__item" th:each="item : ${work.recent}">
                <a th:if="${item.checkId != null}" th:href="@{/console/history/{pack}/{id}(pack=${item.pack},id=${item.checkId})}"
                   th:text="${item.sku != null} ? ${item.sku} : ${item.marketplace}"></a>
                <a th:if="${item.pack == 'phrase-screening'}" th:href="@{/console/phrase-screening}"
                   th:text="#{work.phrases(${item.rows},${item.blocked})}"></a>
                <a th:if="${item.pack == 'reaudit'}" th:href="@{/console/reaudit}"
                   th:text="#{work.audit(${item.rows},${item.blocked})}"></a>
                <time class="lg-small" th:datetime="${item.at}" th:text="${#temporals.format(item.at,'yyyy-MM-dd HH:mm','UTC')}"></time>
            </li>
        </ul>
    </section>
    <section class="lg-card lg-section" id="work-guide" th:unless="${work.guideHidden}">
        <h2 th:text="#{work.guide}"></h2>
        <ol><li th:text="#{work.step.one}"></li><li th:text="#{work.step.two}"></li><li th:text="#{work.step.three}"></li></ol>
        <form method="post" th:action="@{/console/home/hide-guide}">
            <button type="submit" class="lg-btn" th:text="#{work.guide.hide}"></button>
        </form>
    </section>
</main>
</body>
</html>
