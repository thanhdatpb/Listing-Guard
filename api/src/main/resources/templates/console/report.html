<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{report.title}"></title>
    <link rel="stylesheet" th:href="@{/console/editor.css}">
    <link rel="stylesheet" th:href="@{/console/console.css}">
</head>
<body>
<div th:replace="~{console/layout :: demoBanner}"></div>
<header th:replace="~{console/layout :: nav('report')}"></header>
<main class="page wide">
    <h1 th:text="#{report.heading}"></h1>
    <p class="muted">
        <span th:text="#{common.signedin(${email})}"></span> <span th:text="#{report.intro}"></span>
    </p>

    <form class="report-form" id="report-form" method="get" th:action="@{/console/report}">
        <div class="field">
            <label for="from" th:text="#{report.form.from}"></label>
            <input type="date" id="from" name="from" th:value="${from}">
        </div>
        <div class="field">
            <label for="to" th:text="#{report.form.to}"></label>
            <input type="date" id="to" name="to" th:value="${to}">
        </div>
        <div class="field">
            <label for="marketplace" th:text="#{report.form.marketplace}"></label>
            <select id="marketplace" name="marketplace">
                <option value="" th:text="#{report.form.all}"></option>
                <option th:each="code : ${marketplaces}" th:value="${code}" th:text="${code}" th:selected="${code == marketplaceSelected}"></option>
            </select>
        </div>
        <button type="submit" class="primary" th:text="#{report.form.submit}"></button>
    </form>
    <p class="muted small" th:text="#{report.note.days(${#strings.toString(maxDays)})}"></p>

    <div class="notice refused" id="error" role="alert" th:if="${error != null}"><p th:text="${error}"></p></div>

    <th:block th:if="${report != null}">
        <section id="coverage" th:aria-label="#{report.coverage.aria}">
            <div class="notice applied" role="note" th:if="${report.coverageNote.complete}"><p th:text="${coverageText}"></p></div>
            <div class="notice refused" role="note" th:unless="${report.coverageNote.complete}"><p th:text="${coverageText}"></p></div>
        </section>

        <section id="overview" aria-labelledby="overview-heading">
            <h2 id="overview-heading" th:text="#{report.overview.heading}"></h2>
            <p class="muted">
                <time th:text="${report.period.from}"></time> <span th:text="#{report.overview.to}"></span> <time th:text="${report.period.to}"></time>
                (<span th:text="#{report.overview.days(${#strings.toString(report.period.days)})}"></span>)<span th:if="${report.marketplace != null}"> · <span th:text="#{report.overview.marketplace}"></span>
                <b th:text="${report.marketplace}"></b></span>. <span th:text="#{report.overview.generated}"></span> <time th:text="${report.generatedAt}"></time>.
            </p>
            <p class="muted small" th:text="#{report.overview.note}"></p>
            <table class="report">
                <thead>
                <tr>
                    <th scope="col" th:text="#{report.col.pack}"></th>
                    <th scope="col" class="n" th:text="#{report.col.results}"></th>
                    <th scope="col" th:text="#{report.col.status}"></th>
                </tr>
                </thead>
                <tbody>
                <tr>
                    <td>listing-rules</td>
                    <td class="n" th:text="${report.packs.listingRules.checks}"></td>
                    <td><span th:each="entry, it : ${report.packs.listingRules.statuses}"><span th:text="${entry.key} + ' ' + ${entry.value}"></span><span th:unless="${it.last}"> · </span></span></td>
                </tr>
                <tr>
                    <td>trademark-risk</td>
                    <td class="n" th:text="${report.packs.trademarkRisk.checks}"></td>
                    <td><span th:each="entry, it : ${report.packs.trademarkRisk.completeness}"><span th:text="${entry.key} + ' ' + ${entry.value}"></span><span th:unless="${it.last}"> · </span></span></td>
                </tr>
                <tr>
                    <td>variation-checks</td>
                    <td class="n" th:text="${report.packs.variationChecks.checks}"></td>
                    <td><span th:each="entry, it : ${report.packs.variationChecks.completeness}"><span th:text="${entry.key} + ' ' + ${entry.value}"></span><span th:unless="${it.last}"> · </span></span></td>
                </tr>
                <tr>
                    <td>personalization-screening</td>
                    <td class="n" th:text="${report.packs.personalizationScreening.checks}"></td>
                    <td><span th:each="entry, it : ${report.packs.personalizationScreening.completeness}"><span th:text="${entry.key} + ' ' + ${entry.value}"></span><span th:unless="${it.last}"> · </span></span></td>
                </tr>
                </tbody>
            </table>
        </section>

        <section id="listing-rules" aria-labelledby="listing-rules-heading">
            <h2 id="listing-rules-heading">listing-rules</h2>
            <h3 th:text="#{report.severity.heading}"></h3>
            <div th:replace="~{console/report-fragments :: severities(${report.packs.listingRules.findings})}"></div>
            <h3 th:text="#{report.readiness.heading}"></h3>
            <table class="report" id="readiness">
                <tbody>
                <tr><td th:text="#{report.readiness.withreadiness}"></td><td class="n" th:text="${report.packs.listingRules.readiness.checksWithReadiness}"></td></tr>
                <tr><td th:text="#{report.readiness.scored}"></td><td class="n" th:text="${report.packs.listingRules.readiness.scoredChecks}"></td></tr>
                <tr><td th:text="#{report.readiness.incomplete}"></td><td class="n" th:text="${report.packs.listingRules.readiness.incompleteChecks}"></td></tr>
                <tr><td th:text="#{report.readiness.ready}"></td><td class="n" th:text="${report.packs.listingRules.readiness.readyChecks}"></td></tr>
                <tr><td th:text="#{report.readiness.readyrate}"></td><td class="n" th:text="${report.packs.listingRules.readiness.readyRate != null ? #numbers.formatDecimal(report.packs.listingRules.readiness.readyRate * 100, 1, 'NONE', 1, 'POINT') + '%' : '-'}"></td></tr>
                <tr><td th:text="#{report.readiness.mean}"></td><td class="n" th:text="${report.packs.listingRules.readiness.averageScore != null ? #numbers.formatDecimal(report.packs.listingRules.readiness.averageScore, 1, 'NONE', 1, 'POINT') : '-'}"></td></tr>
                <tr><td th:text="#{report.readiness.without}"></td><td class="n" th:text="${report.packs.listingRules.readiness.checksWithoutReadiness}"></td></tr>
                <tr><td th:text="#{report.readiness.versions}"></td><td class="n"><span th:each="version, it : ${report.packs.listingRules.readiness.versions}"><span th:text="${version}"></span><span th:unless="${it.last}">, </span></span><span th:if="${report.packs.listingRules.readiness.versions.isEmpty()}">-</span></td></tr>
                </tbody>
            </table>
            <p class="muted small" th:text="#{report.readiness.note}"></p>
            <h3 th:text="#{report.rules.heading}"></h3>
            <div th:replace="~{console/report-fragments :: rules(${report.packs.listingRules.topRules})}"></div>
        </section>

        <section id="trademark-risk" aria-labelledby="trademark-risk-heading">
            <h2 id="trademark-risk-heading">trademark-risk</h2>
            <h3 th:text="#{report.trademark.levels.heading}"></h3>
            <table class="report" id="risk-levels">
                <thead>
                <tr>
                    <th scope="col" th:text="#{report.col.risklevel}"></th>
                    <th scope="col" class="n" th:text="#{report.col.results}"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="level : ${report.packs.trademarkRisk.riskLevels}">
                    <td th:text="${level.key}"></td>
                    <td class="n" th:text="${level.value}"></td>
                </tr>
                </tbody>
            </table>
            <p class="muted small" th:text="#{report.trademark.unknown.note}"></p>
            <h3 th:text="#{report.trademark.marks.heading}"></h3>
            <p th:if="${report.packs.trademarkRisk.topMarks.items.isEmpty()}" th:text="#{report.trademark.marks.none}"></p>
            <div class="report-scroll" th:unless="${report.packs.trademarkRisk.topMarks.items.isEmpty()}">
                <table class="report" id="top-marks">
                    <thead>
                    <tr>
                        <th scope="col" th:text="#{report.col.mark}"></th>
                        <th scope="col" class="n" th:text="#{report.col.findings}"></th>
                        <th scope="col" class="n" th:text="#{report.col.affected}"></th>
                        <th scope="col" th:text="#{report.col.highest}"></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${report.packs.trademarkRisk.topMarks.items}">
                        <td th:text="${item.mark}"></td>
                        <td class="n" th:text="${item.findings}"></td>
                        <td class="n" th:text="${item.checksAffected}"></td>
                        <td th:text="${item.highestRisk}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <th:block th:with="note=${@consoleMessages.disclaimerNote(trademarkDisclaimer)}">
                <p class="muted small" id="trademark-disclaimer-note" th:if="${note != null}" th:text="${note}"></p>
                <p class="muted small" id="trademark-disclaimer">
                    <span th:if="${note != null}" th:text="#{editor.disclaimer.original}"></span>
                    <span th:text="${trademarkDisclaimer}"></span>
                </p>
            </th:block>
        </section>

        <section id="variation-checks" aria-labelledby="variation-checks-heading">
            <h2 id="variation-checks-heading">variation-checks</h2>
            <div th:replace="~{console/report-fragments :: severities(${report.packs.variationChecks.findings})}"></div>
            <h3 th:text="#{report.rules.heading}"></h3>
            <div th:replace="~{console/report-fragments :: rules(${report.packs.variationChecks.topRules})}"></div>
        </section>

        <section id="personalization-screening" aria-labelledby="personalization-screening-heading">
            <h2 id="personalization-screening-heading">personalization-screening</h2>
            <table class="report">
                <tbody>
                <tr>
                    <td th:text="#{report.pers.scan}"></td>
                    <td><span th:each="entry, it : ${report.packs.personalizationScreening.trademarkStatus}"><span th:text="${entry.key} + ' ' + ${entry.value}"></span><span th:unless="${it.last}"> · </span></span></td>
                </tr>
                <tr>
                    <td th:text="#{report.pers.risk}"></td>
                    <td><span th:each="entry, it : ${report.packs.personalizationScreening.trademarkRiskLevels}"><span th:text="${entry.key} + ' ' + ${entry.value}"></span><span th:unless="${it.last}"> · </span></span></td>
                </tr>
                </tbody>
            </table>
            <p class="muted small" th:text="#{report.pers.nomarks}"></p>
            <h3 th:text="#{report.pers.findings}"></h3>
            <div th:replace="~{console/report-fragments :: severities(${report.packs.personalizationScreening.findings})}"></div>
            <h3 th:text="#{report.pers.rules}"></h3>
            <div th:replace="~{console/report-fragments :: rules(${report.packs.personalizationScreening.topRules})}"></div>
        </section>

        <section id="by-week" aria-labelledby="by-week-heading">
            <h2 id="by-week-heading" th:text="#{report.week.heading}"></h2>
            <div class="report-scroll">
                <table class="report">
                    <thead>
                    <tr>
                        <th scope="col" th:text="#{report.week.col.week}"></th>
                        <th scope="col" th:text="#{report.week.col.days}"></th>
                        <th scope="col" th:text="#{report.week.col.partial}"></th>
                        <th scope="col" class="n" th:text="#{report.week.col.ruleresults}"></th>
                        <th scope="col" class="n">ERROR</th>
                        <th scope="col" class="n">WARNING</th>
                        <th scope="col" class="n" th:text="#{report.week.col.ready}"></th>
                        <th scope="col" class="n" th:text="#{report.week.col.mean}"></th>
                        <th scope="col" class="n" th:text="#{report.week.col.trademark}"></th>
                        <th scope="col" class="n">HIGH</th>
                        <th scope="col" class="n">MEDIUM</th>
                        <th scope="col" class="n">LOW</th>
                        <th scope="col" class="n">UNKNOWN</th>
                        <th scope="col" class="n" th:text="#{report.week.col.variation}"></th>
                        <th scope="col" class="n" th:text="#{report.week.col.screenings}"></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="w : ${report.byWeek}">
                        <td th:text="${w.isoWeek}"></td>
                        <td><time th:text="${w.from}"></time> <span th:text="#{report.overview.to}"></span> <time th:text="${w.to}"></time></td>
                        <td th:text="${w.partial} ? #{report.week.yes} : #{report.week.no}"></td>
                        <td class="n" th:text="${w.listingRules.checks}"></td>
                        <td class="n" th:text="${w.listingRules.findings[0].findings}"></td>
                        <td class="n" th:text="${w.listingRules.findings[1].findings}"></td>
                        <td class="n" th:text="${w.listingRules.readiness.readyRate != null ? #numbers.formatDecimal(w.listingRules.readiness.readyRate * 100, 1, 'NONE', 1, 'POINT') + '%' : '-'}"></td>
                        <td class="n" th:text="${w.listingRules.readiness.averageScore != null ? #numbers.formatDecimal(w.listingRules.readiness.averageScore, 1, 'NONE', 1, 'POINT') : '-'}"></td>
                        <td class="n" th:text="${w.trademarkRisk.checks}"></td>
                        <td class="n" th:text="${w.trademarkRisk.riskLevels['HIGH']}"></td>
                        <td class="n" th:text="${w.trademarkRisk.riskLevels['MEDIUM']}"></td>
                        <td class="n" th:text="${w.trademarkRisk.riskLevels['LOW']}"></td>
                        <td class="n" th:text="${w.trademarkRisk.riskLevels['UNKNOWN']}"></td>
                        <td class="n" th:text="${w.variationChecks.checks}"></td>
                        <td class="n" th:text="${w.personalizationScreening.checks}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <p class="muted small" th:text="#{report.week.note}"></p>
        </section>

        <section id="versions" aria-labelledby="versions-heading">
            <h2 id="versions-heading" th:text="#{report.versions.heading}"></h2>
            <table class="report">
                <thead>
                <tr>
                    <th scope="col" th:text="#{report.col.pack}"></th>
                    <th scope="col" th:text="#{report.col.marketplace}"></th>
                    <th scope="col" th:text="#{report.col.ruleset}"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="ruleset : ${report.versions.rulesets}">
                    <td th:text="${ruleset.pack}"></td>
                    <td th:text="${ruleset.marketplace}"></td>
                    <td th:text="${ruleset.version}"></td>
                </tr>
                </tbody>
            </table>
            <p class="muted small">
                <span th:text="#{report.versions.catalog}"></span> <span th:text="${report.versions.trademarkCatalog.state}"></span><span th:if="${report.versions.trademarkCatalog.version != null}"> (<span th:text="${report.versions.trademarkCatalog.version}"></span>)</span>.
                <span th:text="#{report.versions.older}"></span>
            </p>
        </section>
    </th:block>
</main>
</body>
</html>
