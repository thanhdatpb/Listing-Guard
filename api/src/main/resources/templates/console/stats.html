<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{stats.title}"></title>
    <link rel="stylesheet" th:href="@{/console/editor.css}">
    <link rel="stylesheet" th:href="@{/console/console.css}">
</head>
<body>
<!-- The statistics page (ADR-034): verdicts per rule and per reviewer for the signed-in account's client, and a CSV of the same
     numbers. No note and no text of a listing is shown. Every value goes through th:text; every sentence is a message (ADR-028). -->
<div th:replace="~{console/layout :: demoBanner}"></div>
<header th:replace="~{console/layout :: nav('stats')}"></header>
<main class="page wide">
    <h1 th:text="#{stats.heading}"></h1>
    <p class="muted"><span th:text="#{common.signedin(${email})}"></span> <span th:text="#{stats.intro}"></span></p>

    <form class="report-form" id="stats-form" method="get" th:action="@{/console/stats}">
        <div class="field">
            <label for="from" th:text="#{report.form.from}"></label>
            <input type="date" id="from" name="from" th:value="${from}">
        </div>
        <div class="field">
            <label for="to" th:text="#{report.form.to}"></label>
            <input type="date" id="to" name="to" th:value="${to}">
        </div>
        <div class="field">
            <label for="marketplace" th:text="#{report.form.marketplace}"></label>
            <select id="marketplace" name="marketplace">
                <option value="" th:text="#{report.form.all}"></option>
                <option th:each="code : ${marketplaces}" th:value="${code}" th:text="${code}" th:selected="${code == marketplaceSelected}"></option>
            </select>
        </div>
        <button type="submit" class="primary" th:text="#{report.form.submit}"></button>
    </form>
    <p class="muted small" th:text="#{report.note.days(${#strings.toString(maxDays)})}"></p>

    <div class="notice refused" id="error" role="alert" th:if="${error != null}"><p th:text="${error}"></p></div>

    <th:block th:if="${stats != null}">
        <section id="stats-totals" aria-labelledby="totals-heading">
            <h2 id="totals-heading" th:text="#{stats.totals.heading}"></h2>
            <p class="muted">
                <time th:text="${stats.period.from}"></time> <span th:text="#{report.overview.to}"></span> <time th:text="${stats.period.to}"></time>
                (<span th:text="#{report.overview.days(${#strings.toString(stats.period.days)})}"></span>)<span th:if="${stats.marketplace != null}"> &middot; <b th:text="${stats.marketplace}"></b></span>
            </p>
            <dl class="facts">
                <dt th:text="#{stats.col.verdicts}"></dt><dd th:text="${stats.totals.verdicts}"></dd>
                <dt th:text="#{feedback.verdict.correct}"></dt><dd th:text="${stats.totals.byVerdict['CORRECT']}"></dd>
                <dt th:text="#{feedback.verdict.false-positive}"></dt><dd th:text="${stats.totals.byVerdict['FALSE_POSITIVE']}"></dd>
                <dt th:text="#{feedback.verdict.not-useful}"></dt><dd th:text="${stats.totals.byVerdict['NOT_USEFUL']}"></dd>
                <dt th:text="#{stats.col.rate}"></dt>
                <dd th:text="${stats.totals.falsePositiveRate == null} ? '&mdash;' : ${#numbers.formatPercent(stats.totals.falsePositiveRate, 1, 1)}"></dd>
            </dl>
            <p class="muted small" th:text="#{stats.note}"></p>
            <p><a class="button" id="stats-csv"
                  th:href="@{/console/stats.csv(from=${from},to=${to},marketplace=${marketplaceSelected})}" th:text="#{stats.csv}"></a></p>
        </section>

        <!-- ADR-037: the use of the rewrite suggestions, only while the feature is on -->
        <section id="stats-rewrite" aria-labelledby="rewrite-stats-heading" th:if="${rewriteUsage != null}">
            <h2 id="rewrite-stats-heading" th:text="#{stats.rewrite.heading}"></h2>
            <dl class="facts">
                <dt th:text="#{stats.rewrite.runs}"></dt><dd th:text="${rewriteUsage.runs}"></dd>
                <dt th:text="#{stats.rewrite.safe}"></dt><dd th:text="${rewriteUsage.withSafe}"></dd>
                <dt th:text="#{stats.rewrite.used}"></dt><dd th:text="${rewriteUsage.used}"></dd>
                <dt th:text="#{stats.rewrite.rate}"></dt>
                <dd th:text="${rewriteUsage.rate == null} ? '&mdash;' : ${#numbers.formatPercent(rewriteUsage.rate, 1, 1)}"></dd>
            </dl>
            <p class="muted small" th:text="#{stats.rewrite.note}"></p>
        </section>

        <section id="stats-rules" aria-labelledby="rules-heading">
            <h2 id="rules-heading" th:text="#{stats.byrule.heading}"></h2>
            <p class="muted" th:if="${stats.byRule.isEmpty()}" th:text="#{stats.byrule.none}"></p>
            <div class="report-scroll" th:unless="${stats.byRule.isEmpty()}">
                <table class="report" id="stats-rule-table">
                    <thead>
                    <tr>
                        <th scope="col" th:text="#{report.col.pack}"></th>
                        <th scope="col" th:text="#{report.col.rule}"></th>
                        <th scope="col" th:text="#{stats.col.source}"></th>
                        <th scope="col" class="n" th:text="#{report.col.findings}"></th>
                        <th scope="col" class="n" th:text="#{stats.col.verdicts}"></th>
                        <th scope="col" class="n" th:text="#{feedback.verdict.correct}"></th>
                        <th scope="col" class="n" th:text="#{feedback.verdict.false-positive}"></th>
                        <th scope="col" class="n" th:text="#{feedback.verdict.not-useful}"></th>
                        <th scope="col" class="n" th:text="#{stats.col.rate}"></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="rule : ${stats.byRule}" th:with="explanation=${@consoleMessages.ruleExplanation(rule.ruleId)}">
                        <td th:text="${rule.pack}"></td>
                        <td><code th:text="${rule.ruleId}"></code><span class="muted small explain" th:if="${explanation != null}"><br><span th:text="${explanation}"></span></span></td>
                        <td th:text="${rule.source}"></td>
                        <td class="n" th:text="${rule.findings}"></td>
                        <td class="n" th:text="${rule.verdicts}"></td>
                        <td class="n" th:text="${rule.correct}"></td>
                        <td class="n" th:text="${rule.falsePositive}"></td>
                        <td class="n" th:text="${rule.notUseful}"></td>
                        <td class="n" th:text="${rule.falsePositiveRate == null} ? '&mdash;' : ${#numbers.formatPercent(rule.falsePositiveRate, 1, 1)}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section id="stats-reviewers" aria-labelledby="reviewers-heading">
            <h2 id="reviewers-heading" th:text="#{stats.byreviewer.heading}"></h2>
            <p class="muted" th:if="${stats.byReviewer.isEmpty()}" th:text="#{stats.byreviewer.none}"></p>
            <div class="report-scroll" th:unless="${stats.byReviewer.isEmpty()}">
                <table class="report" id="stats-reviewer-table">
                    <thead>
                    <tr>
                        <th scope="col" th:text="#{stats.col.reviewer}"></th>
                        <th scope="col" th:text="#{stats.col.kind}"></th>
                        <th scope="col" class="n" th:text="#{stats.col.verdicts}"></th>
                        <th scope="col" class="n" th:text="#{feedback.verdict.correct}"></th>
                        <th scope="col" class="n" th:text="#{feedback.verdict.false-positive}"></th>
                        <th scope="col" class="n" th:text="#{feedback.verdict.not-useful}"></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="reviewer : ${stats.byReviewer}">
                        <td th:text="${reviewer.display()}"></td>
                        <td th:text="${reviewer.kind == 'ACCOUNT'} ? #{stats.kind.account} : #{stats.kind.apikey}"></td>
                        <td class="n" th:text="${reviewer.verdicts}"></td>
                        <td class="n" th:text="${reviewer.correct}"></td>
                        <td class="n" th:text="${reviewer.falsePositive}"></td>
                        <td class="n" th:text="${reviewer.notUseful}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </th:block>
</main>
</body>
</html>
