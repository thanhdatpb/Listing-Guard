<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{stats.title}"></title>
    <th:block th:replace="~{console/layout :: head}"></th:block>
</head>
<body>
<!-- The statistics page (ADR-034, ADR-042): verdicts per rule and per reviewer for the signed-in account's client, and a CSV of the same
     numbers. No note and no text of a listing is shown. Every value goes through th:text; every sentence is a message (ADR-028). -->
<div th:replace="~{console/layout :: demoBanner}"></div>
<header th:replace="~{console/layout :: nav('stats')}"></header>
<main class="lg-page" id="stats-page">
    <span id="main" tabindex="-1"></span>
    <div class="lg-page__head">
        <div>
            <h1 th:text="#{stats.heading}"></h1>
            <p class="lg-page__sub" th:text="#{stats.intro}"></p>
        </div>
        <div class="lg-actions" th:if="${stats != null}">
            <a class="lg-btn lg-btn--primary" id="pilot-report" th:if="${consoleNavigation != null and consoleNavigation.pilot}"
               th:href="@{/console/stats/pilot(from=${from},to=${to},marketplace=${marketplaceSelected})}"
               th:text="${roleHomeEnabled == true} ? #{manager.report} : #{pilot.report}"></a>
            <a class="lg-btn" id="pilot-csv" th:if="${consoleNavigation != null and consoleNavigation.pilot}"
               th:href="@{/console/stats/pilot.csv(from=${from},to=${to},marketplace=${marketplaceSelected})}"
               th:text="#{pilot.export}"></a>
            <a class="lg-btn" id="stats-csv" th:href="@{/console/stats.csv(from=${from},to=${to},marketplace=${marketplaceSelected})}">
                <svg class="lg-icon lg-btn__icon" aria-hidden="true" focusable="false"><use href="#lg-i-download"/></svg>
                <th:block th:text="#{stats.csv}"></th:block>
            </a>
        </div>
    </div>

    <form class="lg-filters" id="stats-form" method="get" th:action="@{/console/stats}">
        <div th:replace="~{console/report-fragments :: period(${from}, ${to}, ${marketplaces}, ${marketplaceSelected})}"></div>
        <button type="submit" class="lg-btn lg-btn--small" th:text="#{report.form.submit}"></button>
    </form>
    <p class="lg-small lg-text-muted lg-section" th:text="#{report.note.days(${#strings.toString(maxDays)})}"></p>

    <div class="lg-banner lg-banner--error lg-section" id="error" role="alert" th:if="${error != null}"><p th:text="${error}"></p></div>

    <th:block th:if="${stats != null}">
        <section id="stats-totals" class="lg-section" aria-labelledby="totals-heading">
            <h2 id="totals-heading" class="lg-section-title lg-section" th:text="#{stats.totals.heading}"></h2>
            <p class="lg-text-muted lg-small">
                <time th:datetime="${stats.period.from}" th:with="pattern=#{format.date}" th:text="${#temporals.format(stats.period.from, pattern)}"></time> <span th:text="#{report.overview.to}"></span> <time th:datetime="${stats.period.to}" th:with="pattern=#{format.date}" th:text="${#temporals.format(stats.period.to, pattern)}"></time>
                (<span th:text="#{report.overview.days(${#strings.toString(stats.period.days)})}"></span>)<span th:if="${stats.marketplace != null}"> &middot; <strong th:text="${stats.marketplace}"></strong></span>
            </p>
            <div class="lg-grid lg-grid--stats lg-section">
                <div th:replace="~{console/report-fragments :: stat('stat-verdicts', #{stats.col.verdicts}, ${stats.totals.verdicts}, '', null)}"></div>
                <div th:replace="~{console/report-fragments :: stat('stat-correct', #{feedback.verdict.correct}, ${stats.totals.byVerdict['CORRECT']}, 'clean', null)}"></div>
                <div th:replace="~{console/report-fragments :: stat('stat-false-positive', #{feedback.verdict.false-positive}, ${stats.totals.byVerdict['FALSE_POSITIVE']}, 'trademark', null)}"></div>
                <div th:replace="~{console/report-fragments :: stat('stat-not-useful', #{feedback.verdict.not-useful}, ${stats.totals.byVerdict['NOT_USEFUL']}, '', null)}"></div>
                <div th:replace="~{console/report-fragments :: stat('stat-rate', #{stats.col.rate}, (${stats.totals.falsePositiveRate == null} ? '&mdash;' : ${#numbers.formatPercent(stats.totals.falsePositiveRate, 1, 1)}), '', null)}"></div>
            </div>

            <!-- how the verdicts divide: one bar, three parts; the numbers are under it, so the color is never the only way to read it -->
            <div class="lg-card lg-section" id="stats-split" th:if="${stats.totals.verdicts > 0}"
                 th:with="total=${stats.totals.verdicts}, c=${stats.totals.byVerdict['CORRECT']}, f=${stats.totals.byVerdict['FALSE_POSITIVE']}, n=${stats.totals.byVerdict['NOT_USEFUL']}">
                <h3 id="split-heading" class="lg-card__title" th:text="#{stats.split.heading}"></h3>
                <svg class="lg-chart lg-chart--bar" role="img" viewBox="0 0 600 28" preserveAspectRatio="none" focusable="false" aria-labelledby="split-heading"
                     xmlns="http://www.w3.org/2000/svg" th:with="cw=${c * 600 / total}, fw=${f * 600 / total}">
                    <rect class="lg-chart__seg lg-chart__seg--correct" x="0" y="0" height="28" th:attr="width=${cw}"></rect>
                    <rect class="lg-chart__seg lg-chart__seg--false" y="0" height="28" th:attr="x=${cw},width=${fw}"></rect>
                    <rect class="lg-chart__seg lg-chart__seg--useless" y="0" height="28" th:attr="x=${cw + fw},width=${600 - cw - fw}"></rect>
                </svg>
                <ul class="lg-legend">
                    <li><span class="lg-legend__key lg-legend__key--correct" aria-hidden="true"></span><span th:text="#{feedback.verdict.correct}"></span> <strong th:text="${c}"></strong></li>
                    <li><span class="lg-legend__key lg-legend__key--false" aria-hidden="true"></span><span th:text="#{feedback.verdict.false-positive}"></span> <strong th:text="${f}"></strong></li>
                    <li><span class="lg-legend__key lg-legend__key--useless" aria-hidden="true"></span><span th:text="#{feedback.verdict.not-useful}"></span> <strong th:text="${n}"></strong></li>
                </ul>
            </div>
            <p class="lg-small lg-text-muted" th:text="#{stats.note}"></p>
        </section>

        <!-- ADR-037: the use of the rewrite suggestions, only while the feature is on -->
        <section id="stats-rewrite" class="lg-section" aria-labelledby="rewrite-stats-heading" th:if="${rewriteUsage != null}">
            <h2 id="rewrite-stats-heading" class="lg-section-title lg-section" th:text="#{stats.rewrite.heading}"></h2>
            <div class="lg-grid lg-grid--stats lg-section">
                <div th:replace="~{console/report-fragments :: stat('stat-rewrite-runs', #{stats.rewrite.runs}, ${rewriteUsage.runs}, '', null)}"></div>
                <div th:replace="~{console/report-fragments :: stat('stat-rewrite-safe', #{stats.rewrite.safe}, ${rewriteUsage.withSafe}, '', null)}"></div>
                <div th:replace="~{console/report-fragments :: stat('stat-rewrite-used', #{stats.rewrite.used}, ${rewriteUsage.used}, '', null)}"></div>
                <div th:replace="~{console/report-fragments :: stat('stat-rewrite-rate', #{stats.rewrite.rate}, (${rewriteUsage.rate == null} ? '&mdash;' : ${#numbers.formatPercent(rewriteUsage.rate, 1, 1)}), '', null)}"></div>
                <div th:replace="~{console/report-fragments :: stat('stat-rewrite-round1', #{stats.rewrite.round1}, (${rewriteUsage.roundOneRate == null} ? '&mdash;' : ${#numbers.formatPercent(rewriteUsage.roundOneRate, 1, 1)}), '', null)}"></div>
                <div th:replace="~{console/report-fragments :: stat('stat-rewrite-later', #{stats.rewrite.later}, (${rewriteUsage.laterRoundRate == null} ? '&mdash;' : ${#numbers.formatPercent(rewriteUsage.laterRoundRate, 1, 1)}), '', null)}"></div>
            </div>
            <p class="lg-small lg-text-muted" th:text="#{stats.rewrite.note}"></p>
            <p class="lg-small lg-text-muted" id="stat-rewrite-rounds-note"
               th:text="#{stats.rewrite.rounds.note(${rewriteUsage.safeInRoundOne}, ${rewriteUsage.runs}, ${rewriteUsage.reachedLaterRound}, ${rewriteUsage.safeInLaterRound})}"></p>
        </section>

        <section id="stats-rules" class="lg-section" aria-labelledby="rules-heading">
            <h2 id="rules-heading" class="lg-section-title lg-section" th:text="#{stats.byrule.heading}"></h2>
            <div class="lg-empty" th:if="${stats.byRule.isEmpty()}"><p class="lg-empty__text" th:text="#{stats.byrule.none}"></p></div>
            <div class="lg-table-wrap" th:unless="${stats.byRule.isEmpty()}">
                <table class="lg-table lg-table--scroll lg-table--dense" id="stats-rule-table">
                    <caption class="lg-sr-only" th:text="#{stats.byrule.heading}"></caption>
                    <thead>
                    <tr>
                        <th scope="col" th:text="#{report.col.pack}"></th>
                        <th scope="col" th:text="#{report.col.rule}"></th>
                        <th scope="col" th:text="#{stats.col.source}"></th>
                        <th scope="col" class="lg-num" th:text="#{report.col.findings}"></th>
                        <th scope="col" class="lg-num" th:text="#{stats.col.verdicts}"></th>
                        <th scope="col" class="lg-num" th:text="#{feedback.verdict.correct}"></th>
                        <th scope="col" class="lg-num" th:text="#{feedback.verdict.false-positive}"></th>
                        <th scope="col" class="lg-num" th:text="#{feedback.verdict.not-useful}"></th>
                        <th scope="col" class="lg-num" th:text="#{stats.col.rate}"></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="rule : ${stats.byRule}" th:with="explanation=${@consoleMessages.ruleExplanation(rule.ruleId)}">
                        <td class="lg-nowrap" th:text="${rule.pack}"></td>
                        <td class="lg-main"><code class="lg-code" th:text="${rule.ruleId}"></code><span class="lg-text-muted lg-small" th:if="${explanation != null}"><br><span th:text="${explanation}"></span></span></td>
                        <td th:text="${rule.source}"></td>
                        <td class="lg-num" th:text="${rule.findings}"></td>
                        <td class="lg-num" th:text="${rule.verdicts}"></td>
                        <td class="lg-num" th:text="${rule.correct}"></td>
                        <td class="lg-num" th:text="${rule.falsePositive}"></td>
                        <td class="lg-num" th:text="${rule.notUseful}"></td>
                        <td class="lg-num" th:text="${rule.falsePositiveRate == null} ? '&mdash;' : ${#numbers.formatPercent(rule.falsePositiveRate, 1, 1)}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section id="stats-reviewers" class="lg-section" aria-labelledby="reviewers-heading">
            <h2 id="reviewers-heading" class="lg-section-title lg-section" th:text="#{stats.byreviewer.heading}"></h2>
            <div class="lg-empty" th:if="${stats.byReviewer.isEmpty()}"><p class="lg-empty__text" th:text="#{stats.byreviewer.none}"></p></div>
            <div class="lg-table-wrap" th:unless="${stats.byReviewer.isEmpty()}">
                <table class="lg-table lg-table--scroll" id="stats-reviewer-table">
                    <caption class="lg-sr-only" th:text="#{stats.byreviewer.heading}"></caption>
                    <thead>
                    <tr>
                        <th scope="col" th:text="#{stats.col.reviewer}"></th>
                        <th scope="col" th:text="#{stats.col.kind}"></th>
                        <th scope="col" class="lg-num" th:text="#{stats.col.verdicts}"></th>
                        <th scope="col" class="lg-num" th:text="#{feedback.verdict.correct}"></th>
                        <th scope="col" class="lg-num" th:text="#{feedback.verdict.false-positive}"></th>
                        <th scope="col" class="lg-num" th:text="#{feedback.verdict.not-useful}"></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="reviewer : ${stats.byReviewer}">
                        <td class="lg-wrap" th:text="${reviewer.display()}"></td>
                        <td th:text="${reviewer.kind == 'ACCOUNT'} ? #{stats.kind.account} : #{stats.kind.apikey}"></td>
                        <td class="lg-num" th:text="${reviewer.verdicts}"></td>
                        <td class="lg-num" th:text="${reviewer.correct}"></td>
                        <td class="lg-num" th:text="${reviewer.falsePositive}"></td>
                        <td class="lg-num" th:text="${reviewer.notUseful}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </th:block>
    <th:block th:if="${phraseWeeks != null}">
        <section th:replace="~{console/phrase-metrics :: weeks}"></section>
    </th:block>
</main>
</body>
</html>
