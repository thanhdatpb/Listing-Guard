<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{verify.title}"></title>
</head>
<body>
<div th:replace="~{console/layout :: demoBanner}"></div>
<main>
    <div th:replace="~{console/layout :: languageSwitch}"></div>
    <h1 th:text="#{verify.heading}"></h1>
    <div th:if="${valid}">
        <p th:text="#{verify.valid}"></p>
        <form method="post" th:action="@{/login/verify}">
            <input type="hidden" name="token" th:value="${token}">
            <button type="submit" th:text="#{verify.submit}"></button>
        </form>
    </div>
    <p th:unless="${valid}" role="alert" th:text="#{verify.invalid}"></p>
</main>
</body>
</html>
