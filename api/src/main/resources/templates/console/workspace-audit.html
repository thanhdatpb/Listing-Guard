<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{workspace.audit.title}"></title>
    <th:block th:replace="~{console/layout :: head}"></th:block>
    <th:block th:replace="~{console/layout :: htmx}"></th:block>
</head>
<body>
<!-- The background audit of the workspace (ADR-061): where each seller account stands (x of y, refreshed by htmx while a run works), the
     history of runs, the button that audits an account again (ADMIN) and a person's own switch for the e-mail. No text is written here
     (ADR-028). The progress block is a fragment that GET /console/workspace/audit/progress answers on its own. -->
<div th:replace="~{console/layout :: demoBanner}"></div>
<header th:replace="~{console/layout :: nav('workspace-audit')}"></header>
<main class="lg-page" id="workspace-audit-page">
    <span id="main" tabindex="-1"></span>
    <div class="lg-page__head">
        <div>
            <h1 th:text="#{workspace.audit.heading}"></h1>
            <p class="lg-page__sub" th:text="#{workspace.audit.intro}"></p>
        </div>
        <div class="lg-actions">
            <a class="lg-btn lg-btn--primary" id="audit-open-new" th:href="@{/console/workspace(check=NEW_RISK)}" th:text="#{workspace.audit.open.new}"></a>
        </div>
    </div>

    <th:block th:replace="~{console/workspace-fragments :: notices}"></th:block>

    <div class="lg-empty" id="audit-empty-accounts" th:unless="${hasAccounts}">
        <h2 class="lg-empty__title" th:text="#{workspace.empty.accounts.title}"></h2>
        <p class="lg-empty__text" th:text="#{workspace.empty.accounts.text}"></p>
        <p><a class="lg-btn lg-btn--primary" th:href="@{/console/workspace/accounts}" th:text="#{workspace.nav.accounts}"></a></p>
    </div>

    <section class="lg-card lg-section" id="audit-counts" aria-labelledby="audit-counts-heading" th:if="${hasAccounts}">
        <h2 id="audit-counts-heading" class="lg-card__title" th:text="#{workspace.audit.counts}"></h2>
        <ul class="lg-plain lg-state-counts">
            <li><span th:replace="~{console/workspace-fragments :: auditState('new_risk', #{workspace.audit.state.new_risk})}"></span> <a th:href="@{/console/workspace(check=NEW_RISK)}" class="lg-num" id="count-new" th:text="${counts.newRisk()}"></a></li>
            <li><span th:replace="~{console/workspace-fragments :: auditState('error', #{workspace.audit.state.error})}"></span> <a th:href="@{/console/workspace(check=ERROR)}" class="lg-num" id="count-error" th:text="${counts.error()}"></a></li>
            <li><span th:replace="~{console/workspace-fragments :: auditState('warning', #{workspace.audit.state.warning})}"></span> <a th:href="@{/console/workspace(check=WARNING)}" class="lg-num" id="count-warning" th:text="${counts.warning()}"></a></li>
            <li><span th:replace="~{console/workspace-fragments :: auditState('clean', #{workspace.audit.state.clean})}"></span> <a th:href="@{/console/workspace(check=CLEAN)}" class="lg-num" id="count-clean" th:text="${counts.clean()}"></a></li>
            <li><span th:replace="~{console/workspace-fragments :: auditState('incomplete', #{workspace.audit.state.incomplete})}"></span> <a th:href="@{/console/workspace(check=INCOMPLETE)}" class="lg-num" id="count-incomplete" th:text="${counts.incomplete()}"></a></li>
            <li><span th:replace="~{console/workspace-fragments :: auditState('none', #{workspace.check.none})}"></span> <a th:href="@{/console/workspace(check=NONE)}" class="lg-num" id="count-none" th:text="${counts.unchecked()}"></a></li>
        </ul>
        <p class="lg-text-muted lg-small" id="audit-last" th:if="${lastAudited != null}" th:text="#{workspace.audit.last(${lastAudited})}"></p>
    </section>

    <section class="lg-card lg-section" id="audit-progress-card" aria-labelledby="audit-progress-heading" th:if="${hasAccounts}">
        <h2 id="audit-progress-heading" class="lg-card__title" th:text="#{workspace.audit.progress}"></h2>
        <div th:replace="~{console/workspace-fragments :: progress}"></div>
    </section>

    <section class="lg-card lg-section" id="audit-history-card" aria-labelledby="audit-history-heading" th:if="${hasAccounts}">
        <h2 id="audit-history-heading" class="lg-card__title" th:text="#{workspace.audit.history}"></h2>
        <p class="lg-text-muted" id="audit-history-empty" th:if="${history.isEmpty()}" th:text="#{workspace.audit.history.empty}"></p>
        <div class="lg-table-wrap" th:unless="${history.isEmpty()}">
            <table class="lg-table lg-table--scroll lg-table--dense" id="audit-history">
                <caption class="lg-sr-only" th:text="#{workspace.audit.history}"></caption>
                <thead>
                <tr>
                    <th scope="col" th:text="#{workspace.audit.col.when}"></th>
                    <th scope="col" th:text="#{workspace.audit.col.account}"></th>
                    <th scope="col" th:text="#{workspace.audit.col.reason}"></th>
                    <th scope="col" th:text="#{workspace.audit.col.state}"></th>
                    <th scope="col" th:text="#{workspace.audit.col.catalog}"></th>
                    <th scope="col" th:text="#{workspace.audit.col.watchlist}"></th>
                    <th scope="col" class="lg-num" th:text="#{workspace.audit.col.listings}"></th>
                    <th scope="col" class="lg-num" th:text="#{workspace.audit.col.new}"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="run : ${history}" th:attr="data-run-status=${run.statusCode()}">
                    <td class="lg-nowrap" th:text="${run.started().isEmpty()} ? ${run.finished()} : ${run.started()}"></td>
                    <td th:text="${run.account()}"></td>
                    <td th:text="${run.reason()}"></td>
                    <td><span th:text="${run.status()}"></span><span class="lg-text-muted lg-small" th:if="${!run.note().isEmpty()}" th:text="${' — ' + run.note()}"></span></td>
                    <td class="lg-ellip" th:title="${run.catalog()}" th:text="${run.catalog().isEmpty()} ? '—' : ${run.catalog()}"></td>
                    <td><code class="lg-code" th:if="${!run.watchlist().isEmpty()}" th:text="${run.watchlist()}"></code><span class="lg-text-muted" th:if="${run.watchlist().isEmpty()}">&mdash;</span></td>
                    <td class="lg-num" th:text="${run.processed() + '/' + run.total()}"></td>
                    <td class="lg-num"><span th:text="${run.newRiskListings()}"></span></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

    <section class="lg-card lg-section" id="audit-email-card" aria-labelledby="audit-email-heading" th:if="${hasAccounts and alertsOn}">
        <h2 id="audit-email-heading" class="lg-card__title" th:text="#{workspace.audit.email}"></h2>
        <p class="lg-text-muted" th:text="#{workspace.audit.email.hint}"></p>
        <form class="lg-form" id="audit-email-form" method="post" th:action="@{/console/workspace/audit/email}">
            <label class="lg-check"><input type="checkbox" name="enabled" value="on" th:checked="${emailEnabled}"> <span th:text="#{workspace.audit.email.label}"></span></label>
            <div class="lg-actions"><button type="submit" class="lg-btn" th:text="#{workspace.audit.email.save}"></button></div>
        </form>
    </section>
</main>
</body>
</html>
