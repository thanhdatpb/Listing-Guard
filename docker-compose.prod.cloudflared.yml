# The tunnel connector. The tag is pinned on purpose (never `latest`). 2026.11.0 is the latest stable (not pre-release) release of
# https://github.com/cloudflare/cloudflared/releases at 2026-11-13 (published 2026-11-12; `gh api
# repos/cloudflare/cloudflared/releases/latest`), and `docker manifest inspect cloudflare/cloudflared:2026.11.0` lists linux/amd64
# and linux/arm64. It is a day old: if it misbehaves, 2026.10.7 (2026-10-30) is the previous stable. Check the releases page
# and update the tag before each deployment you make from this file (docs/deploy-oracle.md, "Update cloudflared").
services:
  cloudflared:
    image: cloudflare/cloudflared:2026.11.0
    profiles: ["prod"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in .env}
    command: ["tunnel", "--no-autoupdate", "run"]
