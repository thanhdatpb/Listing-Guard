services:
  cloudflared:
    image: cloudflare/cloudflared:2025.10.0
    profiles: ["prod"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in .env}
    command: ["tunnel", "--no-autoupdate", "run"]
