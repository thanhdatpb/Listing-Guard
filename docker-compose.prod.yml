services:
  postgres:
    image: pgvector/pgvector:pg16
    profiles: ["prod"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - listing_guard_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    image: ghcr.io/thanhdatpb/listing-guard:${LISTING_GUARD_VERSION:?Set LISTING_GUARD_VERSION in .env}
    profiles: ["prod"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      # Embeddings (ADR-012): none by default, so no model and no key are needed. With provider `api` the application
      # refuses to start while the key is empty.
      LISTING_GUARD_EMBEDDING_PROVIDER: ${LISTING_GUARD_EMBEDDING_PROVIDER:-none}
      LISTING_GUARD_EMBEDDING_API_KEY: ${LISTING_GUARD_EMBEDDING_API_KEY:-}
      # Client plans and the monthly quota (ADR-013): off by default, so nothing about a plan is read or enforced.
      # Give every client its plan first: docker compose run --rm admin plan set <client> <plan>
      LISTING_GUARD_PLANS_ENABLED: ${LISTING_GUARD_PLANS_ENABLED:-false}
      # Fix suggestions and the publish readiness score (ADR-014): off by default, so /checks keeps its current response.
      # The console editor shows them whatever this says.
      LISTING_GUARD_FIXES_ENABLED: ${LISTING_GUARD_FIXES_ENABLED:-false}
      # Web console (ADR-014 B2): off by default. Enabling it requires HTTPS, a fixed base URL and SMTP.
      LISTING_GUARD_CONSOLE_ENABLED: ${LISTING_GUARD_CONSOLE_ENABLED:-false}
      LISTING_GUARD_CONSOLE_BASE_URL: ${LISTING_GUARD_CONSOLE_BASE_URL:-}
      LISTING_GUARD_CONSOLE_COOKIE_SECURE: "true"
      LISTING_GUARD_CONSOLE_MAIL_FROM: ${LISTING_GUARD_CONSOLE_MAIL_FROM:-}
      # The most active API keys one console account may hold.
      LISTING_GUARD_CONSOLE_MAX_ACTIVE_KEYS: ${LISTING_GUARD_CONSOLE_MAX_ACTIVE_KEYS:-5}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-true}
      LISTING_GUARD_SWAGGER_UI: "false"
      LISTING_GUARD_POLICIES_SEARCHENDPOINT_ENABLED: "false"
    ports:
      - "127.0.0.1:${API_PORT:?Set API_PORT in .env}:8080"

  admin:
    image: ghcr.io/thanhdatpb/listing-guard:${LISTING_GUARD_VERSION:?Set LISTING_GUARD_VERSION in .env}
    profiles: ["admin"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: admin
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

volumes:
  listing_guard_postgres_data:
