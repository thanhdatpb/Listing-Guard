x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: pgvector/pgvector:pg16
    profiles: ["prod"]
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEM_LIMIT:-4g}
    logging: *default-logging
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-2GB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-16MB}
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-50}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - listing_guard_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    image: ghcr.io/thanhdatpb/listing-guard:${LISTING_GUARD_VERSION:?Set LISTING_GUARD_VERSION in .env}
    profiles: ["prod"]
    restart: unless-stopped
    mem_limit: ${API_MEM_LIMIT:-2g}
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0}
      # Embeddings (ADR-012): none by default, so no model and no key are needed. With provider `api` the application
      # refuses to start while the key is empty.
      LISTING_GUARD_EMBEDDING_PROVIDER: ${LISTING_GUARD_EMBEDDING_PROVIDER:-none}
      LISTING_GUARD_EMBEDDING_API_KEY: ${LISTING_GUARD_EMBEDDING_API_KEY:-}
      # Trademark catalog version to serve (ADR-009), as the trademark-import job printed it. Empty: trademark checks off.
      LISTING_GUARD_TRADEMARK_CATALOG_VERSION: ${TRADEMARK_CATALOG_VERSION:-}
      # Client plans and the monthly quota (ADR-013): off by default, so nothing about a plan is read or enforced.
      # Give every client its plan first: docker compose run --rm admin plan set <client> <plan>
      LISTING_GUARD_PLANS_ENABLED: ${LISTING_GUARD_PLANS_ENABLED:-false}
      # Fix suggestions and the publish readiness score (ADR-014): off by default, so /checks keeps its current response.
      # The console editor shows them whatever this says.
      LISTING_GUARD_FIXES_ENABLED: ${LISTING_GUARD_FIXES_ENABLED:-false}
      # Web console (ADR-014 B2): off by default. Enabling it requires HTTPS, a fixed base URL and SMTP.
      LISTING_GUARD_CONSOLE_ENABLED: ${LISTING_GUARD_CONSOLE_ENABLED:-false}
      LISTING_GUARD_CONSOLE_BASE_URL: ${LISTING_GUARD_CONSOLE_BASE_URL:-}
      LISTING_GUARD_CONSOLE_COOKIE_SECURE: "true"
      LISTING_GUARD_CONSOLE_MAIL_FROM: ${LISTING_GUARD_CONSOLE_MAIL_FROM:-}
      # The most active API keys one console account may hold.
      LISTING_GUARD_CONSOLE_MAX_ACTIVE_KEYS: ${LISTING_GUARD_CONSOLE_MAX_ACTIVE_KEYS:-5}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-true}
      LISTING_GUARD_SWAGGER_UI: "false"
      LISTING_GUARD_POLICIES_SEARCHENDPOINT_ENABLED: "false"
    ports:
      - "127.0.0.1:${API_PORT:?Set API_PORT in .env}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  admin:
    image: ghcr.io/thanhdatpb/listing-guard:${LISTING_GUARD_VERSION:?Set LISTING_GUARD_VERSION in .env}
    profiles: ["admin"]
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: admin
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

  # ---- one-shot trademark and batch jobs (profile `tools`; none of them starts with `--profile prod up`) ----
  # Run them with both profiles, like `admin`, so that postgres (profile `prod`) is known to Compose:
  #   docker compose -f docker-compose.prod.yml --profile prod --profile tools run --rm <job> ...
  # `run` starts only the job and the database, never the api. The image runs as uid 10001: a folder that a job writes
  # to must be writable by that uid (docs/deployment.md). No job needs a network or an embedding model.

  # Imports one catalog of catalogs/manifest.yaml from catalogs/raw/ into the database (ADR-009) and prints the version
  # to set as TRADEMARK_CATALOG_VERSION. You are responsible for checking that the terms of the data source allow this
  # use and storage.
  #   docker compose -f docker-compose.prod.yml --profile prod --profile tools run --rm trademark-import --catalog=<label>
  trademark-import:
    image: ghcr.io/thanhdatpb/listing-guard:${LISTING_GUARD_VERSION:?Set LISTING_GUARD_VERSION in .env}
    profiles: ["tools"]
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: trademark-import
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      CATALOGS_DIR: /catalogs
    volumes:
      - ./catalogs:/catalogs:ro

  # Converts USPTO Trademark Applications Daily XML files (DTD V2.0) in catalogs/raw/ to one jsonl-1 file in the same
  # folder (ADR-009): the latest record of each serial number, filtered. Unverified against real data. Local files only;
  # it still starts through the database (migrations and ruleset registration). USPTO_STRICT=true stops at the first
  # problem; USPTO_FILTERS=file:/catalogs/raw/<my-filters>.yaml names a filters file of your own. You are responsible for
  # the terms of the data.
  #   docker compose -f docker-compose.prod.yml --profile prod --profile tools run --rm uspto-convert --input=uspto/<file.xml> [--input=...] [--output=<name>.jsonl]
  #   docker compose -f docker-compose.prod.yml --profile prod --profile tools run --rm uspto-convert --input-dir=uspto --output=<name>.jsonl
  uspto-convert:
    image: ghcr.io/thanhdatpb/listing-guard:${LISTING_GUARD_VERSION:?Set LISTING_GUARD_VERSION in .env}
    profiles: ["tools"]
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: uspto-convert
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      CATALOGS_DIR: /catalogs
      LISTING_GUARD_TRADEMARK_USPTO_ALLOW_OTHER_VERSION: ${USPTO_ALLOW_OTHER_VERSION:-false}
      LISTING_GUARD_TRADEMARK_USPTO_STRICT: ${USPTO_STRICT:-false}
      LISTING_GUARD_TRADEMARK_USPTO_FILTERS: ${USPTO_FILTERS:-classpath:uspto/uspto-convert-filters-2026-11.yaml}
    volumes:
      # only raw/ is mounted, and writable: the job reads the XML there and writes the jsonl-1 file and its report there
      - ./catalogs/raw:/catalogs/raw

  # Checks every listing of a CSV export (rules and trademark) and writes findings.csv, listings.csv and summary.html to
  # batch/out/ (docs/batch-check.md). The client must exist and be active. The three settings below must equal the ones
  # of the api, or the batch counts and answers differently from the API.
  #   docker compose -f docker-compose.prod.yml --profile prod --profile tools run --rm batch-check \
  #     --input=/batch/input/<file.csv> --mapping=/batch/mappings/<mapping.yaml> --client=<client name> --marketplace=ETSY|AMAZON
  batch-check:
    image: ghcr.io/thanhdatpb/listing-guard:${LISTING_GUARD_VERSION:?Set LISTING_GUARD_VERSION in .env}
    profiles: ["tools"]
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: batch-check
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      LISTING_GUARD_TRADEMARK_CATALOG_VERSION: ${TRADEMARK_CATALOG_VERSION:-}
      LISTING_GUARD_PLANS_ENABLED: ${LISTING_GUARD_PLANS_ENABLED:-false}
      LISTING_GUARD_FIXES_ENABLED: ${LISTING_GUARD_FIXES_ENABLED:-false}
      BATCH_DIR: /batch
    volumes:
      - ./batch:/batch

  # Writes the listing health report (ADR-018): counts of the stored results of one client, or of every active client, over a
  # period, to health-report/out/<UTC timestamp>/report.html and report.json. Without --from and --to the period is the 7
  # complete UTC days before today (a run on a Monday reports the previous ISO week). It reads the database and writes files
  # only. The folder it writes to must be writable by uid 10001 (docs/deployment.md). Set TRADEMARK_CATALOG_VERSION as for the
  # api, so that the report names the catalog this deployment serves.
  #   docker compose -f docker-compose.prod.yml --profile prod --profile tools run --rm health-report \
  #     (--client=<client name|id> | --all-clients) [--from=YYYY-MM-DD --to=YYYY-MM-DD] [--marketplace=ETSY|AMAZON]
  health-report:
    image: ghcr.io/thanhdatpb/listing-guard:${LISTING_GUARD_VERSION:?Set LISTING_GUARD_VERSION in .env}
    profiles: ["tools"]
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: health-report
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      LISTING_GUARD_TRADEMARK_CATALOG_VERSION: ${TRADEMARK_CATALOG_VERSION:-}
      HEALTH_REPORT_DIR: /health-report
    volumes:
      - ./health-report:/health-report

volumes:
  listing_guard_postgres_data:
