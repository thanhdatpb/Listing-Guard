x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: pgvector/pgvector:pg16
    profiles: ["prod"]
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEM_LIMIT:-4g}
    logging: *default-logging
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-2GB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-16MB}
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-50}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - listing_guard_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    image: ghcr.io/thanhdatpb/listing-guard:${LISTING_GUARD_VERSION:?Set LISTING_GUARD_VERSION in .env}
    profiles: ["prod"]
    restart: unless-stopped
    mem_limit: ${API_MEM_LIMIT:-2g}
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0}
      # Embeddings (ADR-012): none by default, so no model and no key are needed. With provider `api` the application
      # refuses to start while the key is empty.
      LISTING_GUARD_EMBEDDING_PROVIDER: ${LISTING_GUARD_EMBEDDING_PROVIDER:-none}
      LISTING_GUARD_EMBEDDING_API_KEY: ${LISTING_GUARD_EMBEDDING_API_KEY:-}
      # Trademark catalog version to serve (ADR-009), as the trademark-import job printed it. Empty: trademark checks off.
      LISTING_GUARD_TRADEMARK_CATALOG_VERSION: ${TRADEMARK_CATALOG_VERSION:-}
      # true serves the latest activation of the catalog log instead (uspto-sync, ADR-009 PR A2d); then leave TRADEMARK_CATALOG_VERSION empty
      LISTING_GUARD_TRADEMARK_ACTIVATION_FOLLOW: ${TRADEMARK_FOLLOW_ACTIVATION:-false}
      # true adds the last USPTO TSDR status and its check date to each trademark finding (ADR-009, "TSDR status check"): an
      # optional member, never stored. Off by default: the answer is unchanged. Fill it with the tsdr-status job first.
      LISTING_GUARD_TRADEMARK_TSDR_FINDING_STATUS_ENABLED: ${TSDR_FINDING_STATUS_ENABLED:-false}
      # Client plans and the monthly quota (ADR-013): off by default, so nothing about a plan is read or enforced.
      # Give every client its plan first: docker compose run --rm admin plan set <client> <plan>
      LISTING_GUARD_PLANS_ENABLED: ${LISTING_GUARD_PLANS_ENABLED:-false}
      # Fix suggestions and the publish readiness score (ADR-014): off by default, so /checks keeps its current response.
      # The console editor shows them whatever this says.
      LISTING_GUARD_FIXES_ENABLED: ${LISTING_GUARD_FIXES_ENABLED:-false}
      # Web console (ADR-014 B2): off by default. Enabling it requires HTTPS, a fixed base URL and SMTP.
      LISTING_GUARD_CONSOLE_ENABLED: ${LISTING_GUARD_CONSOLE_ENABLED:-false}
      LISTING_GUARD_CONSOLE_BASE_URL: ${LISTING_GUARD_CONSOLE_BASE_URL:-}
      LISTING_GUARD_CONSOLE_COOKIE_SECURE: "true"
      LISTING_GUARD_CONSOLE_MAIL_FROM: ${LISTING_GUARD_CONSOLE_MAIL_FROM:-}
      # The most active API keys one console account may hold.
      LISTING_GUARD_CONSOLE_MAX_ACTIVE_KEYS: ${LISTING_GUARD_CONSOLE_MAX_ACTIVE_KEYS:-5}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-true}
      LISTING_GUARD_SWAGGER_UI: "false"
      LISTING_GUARD_POLICIES_SEARCHENDPOINT_ENABLED: "false"
    ports:
      - "127.0.0.1:${API_PORT:?Set API_PORT in .env}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  admin:
    image: ghcr.io/thanhdatpb/listing-guard:${LISTING_GUARD_VERSION:?Set LISTING_GUARD_VERSION in .env}
    profiles: ["admin"]
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: admin
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

  # ---- one-shot trademark and batch jobs (profile `tools`; none of them starts with `--profile prod up`) ----
  # Run them with both profiles, like `admin`, so that postgres (profile `prod`) is known to Compose:
  #   docker compose -f docker-compose.prod.yml --profile prod --profile tools run --rm <job> ...
  # `run` starts only the job and the database, never the api. The image runs as uid 10001: a folder that a job writes
  # to must be writable by that uid (docs/deployment.md). No job needs a network or an embedding model.

  # Imports one catalog of catalogs/manifest.yaml from catalogs/raw/ into the database (ADR-009) and prints the version
  # to set as TRADEMARK_CATALOG_VERSION. You are responsible for checking that the terms of the data source allow this
  # use and storage.
  #   docker compose -f docker-compose.prod.yml --profile prod --profile tools run --rm trademark-import --catalog=<label>
  trademark-import:
    image: ghcr.io/thanhdatpb/listing-guard:${LISTING_GUARD_VERSION:?Set LISTING_GUARD_VERSION in .env}
    profiles: ["tools"]
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: trademark-import
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      CATALOGS_DIR: /catalogs
    volumes:
      - ./catalogs:/catalogs:ro

  # Converts USPTO Trademark Applications Daily XML files (DTD V2.0) in catalogs/raw/ to one jsonl-1 file in the same
  # folder (ADR-009): the latest record of each serial number, filtered. Unverified against real data. Local files only;
  # it still starts through the database (migrations and ruleset registration). USPTO_STRICT=true stops at the first
  # problem; USPTO_FILTERS=file:/catalogs/raw/<my-filters>.yaml names a filters file of your own. You are responsible for
  # the terms of the data.
  #   docker compose -f docker-compose.prod.yml --profile prod --profile tools run --rm uspto-convert --input=uspto/<file.xml> [--input=...] [--output=<name>.jsonl]
  #   docker compose -f docker-compose.prod.yml --profile prod --profile tools run --rm uspto-convert --input-dir=uspto --output=<name>.jsonl
  uspto-convert:
    image: ghcr.io/thanhdatpb/listing-guard:${LISTING_GUARD_VERSION:?Set LISTING_GUARD_VERSION in .env}
    profiles: ["tools"]
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: uspto-convert
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      CATALOGS_DIR: /catalogs
      LISTING_GUARD_TRADEMARK_USPTO_ALLOW_OTHER_VERSION: ${USPTO_ALLOW_OTHER_VERSION:-false}
      LISTING_GUARD_TRADEMARK_USPTO_STRICT: ${USPTO_STRICT:-false}
      LISTING_GUARD_TRADEMARK_USPTO_FILTERS: ${USPTO_FILTERS:-classpath:uspto/uspto-convert-filters-2026-11.yaml}
    volumes:
      # only raw/ is mounted, and writable: the job reads the XML there and writes the jsonl-1 file and its report there
      - ./catalogs/raw:/catalogs/raw

  # Keeps a catalog of USPTO marks up to date (ADR-009, PR A2d): registers files you downloaded (--input-dir, no network)
  # or, when USPTO_SYNC_DOWNLOAD_ENABLED=true, downloads them from the USPTO Open Data Portal (every endpoint UNVERIFIED);
  # converts the backfile and every later daily file (latest transaction wins), imports a new catalog version and activates
  # it after the import succeeded. The api serves it only with TRADEMARK_FOLLOW_ACTIVATION=true. Its own profile, never
  # started by `up`. Files go to catalogs/raw/uspto-sync/ (git-ignored, writable by uid 10001). deploy/oracle/uspto-sync.sh
  # adds a host lock and a disk check. You are responsible for the terms of the data (USPTO_SYNC_LICENSE).
  #   docker compose -f docker-compose.prod.yml --profile prod --profile uspto-sync run --rm uspto-sync --backfile --input-dir=uspto-inbox/backfile --no-activate
  #   docker compose -f docker-compose.prod.yml --profile prod --profile uspto-sync run --rm uspto-sync --input-dir=uspto-inbox/daily
  uspto-sync:
    image: ghcr.io/thanhdatpb/listing-guard:${LISTING_GUARD_VERSION:?Set LISTING_GUARD_VERSION in .env}
    profiles: ["uspto-sync"]
    mem_limit: ${USPTO_SYNC_MEM_LIMIT:-3g}
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: uspto-sync
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JAVA_TOOL_OPTIONS: ${USPTO_SYNC_JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0}
      CATALOGS_DIR: /catalogs
      # the backfile holds every serial number; the default 12,000,000 of uspto-convert may be too few (unmeasured)
      LISTING_GUARD_TRADEMARK_USPTO_MAX_DISTINCT_SERIALS: ${USPTO_MAX_DISTINCT_SERIALS:-20000000}
      LISTING_GUARD_TRADEMARK_USPTO_FILTERS: ${USPTO_FILTERS:-classpath:uspto/uspto-convert-filters-2026-11.yaml}
      LISTING_GUARD_TRADEMARK_USPTO_SYNC_CATALOG_LICENSE: ${USPTO_SYNC_LICENSE:-}
      LISTING_GUARD_TRADEMARK_USPTO_SYNC_KEEP_VERSIONS: ${USPTO_SYNC_KEEP_VERSIONS:-3}
      LISTING_GUARD_TRADEMARK_USPTO_SYNC_DOWNLOAD_ENABLED: ${USPTO_SYNC_DOWNLOAD_ENABLED:-false}
      # the ODP key; sent only to the API host, never logged. Empty while the download is off.
      LISTING_GUARD_USPTO_ODP_API_KEY: ${LISTING_GUARD_USPTO_ODP_API_KEY:-}
      # ODP paths, field names and file name patterns are settings: put corrections in this file, not in code
      SPRING_CONFIG_ADDITIONAL_LOCATION: optional:file:/catalogs/raw/uspto-sync.override.yml
    volumes:
      # raw/ only, writable: the input folders, the store (raw/uspto-sync/) and the converted catalogs
      - ./catalogs/raw:/catalogs/raw

  # Checks the status of the marks of the served catalog against the USPTO TSDR (ADR-009, "TSDR status check") and reports the
  # ones recent findings still name although the TSDR says they are dead: a proposal for the next catalog sync, nothing is
  # changed. Its own profile, never started by `up`, never part of the api. The calls are off (TSDR_DOWNLOAD_ENABLED) and need
  # a key (LISTING_GUARD_TSDR_API_KEY); without them it reads TSDR files you saved yourself. The key header and the status
  # field names are UNVERIFIED; correct them in catalogs/raw/tsdr.override.yml, not in code. TRADEMARK_CATALOG_VERSION and
  # TRADEMARK_FOLLOW_ACTIVATION must equal the api's. deploy/oracle/tsdr-status.sh adds a host lock and a log.
  #   docker compose -f docker-compose.prod.yml --profile prod --profile tsdr-status run --rm tsdr-status --dry-run
  #   docker compose -f docker-compose.prod.yml --profile prod --profile tsdr-status run --rm tsdr-status --input-dir=tsdr-saved
  tsdr-status:
    image: ghcr.io/thanhdatpb/listing-guard:${LISTING_GUARD_VERSION:?Set LISTING_GUARD_VERSION in .env}
    profiles: ["tsdr-status"]
    mem_limit: ${TSDR_STATUS_MEM_LIMIT:-1g}
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: tsdr-status
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JAVA_TOOL_OPTIONS: ${TSDR_STATUS_JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0}
      CATALOGS_DIR: /catalogs
      LISTING_GUARD_TRADEMARK_CATALOG_VERSION: ${TRADEMARK_CATALOG_VERSION:-}
      LISTING_GUARD_TRADEMARK_ACTIVATION_FOLLOW: ${TRADEMARK_FOLLOW_ACTIVATION:-false}
      LISTING_GUARD_TSDR_DOWNLOAD_ENABLED: ${TSDR_DOWNLOAD_ENABLED:-false}
      # the TSDR key; sent only to the TSDR host, never logged. Empty while the calls are off.
      LISTING_GUARD_TSDR_API_KEY: ${LISTING_GUARD_TSDR_API_KEY:-}
      LISTING_GUARD_TRADEMARK_TSDR_MAX_MARKS_PER_RUN: ${TSDR_MAX_MARKS:-100}
      LISTING_GUARD_TRADEMARK_TSDR_UNMATCHED_PER_RUN: ${TSDR_UNMATCHED_PER_RUN:-0}
      LISTING_GUARD_TRADEMARK_TSDR_RECHECK_INTERVAL: ${TSDR_RECHECK_INTERVAL:-30d}
      # the key header, field names and paths are settings: put corrections in this file, not in code
      SPRING_CONFIG_ADDITIONAL_LOCATION: optional:file:/catalogs/raw/tsdr.override.yml
    volumes:
      # raw/ only, writable: the folders of saved TSDR files and the reports (raw/tsdr/out/)
      - ./catalogs/raw:/catalogs/raw

  # Checks every listing of a CSV export (rules and trademark) and writes findings.csv, listings.csv and summary.html to
  # batch/out/ (docs/batch-check.md). The client must exist and be active. The three settings below must equal the ones
  # of the api, or the batch counts and answers differently from the API.
  #   docker compose -f docker-compose.prod.yml --profile prod --profile tools run --rm batch-check \
  #     --input=/batch/input/<file.csv> --mapping=/batch/mappings/<mapping.yaml> --client=<client name> --marketplace=ETSY|AMAZON
  batch-check:
    image: ghcr.io/thanhdatpb/listing-guard:${LISTING_GUARD_VERSION:?Set LISTING_GUARD_VERSION in .env}
    profiles: ["tools"]
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: batch-check
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      LISTING_GUARD_TRADEMARK_CATALOG_VERSION: ${TRADEMARK_CATALOG_VERSION:-}
      # true serves the latest activation of the catalog log instead (uspto-sync, ADR-009 PR A2d); then leave TRADEMARK_CATALOG_VERSION empty
      LISTING_GUARD_TRADEMARK_ACTIVATION_FOLLOW: ${TRADEMARK_FOLLOW_ACTIVATION:-false}
      LISTING_GUARD_PLANS_ENABLED: ${LISTING_GUARD_PLANS_ENABLED:-false}
      LISTING_GUARD_FIXES_ENABLED: ${LISTING_GUARD_FIXES_ENABLED:-false}
      BATCH_DIR: /batch
    volumes:
      - ./batch:/batch

  # Writes the listing health report (ADR-018): counts of the stored results of one client, or of every active client, over a
  # period, to health-report/out/<UTC timestamp>/report.html and report.json. Without --from and --to the period is the 7
  # complete UTC days before today (a run on a Monday reports the previous ISO week). It reads the database and writes files
  # only. The folder it writes to must be writable by uid 10001 (docs/deployment.md). Set TRADEMARK_CATALOG_VERSION as for the
  # api, so that the report names the catalog this deployment serves.
  #   docker compose -f docker-compose.prod.yml --profile prod --profile tools run --rm health-report \
  #     (--client=<client name|id> | --all-clients) [--from=YYYY-MM-DD --to=YYYY-MM-DD] [--marketplace=ETSY|AMAZON]
  health-report:
    image: ghcr.io/thanhdatpb/listing-guard:${LISTING_GUARD_VERSION:?Set LISTING_GUARD_VERSION in .env}
    profiles: ["tools"]
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: health-report
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      LISTING_GUARD_TRADEMARK_CATALOG_VERSION: ${TRADEMARK_CATALOG_VERSION:-}
      # true serves the latest activation of the catalog log instead (uspto-sync, ADR-009 PR A2d); then leave TRADEMARK_CATALOG_VERSION empty
      LISTING_GUARD_TRADEMARK_ACTIVATION_FOLLOW: ${TRADEMARK_FOLLOW_ACTIVATION:-false}
      HEALTH_REPORT_DIR: /health-report
    volumes:
      - ./health-report:/health-report

  # Compares maintainer-saved policy documents with the stored hash snapshot; it never downloads or calls a model.
  #   docker compose -f docker-compose.prod.yml --profile prod --profile policy-diff run --rm policy-diff [--dry-run]
  policy-diff:
    image: ghcr.io/thanhdatpb/listing-guard:${LISTING_GUARD_VERSION:?Set LISTING_GUARD_VERSION in .env}
    profiles: ["policy-diff"]
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: policy-diff
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      LISTING_GUARD_POLICY_MONITOR_MANIFEST: /policies/manifest.yaml
      LISTING_GUARD_POLICY_MONITOR_RAW_DIR: /policies/raw
      LISTING_GUARD_POLICY_MONITOR_REPORT_DIR: /policy-monitor
      LISTING_GUARD_POLICY_MONITOR_STALE_DAYS: ${POLICY_MONITOR_STALE_DAYS:-90}
      LISTING_GUARD_POLICY_MONITOR_KEEP_REPORTS: ${POLICY_MONITOR_KEEP_REPORTS:-12}
    volumes:
      - ./policies:/policies:ro
      - ./policy-monitor:/policy-monitor

volumes:
  listing_guard_postgres_data:
