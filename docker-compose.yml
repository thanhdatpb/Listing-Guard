services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-listingguard}
      POSTGRES_USER: ${POSTGRES_USER:-listingguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-listingguard}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional (ADR-012): only for EMBEDDING_PROVIDER=ollama. The `ollama` profile keeps a plain `docker compose up` from
  # starting it. Start it with: docker compose --profile ollama up -d ollama
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: listing-guard-api:dev
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-listingguard}
      DB_USER: ${POSTGRES_USER:-listingguard}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-listingguard}
      # Embeddings (ADR-012): none by default, so the api starts with no model and no key; the rule checks need
      # nothing else. Policy retrieval is optional: set EMBEDDING_PROVIDER=api (with
      # LISTING_GUARD_EMBEDDING_API_KEY, a secret, in .env) or EMBEDDING_PROVIDER=ollama, see the README.
      LISTING_GUARD_EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-none}
      LISTING_GUARD_EMBEDDING_API_KEY: ${LISTING_GUARD_EMBEDDING_API_KEY:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      # Trademark catalog version to serve (ADR-009), as the trademark-import job printed it. Empty: trademark checks off.
      LISTING_GUARD_TRADEMARK_CATALOG_VERSION: ${TRADEMARK_CATALOG_VERSION:-}
      # Debug endpoint GET /policies/search; off by default in the application, on here for development.
      LISTING_GUARD_POLICIES_SEARCHENDPOINT_ENABLED: ${POLICY_SEARCH_ENABLED:-true}
      # Profile `dev` is what allows the public development key below (it is refused unless `dev` is active, and
      # never with `prod`). Set API_PROFILES to something else, and clear the key, anywhere others can reach the API.
      SPRING_PROFILES_ACTIVE: ${API_PROFILES:-dev}
      # Registered at start-up as client `dev` (32+ characters). This default is a PUBLIC development key. Real
      # clients and keys live in the database: docker compose run --rm admin client create <name>
      LISTING_GUARD_DEV_API_KEY: ${LISTING_GUARD_DEV_API_KEY-insecure-dev-key-change-me-0123456789abcdef}
      # Development only: true serves Swagger UI at /swagger-ui.html and opens it and /v3/api-docs without a key
      # (calls made from the UI still need the key). Off by default; with it off /v3/api-docs needs the key.
      LISTING_GUARD_SWAGGER_UI: ${LISTING_GUARD_SWAGGER_UI:-false}
    ports:
      - "${API_PORT:-8080}:8080"

  # ---- one-shot jobs (docker compose --profile tools ...) ----

  # Optional, only for EMBEDDING_PROVIDER=ollama: downloads the embedding model into the ollama volume. Run once:
  #   docker compose --profile ollama run --rm ollama-pull
  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${EMBEDDING_MODEL:-nomic-embed-text}"]

  # Manages clients and their API keys (ADR-007); every change is written to the log with client, key id and time.
  #   docker compose run --rm admin client create <name>
  #   docker compose run --rm admin key create <client> --label="first key"   (prints the key once)
  #   docker compose run --rm admin client list | client deactivate <name> | key list <client> | key revoke <keyId>
  admin:
    image: listing-guard-api:dev
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: admin
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-listingguard}
      DB_USER: ${POSTGRES_USER:-listingguard}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-listingguard}

  # Ingests policies/manifest.yaml and policies/raw/** into the database: docker compose run --rm ingest
  # Needs an embedding provider (EMBEDDING_PROVIDER=api or ollama); with the default `none` it fails at once and says so.
  # With `api` this sends the public policy text to Google (chunk text and section path only).
  ingest:
    image: listing-guard-api:dev
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ingest
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-listingguard}
      DB_USER: ${POSTGRES_USER:-listingguard}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-listingguard}
      LISTING_GUARD_EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-none}
      LISTING_GUARD_EMBEDDING_API_KEY: ${LISTING_GUARD_EMBEDDING_API_KEY:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      POLICIES_DIR: /policies
    volumes:
      - ./policies:/policies:ro

  # Imports one catalog of catalogs/manifest.yaml from catalogs/raw/ into the database (ADR-009). Local files only, no
  # network, no embedding provider. Prints the catalog version to set as TRADEMARK_CATALOG_VERSION.
  #   docker compose run --rm trademark-import --catalog=<version label of the manifest entry>
  # You are responsible for checking that the terms of the data source allow this use and storage.
  trademark-import:
    image: listing-guard-api:dev
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: trademark-import
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-listingguard}
      DB_USER: ${POSTGRES_USER:-listingguard}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-listingguard}
      CATALOGS_DIR: /catalogs
    volumes:
      - ./catalogs:/catalogs:ro

  # Checks every listing of a CSV export (rules and trademark) and writes findings.csv, listings.csv and summary.html
  # (docs/batch-check.md). Local files and the database only: no network, no embedding provider. Put the export in
  # batch/input/ and a mapping in batch/mappings/; the reports go to batch/out/ unless --out says otherwise.
  #   docker compose run --rm batch-check --input=/batch/input/<file.csv> --mapping=/batch/mappings/<mapping.yaml> \
  #     --client=<client name> --marketplace=ETSY|AMAZON [--out=/batch/out/<dir>] [--max-rows=<n>] [--label-column=<column>]
  # The client must exist and be active (docker compose run --rm admin client create <name>). Trademark results need
  # TRADEMARK_CATALOG_VERSION, as for the api; without it only the rules run and the reports say so.
  batch-check:
    image: listing-guard-api:dev
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: batch-check
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-listingguard}
      DB_USER: ${POSTGRES_USER:-listingguard}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-listingguard}
      LISTING_GUARD_TRADEMARK_CATALOG_VERSION: ${TRADEMARK_CATALOG_VERSION:-}
      BATCH_DIR: /batch
    volumes:
      - ./batch:/batch

  # Runs eval/retrieval/queries.yaml against the ingested corpus and writes eval/retrieval/results.md.
  # Needs an embedding provider (EMBEDDING_PROVIDER=api or ollama); with the default `none` it fails at once and says so.
  # With `api` the evaluation questions are sent to Google too. It fails if the corpus was embedded with another
  # model than the configured one.
  eval-retrieval:
    image: listing-guard-api:dev
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: eval-retrieval
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-listingguard}
      DB_USER: ${POSTGRES_USER:-listingguard}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-listingguard}
      LISTING_GUARD_EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-none}
      LISTING_GUARD_EMBEDDING_API_KEY: ${LISTING_GUARD_EMBEDDING_API_KEY:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      POLICIES_DIR: /policies
      LISTING_GUARD_EVAL_DIR: /eval/retrieval
    volumes:
      - ./policies:/policies:ro
      - ./eval:/eval

volumes:
  pgdata:
  ollama:
