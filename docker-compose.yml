services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-listingguard}
      POSTGRES_USER: ${POSTGRES_USER:-listingguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-listingguard}
    ports:
      - "${POSTGRES_BIND_HOST:-0.0.0.0}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional (ADR-012): only for EMBEDDING_PROVIDER=ollama. The `ollama` profile keeps a plain `docker compose up` from
  # starting it. Start it with: docker compose --profile ollama up -d ollama
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: listing-guard-api:dev
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-listingguard}
      DB_USER: ${POSTGRES_USER:-listingguard}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-listingguard}
      # Embeddings (ADR-012): none by default, so the api starts with no model and no key; the rule checks need
      # nothing else. Policy retrieval is optional: set EMBEDDING_PROVIDER=api (with
      # LISTING_GUARD_EMBEDDING_API_KEY, a secret, in .env) or EMBEDDING_PROVIDER=ollama, see the README.
      LISTING_GUARD_EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-none}
      LISTING_GUARD_EMBEDDING_API_KEY: ${LISTING_GUARD_EMBEDDING_API_KEY:-}
      # Free-tier LLM providers and the trademark context judge (ADR-036, docs/llm.md): off by default; the keys are secrets (.env)
      LISTING_GUARD_LLM_ENABLED: ${LISTING_GUARD_LLM_ENABLED:-false}
      LISTING_GUARD_LLM_JUDGE_ENABLED: ${LISTING_GUARD_LLM_JUDGE_ENABLED:-false}
      LISTING_GUARD_LLM_JUDGE_PROMPT_VERSION: ${LISTING_GUARD_LLM_JUDGE_PROMPT_VERSION:-trademark-judge-2026-11}
      LISTING_GUARD_LLM_GROQ_KEY: ${LISTING_GUARD_LLM_GROQ_KEY:-}
      LISTING_GUARD_LLM_GROQ_LISTING_TEXT_ALLOWED: ${LISTING_GUARD_LLM_GROQ_LISTING_TEXT_ALLOWED:-false}
      LISTING_GUARD_LLM_CLOUDFLARE_KEY: ${LISTING_GUARD_LLM_CLOUDFLARE_KEY:-}
      LISTING_GUARD_LLM_CLOUDFLARE_ACCOUNT_ID: ${LISTING_GUARD_LLM_CLOUDFLARE_ACCOUNT_ID:-unset}
      LISTING_GUARD_LLM_CLOUDFLARE_LISTING_TEXT_ALLOWED: ${LISTING_GUARD_LLM_CLOUDFLARE_LISTING_TEXT_ALLOWED:-false}
      LISTING_GUARD_LLM_GEMINI_KEY: ${LISTING_GUARD_LLM_GEMINI_KEY:-}
      LISTING_GUARD_LLM_GEMINI_LISTING_TEXT_ALLOWED: ${LISTING_GUARD_LLM_GEMINI_LISTING_TEXT_ALLOWED:-false}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      # Trademark catalog version to serve (ADR-009), as the trademark-import job printed it. Empty: trademark checks off.
      LISTING_GUARD_PHRASE_SCREENING_ENABLED: ${LISTING_GUARD_PHRASE_SCREENING_ENABLED:-false}
      LISTING_GUARD_PHRASE_SCREENING_MAX_PHRASES: ${LISTING_GUARD_PHRASE_SCREENING_MAX_PHRASES:-2000}
      LISTING_GUARD_PHRASE_SCREENING_MAX_FUZZY_PHRASES: ${LISTING_GUARD_PHRASE_SCREENING_MAX_FUZZY_PHRASES:-200}
      LISTING_GUARD_PHRASE_SCREENING_MAX_PHRASES_PER_DAY: ${LISTING_GUARD_PHRASE_SCREENING_MAX_PHRASES_PER_DAY:-20000}
      # The listing workspace (ADR-059, docs/workspace.md): the one place that stores listing text. Off by default. An import larger than the
      # multipart limit stops the start-up, so raise the two multipart variables together with the import limits.
      LISTING_GUARD_WORKSPACE_ENABLED: ${LISTING_GUARD_WORKSPACE_ENABLED:-false}
      LISTING_GUARD_WORKSPACE_MEMBER_EDIT_SCOPE: ${LISTING_GUARD_WORKSPACE_MEMBER_EDIT_SCOPE:-own}
      LISTING_GUARD_WORKSPACE_MAX_TEMPLATE_BYTES: ${LISTING_GUARD_WORKSPACE_MAX_TEMPLATE_BYTES:-10MB}
      LISTING_GUARD_WORKSPACE_IMPORT_MAX_BYTES: ${LISTING_GUARD_WORKSPACE_IMPORT_MAX_BYTES:-20MB}
      LISTING_GUARD_WORKSPACE_IMPORT_MAX_ROWS: ${LISTING_GUARD_WORKSPACE_IMPORT_MAX_ROWS:-10000}
      LISTING_GUARD_WORKSPACE_HISTORY_KEEP: ${LISTING_GUARD_WORKSPACE_HISTORY_KEEP:-20}
      # Who may import: empty is ADMIN in the workspace console mode and ADMIN,MEMBER in the classic one (ADR-064).
      LISTING_GUARD_WORKSPACE_IMPORT_ROLES: ${LISTING_GUARD_WORKSPACE_IMPORT_ROLES:-}
      LISTING_GUARD_WORKSPACE_BLOCK_ON_ERROR: ${LISTING_GUARD_WORKSPACE_BLOCK_ON_ERROR:-true}
      LISTING_GUARD_WORKSPACE_AUDIT_ENABLED: ${LISTING_GUARD_WORKSPACE_AUDIT_ENABLED:-false}
      LISTING_GUARD_WORKSPACE_AUDIT_CONCURRENCY: ${LISTING_GUARD_WORKSPACE_AUDIT_CONCURRENCY:-2}
      LISTING_GUARD_WORKSPACE_AUDIT_SCHEDULE_CRON: ${LISTING_GUARD_WORKSPACE_AUDIT_SCHEDULE_CRON:-}
      LISTING_GUARD_WORKSPACE_AUDIT_KEEP_RUNS: ${LISTING_GUARD_WORKSPACE_AUDIT_KEEP_RUNS:-30}
      # Also compare a clone with its original (ADR-039, pack clone-leftover); off: nothing changes
      LISTING_GUARD_WORKSPACE_AUDIT_CLONE_LEFTOVER: ${LISTING_GUARD_WORKSPACE_AUDIT_CLONE_LEFTOVER:-false}
      LISTING_GUARD_WORKSPACE_ALERTS_EMAIL_ENABLED: ${LISTING_GUARD_WORKSPACE_ALERTS_EMAIL_ENABLED:-false}
      LISTING_GUARD_WORKSPACE_ALERTS_EMAIL_DAILY_CAP: ${LISTING_GUARD_WORKSPACE_ALERTS_EMAIL_DAILY_CAP:-3}
      LISTING_GUARD_MULTIPART_MAX_FILE_SIZE: ${LISTING_GUARD_MULTIPART_MAX_FILE_SIZE:-10MB}
      LISTING_GUARD_MULTIPART_MAX_REQUEST_SIZE: ${LISTING_GUARD_MULTIPART_MAX_REQUEST_SIZE:-60MB}
      # The listing rulesets (listing-guard.rulesets.locations): the default is the version before the content rules of ADR-039;
      # LISTING_GUARD_ETSY_RULESET and LISTING_GUARD_AMAZON_RULESET opt in to etsy-2026-12b and amazon-2026-12d (deploy/env.pilot.example)
      LISTING_GUARD_RULESETS_LOCATIONS_0: ${LISTING_GUARD_ETSY_RULESET:-classpath:rulesets/etsy-2026-12.yaml}
      LISTING_GUARD_RULESETS_LOCATIONS_1: ${LISTING_GUARD_AMAZON_RULESET:-classpath:rulesets/amazon-2026-12c.yaml}
      LISTING_GUARD_TRADEMARK_RULESET: ${LISTING_GUARD_TRADEMARK_RULESET:-classpath:rulesets/trademark-risk-2026-11b.yaml}
      LISTING_GUARD_TRADEMARK_CATALOG_VERSION: ${TRADEMARK_CATALOG_VERSION:-}
      # true serves the latest activation of the catalog log instead (uspto-sync, ADR-009 PR A2d); then leave TRADEMARK_CATALOG_VERSION empty
      LISTING_GUARD_TRADEMARK_ACTIVATION_FOLLOW: ${TRADEMARK_FOLLOW_ACTIVATION:-false}
      # true adds the last USPTO TSDR status and its check date to each trademark finding (ADR-009, "TSDR status check"): an
      # optional member, never stored. Off by default: the answer is unchanged. Fill it with the tsdr-status job first.
      LISTING_GUARD_TRADEMARK_TSDR_FINDING_STATUS_ENABLED: ${TSDR_FINDING_STATUS_ENABLED:-false}
      # Client plans and the monthly quota (ADR-013): off by default, so nothing about a plan is read or enforced.
      # Give every client its plan first: docker compose run --rm admin plan set <client> <FREE|SELLER|PRO>
      LISTING_GUARD_PLANS_ENABLED: ${PLANS_ENABLED:-false}
      # Fix suggestions and the publish readiness score (ADR-014): off by default, so /checks keeps its current response.
      # The console editor shows them whatever this says. batch-check reads the same FIXES_ENABLED.
      LISTING_GUARD_FIXES_ENABLED: ${FIXES_ENABLED:-false}
      # Web console (ADR-014 B2): off by default. In dev, magic links are logged instead of emailed.
      LISTING_GUARD_DEMO_ENABLED: ${LISTING_GUARD_DEMO_ENABLED:-false}
      LISTING_GUARD_DEMO_CLIENT_NAME: ${LISTING_GUARD_DEMO_CLIENT_NAME:-demo}
      LISTING_GUARD_CONSOLE_ROLE_HOME_ENABLED: ${LISTING_GUARD_CONSOLE_ROLE_HOME_ENABLED:-false}
      LISTING_GUARD_CONSOLE_CATALOG_GATE_PASSED_VERSION: ${LISTING_GUARD_CONSOLE_CATALOG_GATE_PASSED_VERSION:-}
      LISTING_GUARD_CONSOLE_PILOT: ${LISTING_GUARD_CONSOLE_PILOT:-false}
      # Console mode (ADR-064): "workspace" starts the console from the listing workspace and hides the Sheet tools; it needs LISTING_GUARD_WORKSPACE_ENABLED=true.
      LISTING_GUARD_CONSOLE_MODE: ${LISTING_GUARD_CONSOLE_MODE:-classic}
      LISTING_GUARD_CONSOLE_SHEET_TOOLS: ${LISTING_GUARD_CONSOLE_SHEET_TOOLS:-false}
      LISTING_GUARD_CONSOLE_POLICY_CHANGES_ENABLED: ${LISTING_GUARD_CONSOLE_POLICY_CHANGES_ENABLED:-true}
      LISTING_GUARD_CONSOLE_POD_ENABLED: ${LISTING_GUARD_CONSOLE_POD_ENABLED:-true}
      LISTING_GUARD_IMAGE_ENABLED: ${LISTING_GUARD_IMAGE_ENABLED:-false}
      LISTING_GUARD_CONSOLE_ENABLED: ${LISTING_GUARD_CONSOLE_ENABLED:-false}
      LISTING_GUARD_CONSOLE_BASE_URL: ${LISTING_GUARD_CONSOLE_BASE_URL:-http://localhost:${API_PORT:-8080}}
      LISTING_GUARD_CONSOLE_AUTH_MODE: ${LISTING_GUARD_CONSOLE_AUTH_MODE:-MAGIC_LINK}
      LISTING_GUARD_CONSOLE_COOKIE_SECURE: ${LISTING_GUARD_CONSOLE_COOKIE_SECURE:-true}
      LISTING_GUARD_CONSOLE_MAIL_FROM: ${LISTING_GUARD_CONSOLE_MAIL_FROM:-}
      # The most active API keys one console account may hold.
      LISTING_GUARD_CONSOLE_MAX_ACTIVE_KEYS: ${LISTING_GUARD_CONSOLE_MAX_ACTIVE_KEYS:-5}
      # The most rows and bytes of one paste or file in the bulk check page.
      LISTING_GUARD_CONSOLE_BULK_MAX_ROWS: ${LISTING_GUARD_CONSOLE_BULK_MAX_ROWS:-200}
      LISTING_GUARD_CONSOLE_BULK_MAX_BYTES: ${LISTING_GUARD_CONSOLE_BULK_MAX_BYTES:-1MB}
      # The scope the bulk check offers first (ADR-052): content, full, or empty to follow the pilot profile.
      LISTING_GUARD_CONSOLE_BULK_DEFAULT_SCOPE: ${LISTING_GUARD_CONSOLE_BULK_DEFAULT_SCOPE:-}
      # The language of a console page whose reader has not chosen one (ADR-028): en or vi.
      LISTING_GUARD_CONSOLE_DEFAULT_LOCALE: ${LISTING_GUARD_CONSOLE_DEFAULT_LOCALE:-en}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-25}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      # Debug endpoint GET /policies/search; off by default in the application, on here for development.
      LISTING_GUARD_POLICIES_SEARCHENDPOINT_ENABLED: ${POLICY_SEARCH_ENABLED:-true}
      # Profile `dev` is what allows the public development key below (it is refused unless `dev` is active, and
      # never with `prod`). Set API_PROFILES to something else, and clear the key, anywhere others can reach the API.
      SPRING_PROFILES_ACTIVE: ${API_PROFILES:-dev}
      # Registered at start-up as client `dev` (32+ characters). This default is a PUBLIC development key. Real
      # clients and keys live in the database: docker compose run --rm admin client create <name>
      LISTING_GUARD_DEV_API_KEY: ${LISTING_GUARD_DEV_API_KEY-insecure-dev-key-change-me-0123456789abcdef}
      # Development only: true serves Swagger UI at /swagger-ui.html and opens it and /v3/api-docs without a key
      # (calls made from the UI still need the key). Off by default; with it off /v3/api-docs needs the key.
      LISTING_GUARD_SWAGGER_UI: ${LISTING_GUARD_SWAGGER_UI:-false}
    ports:
      - "${API_BIND_HOST:-0.0.0.0}:${API_PORT:-8080}:8080"

  # ---- one-shot jobs (docker compose --profile tools ...) ----

  # Optional, only for EMBEDDING_PROVIDER=ollama: downloads the embedding model into the ollama volume. Run once:
  #   docker compose --profile ollama run --rm ollama-pull
  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${EMBEDDING_MODEL:-nomic-embed-text}"]

  # Manages clients and their API keys (ADR-007); every change is written to the log with client, key id and time.
  #   docker compose run --rm admin client create <name>
  #   docker compose run --rm admin key create <client> --label="first key"   (prints the key once)
  #   docker compose run --rm admin client list | client deactivate <name> | key list <client> | key revoke <keyId>
  admin:
    image: listing-guard-api:dev
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: admin
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-listingguard}
      DB_USER: ${POSTGRES_USER:-listingguard}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-listingguard}
      LISTING_GUARD_DEMO_ENABLED: ${LISTING_GUARD_DEMO_ENABLED:-false}
      LISTING_GUARD_DEMO_CLIENT_NAME: ${LISTING_GUARD_DEMO_CLIENT_NAME:-demo}
      LISTING_GUARD_DEMO_CATALOG_DIR: /catalogs/demo
      LISTING_GUARD_DEMO_FEEDBACK_PERCENT: ${LISTING_GUARD_DEMO_FEEDBACK_PERCENT:-35}
      LISTING_GUARD_DEMO_FALSE_POSITIVE_PERCENT: ${LISTING_GUARD_DEMO_FALSE_POSITIVE_PERCENT:-25}
      LISTING_GUARD_CONSOLE_ENABLED: ${LISTING_GUARD_CONSOLE_ENABLED:-false}
      LISTING_GUARD_CONSOLE_PILOT: ${LISTING_GUARD_CONSOLE_PILOT:-false}
      LISTING_GUARD_PHRASE_SCREENING_ENABLED: ${LISTING_GUARD_PHRASE_SCREENING_ENABLED:-false}
      LISTING_GUARD_TRADEMARK_RULESET: ${LISTING_GUARD_TRADEMARK_RULESET:-classpath:rulesets/trademark-risk-2026-11b.yaml}
    volumes:
      - ./catalogs/demo:/catalogs/demo:ro

  # Ingests policies/manifest.yaml and policies/raw/** into the database: docker compose run --rm ingest
  # Needs an embedding provider (EMBEDDING_PROVIDER=api or ollama); with the default `none` it fails at once and says so.
  # With `api` this sends the public policy text to Google (chunk text and section path only).
  ingest:
    image: listing-guard-api:dev
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ingest
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-listingguard}
      DB_USER: ${POSTGRES_USER:-listingguard}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-listingguard}
      LISTING_GUARD_EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-none}
      LISTING_GUARD_EMBEDDING_API_KEY: ${LISTING_GUARD_EMBEDDING_API_KEY:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      POLICIES_DIR: /policies
    volumes:
      - ./policies:/policies:ro

  # Imports one catalog of catalogs/manifest.yaml from catalogs/raw/ into the database (ADR-009). Local files only, no
  # network, no embedding provider. Prints the catalog version to set as TRADEMARK_CATALOG_VERSION.
  #   docker compose run --rm trademark-import --catalog=<version label of the manifest entry>
  # You are responsible for checking that the terms of the data source allow this use and storage.
  trademark-import:
    image: listing-guard-api:dev
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: trademark-import
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-listingguard}
      DB_USER: ${POSTGRES_USER:-listingguard}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-listingguard}
      CATALOGS_DIR: /catalogs
    volumes:
      - ./catalogs:/catalogs:ro

  # Converts USPTO Trademark Applications Daily XML files (TDXF, DTD V2.0) in catalogs/raw/ to one jsonl-1 file in the same
  # folder (ADR-009, PRs A2b and A2c): for each serial number only the record with the latest transaction date, and only
  # the marks the filters keep (Nice classes, live status codes, text marks). Local files only: no network call, no catalog
  # written (the application context still starts through the database, like the other jobs: it applies migrations and
  # registers the ruleset). Prints the sha256 to put in catalogs/manifest.yaml, and writes <output>.report.json with the
  # files and the counts. UNVERIFIED against real data.
  #   docker compose run --rm uspto-convert --input=uspto/<file.xml> [--input=uspto/<file2.xml> ...] [--output=<name>.jsonl] [--overwrite] [--strict]
  #   docker compose run --rm uspto-convert --input-dir=uspto --output=<name>.jsonl [--overwrite] [--strict]
  # Another version-no than 2.0 stops it; USPTO_ALLOW_OTHER_VERSION=true reads it anyway. USPTO_STRICT=true is --strict.
  # USPTO_FILTERS=file:/catalogs/raw/<my-filters>.yaml names a filters file of your own (a copy of the shipped one with a
  # new version); the shipped one is the default.
  # You are responsible for checking that the terms of the data allow this use and storage.
  uspto-convert:
    image: listing-guard-api:dev
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: uspto-convert
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-listingguard}
      DB_USER: ${POSTGRES_USER:-listingguard}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-listingguard}
      CATALOGS_DIR: /catalogs
      LISTING_GUARD_TRADEMARK_USPTO_ALLOW_OTHER_VERSION: ${USPTO_ALLOW_OTHER_VERSION:-false}
      LISTING_GUARD_TRADEMARK_USPTO_STRICT: ${USPTO_STRICT:-false}
      LISTING_GUARD_TRADEMARK_USPTO_FILTERS: ${USPTO_FILTERS:-classpath:uspto/uspto-convert-filters-2026-11.yaml}
    volumes:
      # only raw/ is mounted, and writable: the job reads the XML there and writes the jsonl-1 file and its report there
      - ./catalogs/raw:/catalogs/raw

  # Converts the Hugging Face dataset illeatmyhat/uspto-trademarks (Parquet) in catalogs/raw/hf/ to one jsonl-1 file in
  # catalogs/raw/ (ADR-030), which trademark-import then loads like any other. Its own image (Dockerfile target hf-convert,
  # DuckDB inside), never the api's; no database, and no network unless HF_CONVERT_ALLOW_NETWORK=true (then
  # --input=hf://datasets/illeatmyhat/uspto-trademarks reads the repository directly). Prints the sha256 and a manifest entry,
  # and writes <output>.report.json. Steps: docs/trademark-catalog.md, "Hugging Face source".
  #   docker compose --profile tools run --rm --build hf-convert --input=hf --output=hf-uspto-2026-10.jsonl [--min-year=2015] [--overwrite] [--strict]
  # The dataset card says the data is a US government work (public domain), rebuilt by a third party; check it yourself.
  hf-convert:
    image: listing-guard-hf-convert:dev
    build:
      context: .
      target: hf-convert
    profiles: ["tools"]
    mem_limit: ${HF_CONVERT_MEM_LIMIT:-3g}
    environment:
      CATALOGS_DIR: /catalogs
      JAVA_TOOL_OPTIONS: ${HF_CONVERT_JAVA_TOOL_OPTIONS:--Xmx512m}
      # DuckDB's own memory (outside the Java heap); 2GB and 1500MB were measured to be enough (ADR-030), 1GB is not
      HF_CONVERT_MEMORY_LIMIT: ${HF_CONVERT_MEMORY_LIMIT:-2GB}
      HF_CONVERT_THREADS: ${HF_CONVERT_THREADS:-2}
      HF_CONVERT_ALLOW_NETWORK: ${HF_CONVERT_ALLOW_NETWORK:-false}
      HF_CONVERT_STRICT: ${HF_CONVERT_STRICT:-false}
      HF_CONVERT_MIN_YEAR: ${HF_CONVERT_MIN_YEAR:-}
      HF_FILTERS: ${HF_FILTERS:-classpath:hf/hf-convert-filters-2026-11.yaml}
    volumes:
      # only raw/ is mounted, and writable: the job reads the Parquet files there and writes the jsonl-1 file and its report
      - ./catalogs/raw:/catalogs/raw

  # Keeps a catalog of USPTO marks up to date (ADR-009, PR A2d); see docker-compose.prod.yml and docs/deploy-oracle.md.
  # Offline: put the zips you downloaded in a folder of catalogs/raw/ and pass it as --input-dir (first with --backfile).
  # The ODP download stays off unless USPTO_SYNC_DOWNLOAD_ENABLED=true (every endpoint UNVERIFIED). Set USPTO_SYNC_LICENSE.
  #   docker compose --profile uspto-sync run --rm uspto-sync --backfile --input-dir=uspto-inbox/backfile [--no-activate] [--dry-run]
  uspto-sync:
    image: listing-guard-api:dev
    profiles: ["uspto-sync"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: uspto-sync
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-listingguard}
      DB_USER: ${POSTGRES_USER:-listingguard}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-listingguard}
      CATALOGS_DIR: /catalogs
      LISTING_GUARD_TRADEMARK_USPTO_MAX_DISTINCT_SERIALS: ${USPTO_MAX_DISTINCT_SERIALS:-20000000}
      LISTING_GUARD_TRADEMARK_USPTO_FILTERS: ${USPTO_FILTERS:-classpath:uspto/uspto-convert-filters-2026-11.yaml}
      LISTING_GUARD_TRADEMARK_USPTO_SYNC_CATALOG_LICENSE: ${USPTO_SYNC_LICENSE:-}
      LISTING_GUARD_TRADEMARK_USPTO_SYNC_KEEP_VERSIONS: ${USPTO_SYNC_KEEP_VERSIONS:-3}
      LISTING_GUARD_TRADEMARK_USPTO_SYNC_DOWNLOAD_ENABLED: ${USPTO_SYNC_DOWNLOAD_ENABLED:-false}
      LISTING_GUARD_USPTO_ODP_API_KEY: ${LISTING_GUARD_USPTO_ODP_API_KEY:-}
      SPRING_CONFIG_ADDITIONAL_LOCATION: optional:file:/catalogs/raw/uspto-sync.override.yml
    volumes:
      - ./catalogs/raw:/catalogs/raw

  # Checks the status of the marks of the served catalog against the USPTO TSDR (ADR-009, "TSDR status check") and reports the
  # ones recent findings still name although the TSDR says they are dead: a proposal for the next catalog sync, nothing is
  # changed. Its own profile, never started by `up`, never part of the api. The calls are off (TSDR_DOWNLOAD_ENABLED) and need
  # a key (LISTING_GUARD_TSDR_API_KEY); without them it reads TSDR files you saved yourself. The key header and the status
  # field names are UNVERIFIED; correct them in catalogs/raw/tsdr.override.yml, not in code. The catalog settings below must
  # equal the api's, or the job picks marks from another catalog. Reports go to catalogs/raw/tsdr/out/.
  #   docker compose --profile tsdr-status run --rm tsdr-status --dry-run
  #   docker compose --profile tsdr-status run --rm tsdr-status --input-dir=tsdr-saved
  #   docker compose --profile tsdr-status run --rm tsdr-status [--max-marks=<n>]
  tsdr-status:
    image: listing-guard-api:dev
    profiles: ["tsdr-status"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: tsdr-status
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-listingguard}
      DB_USER: ${POSTGRES_USER:-listingguard}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-listingguard}
      CATALOGS_DIR: /catalogs
      LISTING_GUARD_TRADEMARK_RULESET: ${LISTING_GUARD_TRADEMARK_RULESET:-classpath:rulesets/trademark-risk-2026-11b.yaml}
      LISTING_GUARD_TRADEMARK_CATALOG_VERSION: ${TRADEMARK_CATALOG_VERSION:-}
      LISTING_GUARD_TRADEMARK_ACTIVATION_FOLLOW: ${TRADEMARK_FOLLOW_ACTIVATION:-false}
      LISTING_GUARD_TSDR_DOWNLOAD_ENABLED: ${TSDR_DOWNLOAD_ENABLED:-false}
      # the TSDR key; sent only to the TSDR host, never logged. Empty while the calls are off.
      LISTING_GUARD_TSDR_API_KEY: ${LISTING_GUARD_TSDR_API_KEY:-}
      LISTING_GUARD_TRADEMARK_TSDR_MAX_MARKS_PER_RUN: ${TSDR_MAX_MARKS:-100}
      LISTING_GUARD_TRADEMARK_TSDR_UNMATCHED_PER_RUN: ${TSDR_UNMATCHED_PER_RUN:-0}
      LISTING_GUARD_TRADEMARK_TSDR_RECHECK_INTERVAL: ${TSDR_RECHECK_INTERVAL:-30d}
      SPRING_CONFIG_ADDITIONAL_LOCATION: optional:file:/catalogs/raw/tsdr.override.yml
    volumes:
      # raw/ only, writable: the folders of saved TSDR files and the reports (raw/tsdr/out/)
      - ./catalogs/raw:/catalogs/raw

  # Checks every listing of a CSV export (rules and trademark) and writes findings.csv, listings.csv and summary.html
  # (docs/batch-check.md). Local files and the database only: no network, no embedding provider. Put the export in
  # batch/input/ and a mapping in batch/mappings/; the reports go to batch/out/ unless --out says otherwise.
  #   docker compose run --rm batch-check --input=/batch/input/<file.csv> --mapping=/batch/mappings/<mapping.yaml> \
  #     --client=<client name> --marketplace=ETSY|AMAZON [--out=/batch/out/<dir>] [--max-rows=<n>] [--label-column=<column>]
  # The client must exist and be active (docker compose run --rm admin client create <name>). Trademark results need
  # TRADEMARK_CATALOG_VERSION, as for the api; without it only the rules run and the reports say so.
  batch-check:
    image: listing-guard-api:dev
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: batch-check
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-listingguard}
      DB_USER: ${POSTGRES_USER:-listingguard}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-listingguard}
      LISTING_GUARD_TRADEMARK_RULESET: ${LISTING_GUARD_TRADEMARK_RULESET:-classpath:rulesets/trademark-risk-2026-11b.yaml}
      LISTING_GUARD_TRADEMARK_CATALOG_VERSION: ${TRADEMARK_CATALOG_VERSION:-}
      # true serves the latest activation of the catalog log instead (uspto-sync, ADR-009 PR A2d); then leave TRADEMARK_CATALOG_VERSION empty
      LISTING_GUARD_TRADEMARK_ACTIVATION_FOLLOW: ${TRADEMARK_FOLLOW_ACTIVATION:-false}
      # The same setting as the api: with plans on the batch is charged like the API and needs the `batch` pack (ADR-013).
      LISTING_GUARD_PLANS_ENABLED: ${PLANS_ENABLED:-false}
      # The same setting as the api: with fixes on, listings.csv adds readiness_score and ready and summary.html adds the
      # readiness counts (ADR-014).
      LISTING_GUARD_FIXES_ENABLED: ${FIXES_ENABLED:-false}
      BATCH_DIR: /batch
    volumes:
      - ./batch:/batch

  # Writes the listing health report (ADR-018): counts of the stored results of one client, or of every active client, over a
  # period, to health-report/out/<UTC timestamp>/report.html and report.json. Local files and the database only: no network, no
  # embedding provider, and it writes nothing to the database. Without --from and --to the period is the 7 complete UTC days
  # before today, so a run on a Monday reports the previous ISO week.
  #   docker compose run --rm health-report (--client=<client name|id> | --all-clients) [--from=YYYY-MM-DD --to=YYYY-MM-DD] [--marketplace=ETSY|AMAZON]
  # A client that is not active is refused; --all-clients selects every active client.
  health-report:
    image: listing-guard-api:dev
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: health-report
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-listingguard}
      DB_USER: ${POSTGRES_USER:-listingguard}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-listingguard}
      # The same setting as the api: the report names the trademark catalog this deployment serves.
      LISTING_GUARD_TRADEMARK_RULESET: ${LISTING_GUARD_TRADEMARK_RULESET:-classpath:rulesets/trademark-risk-2026-11b.yaml}
      LISTING_GUARD_TRADEMARK_CATALOG_VERSION: ${TRADEMARK_CATALOG_VERSION:-}
      # true serves the latest activation of the catalog log instead (uspto-sync, ADR-009 PR A2d); then leave TRADEMARK_CATALOG_VERSION empty
      LISTING_GUARD_TRADEMARK_ACTIVATION_FOLLOW: ${TRADEMARK_FOLLOW_ACTIVATION:-false}
      HEALTH_REPORT_DIR: /health-report
    volumes:
      - ./health-report:/health-report

  # Backtest (ADR-032, docs/backtest.md): runs the rule check and the trademark scan over a labelled listing file (was it
  # claimed or taken down, what about, which mark) and writes eval/backtest/out/<UTC timestamp>/report.md and report.json:
  # how many claimed listings would have been caught, why the others were missed, how often unclaimed ones are flagged.
  # Nothing is stored or charged and no client is needed. Put the file in eval/backtest/input/ (git-ignored); the mapping
  # has the batch-check format.
  #   docker compose run --rm backtest --input=/backtest/input/<file.csv> --mapping=/backtest/mappings/<mapping.yaml> \
  #     --marketplace=ETSY|AMAZON --claimed-column=<column> [--issue-column=<column>] [--mark-column=<column>]
  # Trademark results need TRADEMARK_CATALOG_VERSION (or TRADEMARK_FOLLOW_ACTIVATION), as for the api; without it only the
  # rules run and the report says so.
  backtest:
    image: listing-guard-api:dev
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: backtest
      # Free-tier LLM providers and the trademark context judge (ADR-036, docs/llm.md): off by default; the keys are secrets (.env)
      LISTING_GUARD_LLM_ENABLED: ${LISTING_GUARD_LLM_ENABLED:-false}
      LISTING_GUARD_LLM_JUDGE_ENABLED: ${LISTING_GUARD_LLM_JUDGE_ENABLED:-false}
      LISTING_GUARD_LLM_JUDGE_PROMPT_VERSION: ${LISTING_GUARD_LLM_JUDGE_PROMPT_VERSION:-trademark-judge-2026-11}
      LISTING_GUARD_LLM_GROQ_KEY: ${LISTING_GUARD_LLM_GROQ_KEY:-}
      LISTING_GUARD_LLM_GROQ_LISTING_TEXT_ALLOWED: ${LISTING_GUARD_LLM_GROQ_LISTING_TEXT_ALLOWED:-false}
      LISTING_GUARD_LLM_CLOUDFLARE_KEY: ${LISTING_GUARD_LLM_CLOUDFLARE_KEY:-}
      LISTING_GUARD_LLM_CLOUDFLARE_ACCOUNT_ID: ${LISTING_GUARD_LLM_CLOUDFLARE_ACCOUNT_ID:-unset}
      LISTING_GUARD_LLM_CLOUDFLARE_LISTING_TEXT_ALLOWED: ${LISTING_GUARD_LLM_CLOUDFLARE_LISTING_TEXT_ALLOWED:-false}
      LISTING_GUARD_LLM_GEMINI_KEY: ${LISTING_GUARD_LLM_GEMINI_KEY:-}
      LISTING_GUARD_LLM_GEMINI_LISTING_TEXT_ALLOWED: ${LISTING_GUARD_LLM_GEMINI_LISTING_TEXT_ALLOWED:-false}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-listingguard}
      DB_USER: ${POSTGRES_USER:-listingguard}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-listingguard}
      LISTING_GUARD_TRADEMARK_RULESET: ${LISTING_GUARD_TRADEMARK_RULESET:-classpath:rulesets/trademark-risk-2026-11b.yaml}
      LISTING_GUARD_TRADEMARK_CATALOG_VERSION: ${TRADEMARK_CATALOG_VERSION:-}
      LISTING_GUARD_TRADEMARK_ACTIVATION_FOLLOW: ${TRADEMARK_FOLLOW_ACTIVATION:-false}
      BACKTEST_DIR: /backtest
    volumes:
      - ./eval/backtest:/backtest

  # Scores the active rulesets against the labelled sample set eval/listing/cases/ (ADR-032) with the DEMO trademark catalog
  # and writes eval/listing/out/report.md; it fails when a verified rule's precision is below eval/listing/baseline.json.
  # --update-baseline writes the baseline from this run instead. CI runs the same comparison (ListingEvalGateTest).
  eval-listing:
    image: listing-guard-api:dev
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: eval-listing
      # Free-tier LLM providers and the trademark context judge (ADR-036, docs/llm.md): off by default; the keys are secrets (.env)
      LISTING_GUARD_LLM_ENABLED: ${LISTING_GUARD_LLM_ENABLED:-false}
      LISTING_GUARD_LLM_JUDGE_ENABLED: ${LISTING_GUARD_LLM_JUDGE_ENABLED:-false}
      LISTING_GUARD_LLM_JUDGE_PROMPT_VERSION: ${LISTING_GUARD_LLM_JUDGE_PROMPT_VERSION:-trademark-judge-2026-11}
      LISTING_GUARD_LLM_GROQ_KEY: ${LISTING_GUARD_LLM_GROQ_KEY:-}
      LISTING_GUARD_LLM_GROQ_LISTING_TEXT_ALLOWED: ${LISTING_GUARD_LLM_GROQ_LISTING_TEXT_ALLOWED:-false}
      LISTING_GUARD_LLM_CLOUDFLARE_KEY: ${LISTING_GUARD_LLM_CLOUDFLARE_KEY:-}
      LISTING_GUARD_LLM_CLOUDFLARE_ACCOUNT_ID: ${LISTING_GUARD_LLM_CLOUDFLARE_ACCOUNT_ID:-unset}
      LISTING_GUARD_LLM_CLOUDFLARE_LISTING_TEXT_ALLOWED: ${LISTING_GUARD_LLM_CLOUDFLARE_LISTING_TEXT_ALLOWED:-false}
      LISTING_GUARD_LLM_GEMINI_KEY: ${LISTING_GUARD_LLM_GEMINI_KEY:-}
      LISTING_GUARD_LLM_GEMINI_LISTING_TEXT_ALLOWED: ${LISTING_GUARD_LLM_GEMINI_LISTING_TEXT_ALLOWED:-false}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-listingguard}
      DB_USER: ${POSTGRES_USER:-listingguard}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-listingguard}
      EVAL_LISTING_DIR: /eval/listing
      EVAL_DEMO_CATALOG_DIR: /catalogs/demo
    volumes:
      - ./eval:/eval
      - ./catalogs/demo:/catalogs/demo:ro

  # Runs eval/retrieval/queries.yaml against the ingested corpus and writes eval/retrieval/results.md.
  # Needs an embedding provider (EMBEDDING_PROVIDER=api or ollama); with the default `none` it fails at once and says so.
  # With `api` the evaluation questions are sent to Google too. It fails if the corpus was embedded with another
  # model than the configured one.
  eval-retrieval:
    image: listing-guard-api:dev
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: eval-retrieval
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-listingguard}
      DB_USER: ${POSTGRES_USER:-listingguard}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-listingguard}
      LISTING_GUARD_EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-none}
      LISTING_GUARD_EMBEDDING_API_KEY: ${LISTING_GUARD_EMBEDDING_API_KEY:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      POLICIES_DIR: /policies
      LISTING_GUARD_EVAL_DIR: /eval/retrieval
    volumes:
      - ./policies:/policies:ro
      - ./eval:/eval

volumes:
  pgdata:
  ollama:
