# Etsy ruleset. Thresholds, word lists and severities live here; rule logic lives in Java (ADR-001).
#
# Successor of etsy-2026-11, which is kept unchanged as history (as is etsy-2026-10). Changes:
#   - the structured personalization questions of Etsy (the personalization_* rules), after Etsy's developer guide
#     "Personalization migration". Values that guide states are verified and rated ERROR; the instructions limit, which
#     Etsy itself describes two ways, is secondary and a WARNING;
#   - the title guidance of the Etsy Seller Handbook of August 2025 (title_word_count, title_repeated_words,
#     title_promotional_terms), secondary;
#   - banned_words switched off, because its word list never had a source.
# tag_count_underused is not in this version: it needs a fix action that adds a value (ADR-014, Deferred).
#
# Any change to this file changes its content hash. Bump `version` for every change: the API refuses to start when a
# registered version has a different hash (ADR-002).
#
# source.status:
#   verified   - confirmed against an official Etsy document
#   secondary  - official page not readable by automation, or only partly covered; see the note
#   unverified - no usable source found
marketplace: ETSY
version: etsy-2026-12
checked_at: 2026-11-06

rules:
  title_length:
    severity: ERROR
    max_length: 140
    source:
      status: verified
      urls:
        - https://www.etsy.com/ca/seller-handbook/article/28834504207
      note: Etsy Seller Handbook, title guidance.

  title_characters:
    severity: ERROR
    # One character class: a title may only contain characters matching it.
    allowed_char_class: "[\\p{L}\\p{Nd}\\p{P}\\p{Sm}\\p{Zs}™©®]"
    source:
      status: verified
      urls:
        - https://www.etsy.com/openapi/generated/oas/3.0.0.json
        - https://developers.etsy.com/documentation/reference#operation/createDraftListing
      note: Etsy Open API v3 createDraftListing, "title" - letters, numbers, punctuation, mathematical symbols, whitespace, TM, copyright, registered.

  title_repeated_special_chars:
    severity: WARNING
    # Each of these characters may appear at most max_occurrences times in a title.
    chars: ["%", ":", "&"]
    max_occurrences: 1
    source:
      status: secondary
      urls:
        - https://www.etsy.com/openapi/generated/oas/3.0.0.json
        - https://developers.etsy.com/documentation/reference#operation/createDraftListing
      note: 'The same createDraftListing text also lists "+" among the characters usable once each. The maintainers chose to check only % : & here and to rate the source secondary. Adding "+" needs a new ruleset version.'

  title_word_count:
    severity: INFO
    # A title with more words than this is reported. Every word counts, articles and prepositions included.
    max_words: 15
    source:
      status: secondary
      urls:
        - https://www.valueaddedresource.net/etsy-guidance-listing-titles-ai/
      note: 'Etsy Seller Handbook guidance on listing titles, August 2025, read in an article on valueaddedresource.net of August 21, 2025, which links the Handbook article (https://www.etsy.com/seller-handbook/article/1399426136697) but whose own page was not read: "Consider using less than 15 words when including the traits that make your item special." It is advice, not a limit Etsy enforces. The article says "less than 15"; we report a title only when it is over 15 words, as the maintainers chose, so a title of exactly 15 words is not reported.'

  title_repeated_words:
    severity: WARNING
    # A word (ignoring case) may appear at most this many times in the title.
    max_occurrences: 1
    # Prepositions, articles and conjunctions do not count. Etsy publishes no list: this one is ours (the same as Amazon's).
    exempt_words:
      - a
      - an
      - the
      - and
      - or
      - but
      - nor
      - for
      - so
      - yet
      - about
      - above
      - across
      - after
      - against
      - along
      - among
      - around
      - at
      - before
      - behind
      - below
      - beside
      - between
      - by
      - down
      - during
      - from
      - in
      - inside
      - into
      - near
      - of
      - "off"
      - "on"
      - onto
      - out
      - outside
      - over
      - past
      - through
      - to
      - toward
      - under
      - until
      - up
      - upon
      - with
      - within
      - without
    source:
      status: secondary
      urls:
        - https://www.valueaddedresource.net/etsy-guidance-listing-titles-ai/
      note: 'Same article of August 21, 2025: "Try not to repeat words." It gives no number. max_occurrences 1 is the maintainers'' reading of "do not repeat", not a figure from Etsy, which is why a finding is only a WARNING. The exempt word list is not published by Etsy and is unverified.'

  title_promotional_terms:
    severity: WARNING
    # A term is matched ignoring case, as a whole word or phrase (a term that starts or ends with a symbol, such as "% off",
    # has no word boundary on that side). One finding per term found in the title.
    terms:
      - free shipping
      - ships free
      - sale
      - "% off"
      - percent off
      - discount
      - clearance
      - coupon
    source:
      status: secondary
      urls:
        - https://www.valueaddedresource.net/etsy-guidance-listing-titles-ai/
      note: 'Same article of August 21, 2025: "Don''t worry about adding info about price, shipping, or sales. Etsy helps take care of this by badging your items in Search." The guidance is that these do not belong in a title; the article lists no phrases, so the term list is the maintainers'' own reading of "price, shipping, or sales" and is unverified.'

  tag_count:
    severity: ERROR
    max_count: 13
    source:
      status: secondary
      urls:
        - https://help.etsy.com/hc/en-us/articles/360000336307-How-to-Use-Tags-to-Get-Found-in-Search
      note: help.etsy.com blocks automated access (HTTP 403); value is consistent across secondary sources.

  tag_length:
    severity: ERROR
    max_length: 20
    source:
      status: secondary
      urls:
        - https://help.etsy.com/hc/en-us/articles/360000336307-How-to-Use-Tags-to-Get-Found-in-Search
      note: help.etsy.com blocks automated access (HTTP 403); value is consistent across secondary sources.

  tag_characters:
    severity: ERROR
    # One character class: a tag may only contain characters matching it.
    allowed_char_class: "[\\p{L}\\p{Nd}\\p{Zs}\\-'™©®]"
    source:
      status: verified
      urls:
        - https://www.etsy.com/openapi/generated/oas/3.0.0.json
        - https://developers.etsy.com/documentation/reference#operation/createDraftListing
      note: Etsy Open API v3 createDraftListing, "tags" - letters, numbers, whitespace, hyphen, apostrophe, TM, copyright, registered.

  duplicate_tags:
    severity: WARNING
    case_insensitive: true
    source:
      status: unverified
      note: No official source found for how Etsy treats duplicate tags.

  required_fields:
    severity: ERROR
    # Listing fields. "category" corresponds to Etsy taxonomy_id. "images" is deliberately not listed:
    # createDraftListing does not require it.
    fields:
      - title
      - description
      - price
      - quantity
      - who_made
      - when_made
      - category
    source:
      status: verified
      urls:
        - https://www.etsy.com/openapi/generated/oas/3.0.0.json
        - https://developers.etsy.com/documentation/reference#operation/createDraftListing
      note: Etsy Open API v3 createDraftListing required body fields.

  price_quantity_positive:
    severity: ERROR
    # A value must be strictly greater than the minimum. Missing values are RequiredFields' job.
    price_min_exclusive: 0
    quantity_min_exclusive: 0
    source:
      status: verified
      urls:
        - https://www.etsy.com/openapi/generated/oas/3.0.0.json
        - https://developers.etsy.com/documentation/reference#operation/createDraftListing
      note: Etsy Open API v3 createDraftListing - price is "the positive non-zero price", quantity is "the positive non-zero number of products".

  banned_words:
    severity: WARNING
    # Switched off in etsy-2026-12: the list below is a sample for development that was never derived from an Etsy policy,
    # so a finding from it would look like a policy verdict it is not. The rule and its words stay on record; a real list
    # backed by Etsy policy, or the policy analyzer (ADR-011), replaces it in a later version.
    enabled: false
    sample: true
    # SAMPLE LIST for development. Not derived from any Etsy policy.
    words:
      - counterfeit
      - replica
      - knockoff
    source:
      status: unverified
      note: Sample words only, switched off since etsy-2026-12 because no Etsy policy backs them; replace with a list backed by Etsy policy before switching it on.

  # ---- Structured personalization (Etsy developer guide "Personalization migration") ------------------------------------
  # Field paths start at the `personalization` block of the input (docs/input-schema.md). Every number below is read by its
  # rule; none is written in Java.

  personalization_question_count:
    severity: ERROR
    max_count: 5
    # Upload questions among them, labeled or not.
    max_upload_questions: 1
    source:
      status: verified
      urls:
        - https://developers.etsy.com/documentation/tutorials/personalization-migration/
      note: 'Etsy developer guide "Personalization migration", "Writing listing personalization data": "The `personalization_questions` array must contain between 1 and 5 elements" and "At most one upload-type question (either `unlabeled_upload` or `labeled_upload`) may be sent per listing." An empty list is no personalization, not an error.'

  personalization_question_text:
    severity: ERROR
    min_length: 1
    max_length: 45
    source:
      status: verified
      urls:
        - https://developers.etsy.com/documentation/tutorials/personalization-migration/
      note: 'Same guide, field constraints: "`question_text` - Must be between 1 and 45 characters". The guide has two more constraints on it that are not checked here: it must begin with a letter or number, and it must not contain more than one word starting with 3+ capitalized letters. A question with no text is reported as below the minimum.'

  personalization_dropdown_options:
    severity: ERROR
    min_count: 1
    max_count: 30
    max_length: 20
    # Whether "Red" and "red" are the same label. The guide does not say, so only exact repeats are reported.
    case_insensitive: false
    source:
      status: verified
      urls:
        - https://developers.etsy.com/documentation/tutorials/personalization-migration/
      note: 'Same guide, options of a dropdown: "Must contain 1 - 30 options", "Each label must be 1 - 20 characters", "Labels must be unique within the question". The guide does not say whether uniqueness ignores case or surrounding blanks, so only exact repeats (after trimming) are reported (case_insensitive false); a stricter reading would be a new ruleset version. A blank label is dropped by the input normalizer, so it cannot be reported as too short. The labels of a labeled upload question (1 - 45 characters in the guide) are not checked.'

  personalization_upload_files:
    severity: ERROR
    max_files: 10
    # A labeled upload (an upload question with options, one label per file) needs at least this many files.
    labeled_min_files: 2
    source:
      status: verified
      urls:
        - https://developers.etsy.com/documentation/tutorials/personalization-migration/
      note: 'Same guide: "`max_allowed_files` - Required for upload questions ... Must be between 1 and 10 - For `labeled_upload` questions, `max_allowed_files` must be 2 or more". Only the upper bound and the labeled minimum are checked; an upload question that sends no max_files, or a number below 1 on an unlabeled one, is not reported.'

  personalization_instructions_length:
    severity: WARNING
    max_length: 120
    source:
      status: secondary
      urls:
        - https://developers.etsy.com/documentation/tutorials/personalization-migration/
        - https://github.com/etsy/open-api/discussions/1551
      note: 'The guide says "We are introducing a 120 character limit on the `instructions` field" and "Must not exceed 120 characters when provided". In discussion 1551 (March 2026) an account answering for Etsy says that during the current migration phase `instructions` still accepts up to 256 characters, and that the 120 limit is enforced only after the general launch (GA) and only for an integration that opts in with `supports_multiple_personalization_questions`; it calls the earlier 120 in the documentation incorrect. The two statements disagree, which is why this is secondary and a WARNING, not an ERROR. The page the discussion points to for the corrected text was not read.'

  personalization_free_text_sensitive:
    # Never above INFO: the rule refuses to start otherwise.
    severity: INFO
    # A free text (TEXT) question whose text has one of these words (whole word, ignoring case) gets a reminder.
    keywords:
      - name
      - number
      - team
      - player
    source:
      status: unverified
      note: 'Our own hint, not an Etsy rule and not a trademark verdict: a buyer who can type any text can type a team or a player that is a trademark, so a dropdown whose choices the seller sets keeps that out. The word list is ours. The trademark check (POST /api/v1/trademark-checks) is separate and does not read personalization questions.'
