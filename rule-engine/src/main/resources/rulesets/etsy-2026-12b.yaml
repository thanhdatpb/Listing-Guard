# Etsy ruleset. Thresholds, word lists and severities live here; rule logic lives in Java (ADR-001).
#
# Successor of etsy-2026-11, which is kept unchanged as history (as is etsy-2026-10). Changes:
#   - the structured personalization questions of Etsy (the personalization_* rules), after Etsy's developer guide
#     "Personalization migration". Values that guide states are verified and rated ERROR; the instructions limit, which
#     Etsy itself describes two ways, is secondary and a WARNING;
#   - the title guidance of the Etsy Seller Handbook of August 2025 (title_word_count, title_repeated_words,
#     title_promotional_terms), secondary;
#   - banned_words switched off, because its word list never had a source.
# tag_count_underused is not in this version: it needs a fix action that adds a value (ADR-014, Deferred).
#
# Successor of etsy-2026-12, which is kept unchanged as history (a test pins its hash). A change inside the same month gets a letter after the
# month. Change (ADR-039): ten rules of content hygiene and of facts a copied listing tells two ways (mojibake, placeholder_leftover, whitespace,
# unbalanced_brackets, repeated_word, all_caps_ratio, size_unit_conflict, quantity_conflict, recipient_conflict, product_noun_conflict). They are
# internal quality rules, not Etsy policy: every source is unverified and every severity WARNING. Every earlier rule is copied as it was. This
# version is opt-in: the default of application.yml stays etsy-2026-12; LISTING_GUARD_ETSY_RULESET selects this one (deploy/env.pilot.example).#
# Any change to this file changes its content hash. Bump `version` for every change: the API refuses to start when a
# registered version has a different hash (ADR-002).
#
# source.status:
#   verified   - confirmed against an official Etsy document
#   secondary  - official page not readable by automation, or only partly covered; see the note
#   unverified - no usable source found
marketplace: ETSY
version: etsy-2026-12b
checked_at: 2026-11-28

rules:
  title_length:
    severity: ERROR
    max_length: 140
    source:
      status: verified
      urls:
        - https://www.etsy.com/ca/seller-handbook/article/28834504207
      note: Etsy Seller Handbook, title guidance.

  title_characters:
    severity: ERROR
    # One character class: a title may only contain characters matching it.
    allowed_char_class: "[\\p{L}\\p{Nd}\\p{P}\\p{Sm}\\p{Zs}™©®]"
    source:
      status: verified
      urls:
        - https://www.etsy.com/openapi/generated/oas/3.0.0.json
        - https://developers.etsy.com/documentation/reference#operation/createDraftListing
      note: Etsy Open API v3 createDraftListing, "title" - letters, numbers, punctuation, mathematical symbols, whitespace, TM, copyright, registered.

  title_repeated_special_chars:
    severity: WARNING
    # Each of these characters may appear at most max_occurrences times in a title.
    chars: ["%", ":", "&"]
    max_occurrences: 1
    source:
      status: secondary
      urls:
        - https://www.etsy.com/openapi/generated/oas/3.0.0.json
        - https://developers.etsy.com/documentation/reference#operation/createDraftListing
      note: 'The same createDraftListing text also lists "+" among the characters usable once each. The maintainers chose to check only % : & here and to rate the source secondary. Adding "+" needs a new ruleset version.'

  title_word_count:
    severity: INFO
    # A title with more words than this is reported. Every word counts, articles and prepositions included.
    max_words: 15
    source:
      status: secondary
      urls:
        - https://www.valueaddedresource.net/etsy-guidance-listing-titles-ai/
      note: 'Etsy Seller Handbook guidance on listing titles, August 2025, read in an article on valueaddedresource.net of August 21, 2025, which links the Handbook article (https://www.etsy.com/seller-handbook/article/1399426136697) but whose own page was not read: "Consider using less than 15 words when including the traits that make your item special." It is advice, not a limit Etsy enforces. The article says "less than 15"; we report a title only when it is over 15 words, as the maintainers chose, so a title of exactly 15 words is not reported.'

  title_repeated_words:
    severity: WARNING
    # A word (ignoring case) may appear at most this many times in the title.
    max_occurrences: 1
    # Prepositions, articles and conjunctions do not count. Etsy publishes no list: this one is ours (the same as Amazon's).
    exempt_words:
      - a
      - an
      - the
      - and
      - or
      - but
      - nor
      - for
      - so
      - yet
      - about
      - above
      - across
      - after
      - against
      - along
      - among
      - around
      - at
      - before
      - behind
      - below
      - beside
      - between
      - by
      - down
      - during
      - from
      - in
      - inside
      - into
      - near
      - of
      - "off"
      - "on"
      - onto
      - out
      - outside
      - over
      - past
      - through
      - to
      - toward
      - under
      - until
      - up
      - upon
      - with
      - within
      - without
    source:
      status: secondary
      urls:
        - https://www.valueaddedresource.net/etsy-guidance-listing-titles-ai/
      note: 'Same article of August 21, 2025: "Try not to repeat words." It gives no number. max_occurrences 1 is the maintainers'' reading of "do not repeat", not a figure from Etsy, which is why a finding is only a WARNING. The exempt word list is not published by Etsy and is unverified.'

  title_promotional_terms:
    severity: WARNING
    # A term is matched ignoring case, as a whole word or phrase (a term that starts or ends with a symbol, such as "% off",
    # has no word boundary on that side). One finding per term found in the title.
    terms:
      - free shipping
      - ships free
      - sale
      - "% off"
      - percent off
      - discount
      - clearance
      - coupon
    source:
      status: secondary
      urls:
        - https://www.valueaddedresource.net/etsy-guidance-listing-titles-ai/
      note: 'Same article of August 21, 2025: "Don''t worry about adding info about price, shipping, or sales. Etsy helps take care of this by badging your items in Search." The guidance is that these do not belong in a title; the article lists no phrases, so the term list is the maintainers'' own reading of "price, shipping, or sales" and is unverified.'

  tag_count:
    severity: ERROR
    max_count: 13
    source:
      status: secondary
      urls:
        - https://help.etsy.com/hc/en-us/articles/360000336307-How-to-Use-Tags-to-Get-Found-in-Search
      note: help.etsy.com blocks automated access (HTTP 403); value is consistent across secondary sources.

  tag_length:
    severity: ERROR
    max_length: 20
    source:
      status: secondary
      urls:
        - https://help.etsy.com/hc/en-us/articles/360000336307-How-to-Use-Tags-to-Get-Found-in-Search
      note: help.etsy.com blocks automated access (HTTP 403); value is consistent across secondary sources.

  tag_characters:
    severity: ERROR
    # One character class: a tag may only contain characters matching it.
    allowed_char_class: "[\\p{L}\\p{Nd}\\p{Zs}\\-'™©®]"
    source:
      status: verified
      urls:
        - https://www.etsy.com/openapi/generated/oas/3.0.0.json
        - https://developers.etsy.com/documentation/reference#operation/createDraftListing
      note: Etsy Open API v3 createDraftListing, "tags" - letters, numbers, whitespace, hyphen, apostrophe, TM, copyright, registered.

  duplicate_tags:
    severity: WARNING
    case_insensitive: true
    source:
      status: unverified
      note: No official source found for how Etsy treats duplicate tags.

  required_fields:
    severity: ERROR
    # Listing fields. "category" corresponds to Etsy taxonomy_id. "images" is deliberately not listed:
    # createDraftListing does not require it.
    fields:
      - title
      - description
      - price
      - quantity
      - who_made
      - when_made
      - category
    source:
      status: verified
      urls:
        - https://www.etsy.com/openapi/generated/oas/3.0.0.json
        - https://developers.etsy.com/documentation/reference#operation/createDraftListing
      note: Etsy Open API v3 createDraftListing required body fields.

  price_quantity_positive:
    severity: ERROR
    # A value must be strictly greater than the minimum. Missing values are RequiredFields' job.
    price_min_exclusive: 0
    quantity_min_exclusive: 0
    source:
      status: verified
      urls:
        - https://www.etsy.com/openapi/generated/oas/3.0.0.json
        - https://developers.etsy.com/documentation/reference#operation/createDraftListing
      note: Etsy Open API v3 createDraftListing - price is "the positive non-zero price", quantity is "the positive non-zero number of products".

  banned_words:
    severity: WARNING
    # Switched off in etsy-2026-12: the list below is a sample for development that was never derived from an Etsy policy,
    # so a finding from it would look like a policy verdict it is not. The rule and its words stay on record; a real list
    # backed by Etsy policy, or the policy analyzer (ADR-011), replaces it in a later version.
    enabled: false
    sample: true
    # SAMPLE LIST for development. Not derived from any Etsy policy.
    words:
      - counterfeit
      - replica
      - knockoff
    source:
      status: unverified
      note: Sample words only, switched off since etsy-2026-12 because no Etsy policy backs them; replace with a list backed by Etsy policy before switching it on.

  # ---- Structured personalization (Etsy developer guide "Personalization migration") ------------------------------------
  # Field paths start at the `personalization` block of the input (docs/input-schema.md). Every number below is read by its
  # rule; none is written in Java.

  personalization_question_count:
    severity: ERROR
    max_count: 5
    # Upload questions among them, labeled or not.
    max_upload_questions: 1
    source:
      status: verified
      urls:
        - https://developers.etsy.com/documentation/tutorials/personalization-migration/
      note: 'Etsy developer guide "Personalization migration", "Writing listing personalization data": "The `personalization_questions` array must contain between 1 and 5 elements" and "At most one upload-type question (either `unlabeled_upload` or `labeled_upload`) may be sent per listing." An empty list is no personalization, not an error.'

  personalization_question_text:
    severity: ERROR
    min_length: 1
    max_length: 45
    source:
      status: verified
      urls:
        - https://developers.etsy.com/documentation/tutorials/personalization-migration/
      note: 'Same guide, field constraints: "`question_text` - Must be between 1 and 45 characters". The guide has two more constraints on it that are not checked here: it must begin with a letter or number, and it must not contain more than one word starting with 3+ capitalized letters. A question with no text is reported as below the minimum.'

  personalization_dropdown_options:
    severity: ERROR
    min_count: 1
    max_count: 30
    max_length: 20
    # Whether "Red" and "red" are the same label. The guide does not say, so only exact repeats are reported.
    case_insensitive: false
    source:
      status: verified
      urls:
        - https://developers.etsy.com/documentation/tutorials/personalization-migration/
      note: 'Same guide, options of a dropdown: "Must contain 1 - 30 options", "Each label must be 1 - 20 characters", "Labels must be unique within the question". The guide does not say whether uniqueness ignores case or surrounding blanks, so only exact repeats (after trimming) are reported (case_insensitive false); a stricter reading would be a new ruleset version. A blank label is dropped by the input normalizer, so it cannot be reported as too short. The labels of a labeled upload question (1 - 45 characters in the guide) are not checked.'

  personalization_upload_files:
    severity: ERROR
    max_files: 10
    # A labeled upload (an upload question with options, one label per file) needs at least this many files.
    labeled_min_files: 2
    source:
      status: verified
      urls:
        - https://developers.etsy.com/documentation/tutorials/personalization-migration/
      note: 'Same guide: "`max_allowed_files` - Required for upload questions ... Must be between 1 and 10 - For `labeled_upload` questions, `max_allowed_files` must be 2 or more". Only the upper bound and the labeled minimum are checked; an upload question that sends no max_files, or a number below 1 on an unlabeled one, is not reported.'

  personalization_instructions_length:
    severity: WARNING
    max_length: 120
    source:
      status: secondary
      urls:
        - https://developers.etsy.com/documentation/tutorials/personalization-migration/
        - https://github.com/etsy/open-api/discussions/1551
      note: 'The guide says "We are introducing a 120 character limit on the `instructions` field" and "Must not exceed 120 characters when provided". In discussion 1551 (March 2026) an account answering for Etsy says that during the current migration phase `instructions` still accepts up to 256 characters, and that the 120 limit is enforced only after the general launch (GA) and only for an integration that opts in with `supports_multiple_personalization_questions`; it calls the earlier 120 in the documentation incorrect. The two statements disagree, which is why this is secondary and a WARNING, not an ERROR. The page the discussion points to for the corrected text was not read.'

  personalization_free_text_sensitive:
    # Never above INFO: the rule refuses to start otherwise.
    severity: INFO
    # A free text (TEXT) question whose text has one of these words (whole word, ignoring case) gets a reminder.
    keywords:
      - name
      - number
      - team
      - player
    source:
      status: unverified
      note: 'Our own hint, not an Etsy rule and not a trademark verdict: a buyer who can type any text can type a team or a player that is a trademark, so a dropdown whose choices the seller sets keeps that out. The word list is ours. The trademark check (POST /api/v1/trademark-checks) is separate and does not read personalization questions.'

  # ---- Content hygiene and clone leftovers (ADR-039) ---------------------------------------------------------------------
  # Internal quality rules, not marketplace policy: every source is unverified and every severity WARNING. A rule is optional in the engine, so
  # the ruleset that does not list it (every version before this one) is unchanged. `fields` is what the rule reads; a word list or a number is
  # read from here, none is in Java. A finding of a rule that matches text carries the span of the match, so the workspace can mark it.

  mojibake:
    severity: WARNING
    fields: [title, description, tags, materials]
    # Case-sensitive. The damage is in the exact characters: a UTF-8 text read as Windows-1252 or Latin-1, and the replacement character.
    patterns:
      - '[ÃÂ][\u0080-\u00BF]'
      - 'â€'
      - 'ï¿½'
      - '\uFFFD'
      - 'á»'
      - 'áº'
    source:
      status: unverified
      note: 'Quy tắc chất lượng nội bộ của Listing Guard (ADR-039), không phải chính sách của sàn: không có trang chính thức nào nêu nó, nên nguồn là unverified và mức mặc định là WARNING. Mẫu lấy từ các lỗi mã hoá thường gặp khi mở file UTF-8 bằng Windows-1252; danh sách là của chúng tôi.'

  placeholder_leftover:
    severity: WARNING
    fields: [title, description, tags, materials]
    report_at_most: 3
    # Ignoring case.
    patterns:
      - '\[(?:name|your[ _-]?[a-z ]{1,20}|insert[a-z ]{0,20}|enter[a-z ]{0,20}|text|date|size|colou?r|brand|item|product|title|keywords?|sku|price|placeholder|description|recipient|occasion|city|state|number|year|initials?|xx+|tbd)\]'
      - '\{\{\s*[a-z_][a-z0-9_ ]{0,30}\}\}'
      - '\{(?:name|[a-z]+_name|text|date|size|colou?r|title|sku|price|item|product|keyword|recipient|occasion|initials?)\}'
      - '<(?:name|your[a-z _-]{0,20}|insert[a-z _-]{0,20}|text|date|size|colou?r)>'
      - 'lorem\s+ipsum'
      - 'dolor\s+sit\s+amet'
      - '(?<![\p{L}\p{N}])(?:your|insert|enter|add)\s+(?:text|title|description|keywords?|name)\s+here(?![\p{L}\p{N}])'
      - '(?<![\p{L}\p{N}])\?{3,}'
    # Case-sensitive: a run of capital X or an upper-case TBD is a placeholder, "XXXL" is a size and "tbd" can be a word.
    case_sensitive_patterns:
      - '(?<![\p{L}\p{N}])X{3,}(?![\p{L}\p{N}])'
      - '(?<![\p{L}\p{N}])(?:TBD|TBA|TODO|FIXME)(?![\p{L}\p{N}])'
    source:
      status: unverified
      note: 'Quy tắc chất lượng nội bộ của Listing Guard (ADR-039), không phải chính sách của sàn: không có trang chính thức nào nêu nó, nên nguồn là unverified và mức mặc định là WARNING. Danh sách mẫu là của chúng tôi; XXX có thể là ký hiệu nụ hôn trong văn bản vui, nên rule chỉ là cảnh báo.'

  whitespace:
    severity: WARNING
    fields: [title, description, tags]
    # More spaces than this in a row between two words are reported.
    spaces_allowed: 1
    # Characters turned into a space by the fix, and characters with no width that the fix removes.
    invisible_chars: ["\t", "\u00A0", "\u2007", "\u202F"]
    zero_width_chars: ["\u200B", "\u200C", "\u200D", "\u2060", "\uFEFF"]
    # A blank before one of these marks is reported.
    space_before: [",", ";"]
    # The one rule that proposes a fix (a title and a tag are cleaned as text); the other fields get a sentence of advice.
    fix_fields: [title, tags]
    source:
      status: unverified
      note: 'Quy tắc chất lượng nội bộ của Listing Guard (ADR-039), không phải chính sách của sàn: không có trang chính thức nào nêu nó, nên nguồn là unverified và mức mặc định là WARNING. Chỉ chỗ trắng thừa; dấu xuống dòng của mô tả không bị báo, và khoảng trắng hai đầu đã bị bộ chuẩn hoá cắt từ trước.'

  unbalanced_brackets:
    severity: WARNING
    fields: [title, description]
    pairs: ["()", "[]", "{}"]
    source:
      status: unverified
      note: 'Quy tắc chất lượng nội bộ của Listing Guard (ADR-039), không phải chính sách của sàn: không có trang chính thức nào nêu nó, nên nguồn là unverified và mức mặc định là WARNING. Mặt cười như :) và số thứ tự đầu dòng như 1) không bị tính là dấu ngoặc.'

  repeated_word:
    severity: WARNING
    fields: [title, description]
    # Words of at least this many letters, the same twice in a row on one line, ignoring case.
    min_length: 2
    # Repeated on purpose: names people are called, interjections, and the few English words that can follow themselves.
    exempt_words: [mom, mum, nana, nan, gigi, pop, papa, mimi, bye, "no", ha, la, so, very, yum, go, boo, choo, wow, tick, tock, ding, dong, ho, blah, bla, hip, hooray, had, that, bora, pom, zig, zag, cha, na, yay]
    source:
      status: unverified
      note: 'Quy tắc chất lượng nội bộ của Listing Guard (ADR-039), không phải chính sách của sàn: không có trang chính thức nào nêu nó, nên nguồn là unverified và mức mặc định là WARNING. Khác title_repeated_words (đếm một từ ở bất kỳ đâu trong tiêu đề): rule này chỉ báo hai từ giống nhau đứng liền nhau. Danh sách từ được lặp có chủ ý là của chúng tôi.'

  all_caps_ratio:
    severity: WARNING
    fields: [title, description]
    # Only words of at least this many letters that have case are counted, and nothing is reported with fewer than min_words of them, so a short brand in capitals next to ordinary words is never a finding.
    min_word_letters: 3
    min_words: 3
    # The share of counted words written entirely in capitals at which a text is reported.
    caps_share_from: 0.75
    exempt_words: [usa, led, diy, pvc, bpa, gps, usb, uv, pod, rgb, pdf, svg, png, pla, abs, tpu, upc, nfl, nba, mlb, nhl, ufc, wwe, bmw, nyc, dna, fda, ipad, iphone, ps5, xbox]
    source:
      status: unverified
      note: 'Quy tắc chất lượng nội bộ của Listing Guard (ADR-039), không phải chính sách của sàn: không có trang chính thức nào nêu nó, nên nguồn là unverified và mức mặc định là WARNING. Ngưỡng và danh sách chữ viết tắt là của chúng tôi.'

  size_unit_conflict:
    severity: WARNING
    # The text that says what the listing is (the title) is compared with each text of `against`.
    anchor: title
    against: [description, tags]
    # A value in a sentence that lists options ("available in 11oz or 15oz") says nothing about which one this listing is.
    ambiguity_markers: [available, choose, select, option, options, variation, variations, pick, also, comes in, come in, sizes, offered, optional]
    ambiguity_before: 40
    ambiguity_after: 20
    # A size is a number with one of these units; the family of a size is its unit, so 11 oz is compared with other ounces, never with inches.
    units:
      oz: [oz, ounce, ounces, fl oz, fl. oz]
      ml: [ml, milliliter, milliliters, millilitre, millilitres]
      l: [liter, liters, litre, litres]
      gal: [gal, gallon, gallons]
      in: [inch, inches, in., '"', "\u201D"]
      cm: [cm, centimeter, centimeters, centimetre, centimetres]
      mm: [mm, millimeter, millimeters]
      ft: [ft, ft., foot, feet]
      lb: [lb, lbs, pound, pounds]
      kg: [kg, kilogram, kilograms]
      g: [gram, grams]
    # Units that can carry a second dimension (12 x 16 inch); "2 x 11oz" is a count and a size.
    dimension_units: [in, cm, mm, ft]
    # A number near one of these words measures a part or a weight of the product, not its size.
    ignore_words: [weigh, weighs, weighing, weight, thick, thickness, deep, depth, handle, diameter, height, tall, base, rim, opening, strap, cord, chain, length, wide, width]
    ignore_before: 25
    ignore_after: 12
    source:
      status: unverified
      note: 'Quy tắc chất lượng nội bộ của Listing Guard (ADR-039), không phải chính sách của sàn: không có trang chính thức nào nêu nó, nên nguồn là unverified và mức mặc định là WARNING. Nhận kích cỡ có đơn vị (11oz, 12 x 16 inch); kích cỡ không có đơn vị (S, M, ''size 11'') không được đọc.'

  quantity_conflict:
    severity: WARNING
    # The text that says what the listing is (the title) is compared with each text of `against`.
    anchor: title
    against: [description, tags]
    # A value in a sentence that lists options ("available in 11oz or 15oz") says nothing about which one this listing is.
    ambiguity_markers: [available, choose, select, option, options, variation, variations, pick, also, comes in, come in, sizes, offered, optional]
    ambiguity_before: 40
    ambiguity_after: 20
    # Each expression has the number (or a number word) as its first group. A number tied to no count word is not read.
    patterns:
      - '(?<![\p{L}\p{N}])(?:pack|set|bundle|lot|box|case|pair|kit)s?\s+of\s+(\d{1,4}|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|dozen)(?![\p{L}\p{N}])(?!\s?(?:oz|ml|cm|mm|inch|inches|ft|lbs?|kg|gal|fl)(?![\p{L}]))'
      - '(?<![\p{L}\p{N}.,/-])(\d{1,4})[\s-]?(?:pack|pk|pcs?|pieces?|count|ct|pairs?)(?![\p{L}\p{N}])'
      - '(?<![\p{L}\p{N}])(?:qty|quantity)\s*[:=x]?\s*(\d{1,4})(?![\p{L}\p{N}])'
    number_words: {one: "1", two: "2", three: "3", four: "4", five: "5", six: "6", seven: "7", eight: "8", nine: "9", ten: "10", eleven: "11", twelve: "12", dozen: "12"}
    source:
      status: unverified
      note: 'Quy tắc chất lượng nội bộ của Listing Guard (ADR-039), không phải chính sách của sàn: không có trang chính thức nào nêu nó, nên nguồn là unverified và mức mặc định là WARNING. Chỉ đọc số đi kèm từ chỉ số lượng (pack of 2, 4 pieces); số không gắn với từ đó không được đọc.'

  recipient_conflict:
