# TEST ruleset: exercises category overrides (ADR-006) with made-up product types TESTBAG and TESTMUG.
# It is never loaded by the application; the real amazon ruleset has no category overrides yet.
marketplace: AMAZON
version: test-categories-1
checked_at: 2026-10-28

rules:
  required_fields:
    severity: ERROR
    fields:
      - product_type
    source:
      status: verified
      urls:
        - https://example.com/default
    categories:
      TESTBAG:
        fields:
          - product_type
          - brand
          - title
        source:
          status: verified
          urls:
            - https://example.com/testbag-schema

  title_length:
    severity: WARNING
    max_length: 100
    source:
      status: secondary
      urls:
        - https://example.com/default
    categories:
      TESTBAG:
        severity: ERROR
        max_length: 60
        source:
          status: verified
          urls:
            - https://example.com/testbag-schema
      testmug:
        max_length: 80
        source:
          status: secondary
          urls:
            - https://example.com/testmug-style-guide

  title_repeated_words:
    severity: WARNING
    max_occurrences: 2
    exempt_words: [the]
    source:
      status: unverified

  title_forbidden_chars:
    severity: WARNING
    chars: ["!"]
    source:
      status: unverified

  bullet_count:
    severity: WARNING
    max_count: 5
    source:
      status: unverified
    categories:
      TESTMUG:
        enabled: false
        source:
          status: unverified
          note: This product type has no bullet points.

  bullet_length:
    severity: WARNING
    enabled: false
    max_length: 50
    source:
      status: unverified
    categories:
      TESTMUG:
        enabled: true
        max_length: 10
        source:
          status: secondary
          urls:
            - https://example.com/testmug-style-guide

  item_highlights_length:
    severity: WARNING
    max_length: 30
    source:
      status: unverified

  description_length:
    severity: WARNING
    max_length: 60
    source:
      status: unverified

  search_terms_length:
    severity: WARNING
    max_bytes: 20
    source:
      status: unverified

  prohibited_content:
    severity: WARNING
    fields: [title]
    patterns:
      url: '(?i)\bwww\.\S+'
    source:
      status: unverified

  customization_text_input_count:
    severity: WARNING
    max_count: 4
    source:
      status: unverified

  customization_dropdown_options:
    severity: WARNING
    max_count: 6
    case_insensitive: false
    source:
      status: unverified

  customization_image_input_count:
    severity: WARNING
    max_count: 2
    source:
      status: unverified
    categories:
      TESTMUG:
        max_count: 3
        source:
          status: secondary
          urls:
            - https://example.com/testmug-style-guide

  customization_text_input_max_chars:
    severity: WARNING
    source:
      status: unverified

  customization_free_text_sensitive:
    severity: INFO
    keywords: [name]
    source:
      status: unverified

  category_not_covered:
    severity: INFO
    source:
      status: unverified
