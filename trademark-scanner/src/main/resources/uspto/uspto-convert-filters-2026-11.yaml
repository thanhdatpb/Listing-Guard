# What the USPTO converter keeps (ADR-009, PR A2c): the Nice classes, the status codes that count as live, whether a mark
# needs words, and how a date is read from a file name. A published version is immutable (ADR-002): change anything in a
# new file with a new `version`, and name it in listing-guard.trademark.uspto.filters.
#
# Everything here is the maintainer's choice and is `unverified`: not checked against a real file, not a USPTO statement
# and not a legal conclusion.
#
# nice_classes       keep a record that has at least one of these classes (1 to 45); the record is written with all its
#                    classes. The list is the Nice classes of the product types of ruleset trademark-risk-2026-11b
#                    (9 phone cases, 14 jewelry, 16 paper goods, 18 bags, 20 furniture, 21 household goods and mugs,
#                    24 textiles, 25 clothing, 28 toys) plus 26 (haberdashery, patches, buttons). A class outside the list
#                    is a mark the scanner will never warn about.
# live_status_codes  the three-digit status codes of Table 1 "Trademark Status Codes" of the "Trademark Applications Daily
#                    XML DTD Element Documentation (V2.0)" (table updated 06/24/2005,
#                    https://www.uspto.gov/sites/default/files/products/applications-documentation.pdf) that count as live.
#                    A mark whose LATEST record has any other code is left out of the catalog. Quote every code: an
#                    unquoted 000 or 080 is not read as the text it looks like. The shipped list is every code that
#                    uspto-status-map-2026-11.yaml sends to REGISTERED or PENDING (a test holds that the two agree); each
#                    code must be in that map and must not be DROP.
# text_only          true: a mark with no words (mark drawing code 2, 6 or none) is dropped
# file_name_dates    patterns, tried in order, that read a date from the file name (named groups `year` or `yy` (read as
#                    20yy), `month` and `day`). The date is the second key of the order of two records with the same
#                    transaction date. The `apcYYMMDD` form is the name the bulk-data product is believed to use: unverified.
version: uspto-convert-filters-2026-11
format: trademark-applications-daily V2.0
checked_at: 2026-11-11
source:
  status: unverified
  note: The maintainer's choice, from Table 1 of the public V2.0 element documentation and the Nice classes of the product types; not checked against a real file.
nice_classes: [9, 14, 16, 18, 20, 21, 24, 25, 26, 28]
text_only: true
live_status_codes: [
    "400", "403", "612", "616", "620", "624", "625", "630", "631", "638", "640", "641", "642", "643", "644", "645",
    "646", "647", "648", "649", "650", "651", "652", "653", "654", "655", "656", "657", "658", "659", "660", "661",
    "663", "664", "665", "666", "667", "668", "672", "673", "680", "681", "682", "686", "688", "689", "690", "692",
    "693", "694", "700", "701", "702", "703", "704", "705", "715", "717", "718", "719", "720", "721", "722", "724",
    "725", "730", "731", "732", "733", "734", "740", "744", "745", "746", "748", "752", "753", "756", "757", "760",
    "762", "763", "764", "765", "766", "771", "772", "773", "774", "775", "777", "778", "779", "780", "790", "794",
    "800", "801", "802", "803", "804", "806", "807", "808", "809", "810", "811", "812", "813", "814", "815", "816",
    "817", "818", "819", "820", "821", "822", "823", "824", "825"
]
file_name_dates:
  - '(?<![0-9])(?<year>[0-9]{4})(?<month>[0-9]{2})(?<day>[0-9]{2})(?![0-9])'
  - '(?<![A-Za-z0-9])apc(?<yy>[0-9]{2})(?<month>[0-9]{2})(?<day>[0-9]{2})(?![0-9])'
