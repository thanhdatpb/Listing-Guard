# Map from the status codes of the USPTO Trademark Applications Daily XML (TDXF, DTD V2.0) to the status of a catalog
# record (ADR-009, PR A2b). A published version is immutable (ADR-002): change a code, a status or a basis in a new
# file with a new `version`.
#
# The codes and their meaning are Table 1 "Trademark Status Codes" of the "Trademark Applications Daily XML DTD Element
# Documentation (V2.0)", table updated 06/24/2005:
#   https://www.uspto.gov/sites/default/files/products/applications-documentation.pdf
# This file is the maintainer's reading of that table. It is not a USPTO statement and not a legal conclusion, and its
# source status is `unverified`.
#
# status  REGISTERED | PENDING | EXPIRED | CANCELLED are the catalog statuses. DROP is not one: the converter leaves the
#         record out and counts it by code (the code carries no status of the mark itself).
# basis   table       the wording of Table 1 says it
#         maintainer  the table does not settle it; the maintainer chose by one rule: the tool warns, and a warning too
#                     many is better than a risk missed. A code that may still be alive is PENDING, one that is
#                     certainly dead is CANCELLED, one that has no status of the mark at all is DROP.
#                     The registration number is not used to decide (ADR-009).
